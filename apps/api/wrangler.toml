name = "clessia-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ⚠️ 這個檔案會進版控 —— **只放非機密設定**。
#
# 機密（SUPABASE_SECRET_KEY、BETTER_AUTH_SECRET、DATABASE_URL）一律走
#   npx wrangler secret put <NAME> --env production
# 本機開發放 apps/api/.dev.vars（已 gitignore）。
#
# 每個客戶是自己的部署、自己的網域（憲法 c12），所以正式站的值不寫在這裡，
# 由部署時設定。見 kb/wiki/architecture/deploying.md

[vars]
ENVIRONMENT = "development"
WEB_URL = "http://localhost:4200"
BETTER_AUTH_URL = "http://localhost:8787"
ALLOWED_ORIGINS = ""
SUPABASE_URL = "http://127.0.0.1:54321"
PLACEHOLDER_EMAIL_DOMAIN = "phone.internal"

# ── 正式環境 ──────────────────────────────────────────────────────────────
# 部署：npx wrangler deploy --env production
# 這裡只列非機密項；每個客戶部署時覆寫成自己的值。
[env.production]
name = "clessia-api-production"

[env.production.vars]
# ⚠️ 這裡必須列出**全部**非機密設定 —— wrangler 的 env 不繼承頂層 vars，而用 `--var`
# 跟著部署指令給的值**只活在那一次部署**：下一個人裸跑 `wrangler deploy` 就會把它們
# 全部丟掉（2026-08-29 就這樣把正式站的 LINE 登入弄斷了 —— PROVIDER_NOT_FOUND）。
# 機密（DATABASE_URL 等四個）走 `wrangler secret put`，跨部署保留，不在這裡。
ENVIRONMENT = "production"
PLACEHOLDER_EMAIL_DOMAIN = "phone.internal"
WEB_URL = "https://demo.clessia.cc"
BETTER_AUTH_URL = "https://demo.clessia.cc"
ALLOWED_ORIGINS = ""
SUPABASE_URL = "https://hjzfitxusqvpllpjtkkf.supabase.co"
LINE_CLIENT_ID = "2011235423"
# WEB_URL / BETTER_AUTH_URL / ALLOWED_ORIGINS / SUPABASE_URL 由部署時設定：
#   npx wrangler deploy --env production \
#     --var WEB_URL:https://xxx.pages.dev \
#     --var BETTER_AUTH_URL:https://clessia-api-production.xxx.workers.dev \
#     --var ALLOWED_ORIGINS:https://xxx.pages.dev \
#     --var SUPABASE_URL:https://<ref>.supabase.co
