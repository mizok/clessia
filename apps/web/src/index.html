<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <title>Clessia</title>
    <base href="/" />
    <!-- maximum-scale=1：iOS Safari 聚焦 < 16px 的輸入框不再自動放大整頁（使用者 10-22 裁，#1867）。
         刻意不加 user-scalable=no —— iOS 10+ 會忽略 scale 限制，兩指放大仍可用；Android Chrome 會擋，是接受的取捨 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <!--
    #1595 P3a：/api/me 在這裡就先發，跟 main.js 的下載＋bootstrap 重疊，不用等 Angular 起來才問。
    AuthService 首次載入接手這個 promise（見 takeEarlyMe）；失敗、逾時、回的不是 JSON
    （例如本機 dev server 沒有 /api）就退回原本的 HttpClient 請求。授權判斷不受影響 ——
    guard 一樣等這個回應才放行，這裡只是讓它早點出發。
    鑰匙名同 ACTIVE_ROLE_STORAGE_KEY（auth.service.ts），改名兩邊一起改。
  -->
    <script>
      try {
        var role = localStorage.getItem('clessia:active-role');
        window.__clessiaEarlyMe = fetch('/api/me', {
          credentials: 'include',
          headers: role ? { 'X-Active-Role': role } : {},
        });
      } catch (e) {}
      // 同一個理由先發 /api/system-time（#1595 1a）：開站的 AppInitializer 要等它對完時才導覽。
      // `at` 記回應到達當下，SystemClockService 拿它當基準點（見 takeEarlyTime）
      try {
        window.__clessiaEarlyTime = fetch('/api/system-time').then(function (r) {
          var at = performance.now();
          return r.json().then(function (body) {
            return { body: r.ok ? body : null, at: at };
          });
        });
        window.__clessiaEarlyTime.catch(function () {});
      } catch (e) {}
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- PWA（#1663）：加入主畫面後才能在 iOS 收推播（設計稿 web-push.md §4） -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#ff6a3d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
    字型 CSS 非阻塞載入（#1595 P4-1）。之前 build 會把這份 CSS 整份內嵌進 index.html
    （optimization.fonts.inline）：496KB／brotli 後約 36KB，全卡在首屏前，現在已在 project.json 關掉。
    - media="print" → onload 換成 all：不擋首次繪製；字型到了照 display=swap 換上（本來就是 swap）
    - 字重寫範圍（400..800）而不是逐一列：Google 給的本來就是可變字型，逐一列會把同一個檔
      宣告 4 次（467 條 @font-face → 115 條，同一批檔案）
    - 不能改成一般的 <link rel=stylesheet> 外連：那會擋首次繪製，實測手機 FCP 2.1 秒
  -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Noto+Sans+TC:wght@400..700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Noto+Sans+TC:wght@400..700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!--
    開站畫面。Angular bootstrap 之後會把 <app-root> 的內容整個換掉，所以這段只活到
    第一次 render 為止 —— 刻意是純 HTML/CSS 零依賴，它要在任何 JS 下載完成之前就看得見。

    色值是字面量而不是 var(--zinc-100) 之類：index.html 讀不到 styles.css 的 token。
    在這裡重新宣告一次同名變數，讓「跟 token 一致」這件事至少有個對照點 —— 值變了要兩邊都改。
    底色必須跟 body 的 --zinc-100 一樣，否則 Angular 接手的那一刻會閃一下。

    這裡只放第一屏會用到的東西。index.html 是每次載入都要下載的東西，塞大了就是拿
    白畫面換閃爍。
  -->
    <style>
      /*
       * #991 T4：PrimeNG overlay 在 runtime 逐一掃 document.styleSheets 找 `-anchor-gutter`，
       * 碰到沒有 .style 的規則（@charset、@layer…）就丟例外、**整支樣式表跳過**。
       * Aura 的定義進了 @layer primeng、styles.css 開頭是 @charset，兩邊都找不到 →
       * 下拉跟觸發鈕之間的 2px 消失。所以放在這支 <style> 的**第一條**。值同 Aura 預設。
       */
      :root {
        --p-anchor-gutter: 2px;
      }
      .app-splash {
        --app-splash-surface: #f4f4f5; /* zinc-100，與 body 同底 */
        --app-splash-ink: #18181b; /* zinc-900 */
        --app-splash-accent: #ff6a3d; /* accent-vivid */

        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background-color: var(--app-splash-surface);
        font-family:
          'Inter',
          'Noto Sans TC',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      .app-splash__brand {
        margin: 0;
        color: var(--app-splash-ink);
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.12em;
      }

      .app-splash__dots {
        display: flex;
        gap: 8px;
      }

      .app-splash__dot {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background-color: var(--app-splash-accent);
        animation: app-splash-pulse 1.2s ease-in-out infinite;
      }

      .app-splash__dot:nth-child(2) {
        animation-delay: 0.16s;
      }

      .app-splash__dot:nth-child(3) {
        animation-delay: 0.32s;
      }

      @keyframes app-splash-pulse {
        0%,
        80%,
        100% {
          opacity: 0.25;
        }
        40% {
          opacity: 1;
        }
      }

      /* 動畫是唯一的「還在跑」訊號，所以不是關掉而是換成靜態的中間狀態 —— 三個點還在，
       只是不動。 */
      @media (prefers-reduced-motion: reduce) {
        .app-splash__dot {
          animation: none;
          opacity: 0.55;
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="app-splash">
        <p class="app-splash__brand">CLESSIA</p>
        <div class="app-splash__dots" role="status" aria-label="載入中">
          <span class="app-splash__dot"></span>
          <span class="app-splash__dot"></span>
          <span class="app-splash__dot"></span>
        </div>
      </div>
    </app-root>
  </body>
</html>
