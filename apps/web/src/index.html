<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <title>Clessia</title>
    <base href="/" />
    <!-- maximum-scale=1：iOS Safari 聚焦 < 16px 的輸入框不再自動放大整頁（使用者 10-22 裁，#1867）。
         刻意不加 user-scalable=no —— iOS 10+ 會忽略 scale 限制，兩指放大仍可用；Android Chrome 會擋，是接受的取捨 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <!--
    #1595 P3a：/api/me 在這裡就先發，跟 main.js 的下載＋bootstrap 重疊，不用等 Angular 起來才問。
    AuthService 首次載入接手這個 promise（見 takeEarlyMe）；失敗、逾時、回的不是 JSON
    （例如本機 dev server 沒有 /api）就退回原本的 HttpClient 請求。授權判斷不受影響 ——
    guard 一樣等這個回應才放行，這裡只是讓它早點出發。
    鑰匙名同 ACTIVE_ROLE_STORAGE_KEY（auth.service.ts），改名兩邊一起改。
  -->
    <script>
      try {
        var role = localStorage.getItem('clessia:active-role');
        window.__clessiaEarlyMe = fetch('/api/me', {
          credentials: 'include',
          headers: role ? { 'X-Active-Role': role } : {},
        });
      } catch (e) {}
      // 同一個理由先發 /api/system-time（#1595 1a）：開站的 AppInitializer 要等它對完時才導覽。
      // `at` 記回應到達當下，SystemClockService 拿它當基準點（見 takeEarlyTime）
      try {
        window.__clessiaEarlyTime = fetch('/api/system-time').then(function (r) {
          var at = performance.now();
          return r.json().then(function (body) {
            return { body: r.ok ? body : null, at: at };
          });
        });
        window.__clessiaEarlyTime.catch(function () {});
      } catch (e) {}
    </script>

    <!-- PWA（#1663）：加入主畫面後才能在 iOS 收推播（設計稿 web-push.md §4） -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <!-- 主畫面底下的字（使用者 11-11 改「學程管家」）：新 iOS 讀 manifest 的 short_name，舊 iOS 讀這個 meta -->
    <meta name="apple-mobile-web-app-title" content="學程管家" />
    <meta name="theme-color" content="#ff6a3d" />

    <!--
    字型 CSS 非阻塞載入（#1595 P4-1）。之前 build 會把這份 CSS 整份內嵌進 index.html
    （optimization.fonts.inline）：496KB／brotli 後約 36KB，全卡在首屏前，現在已在 project.json 關掉。
    - media="print" → onload 換成 all：不擋首次繪製；字型到了照 display=swap 換上（本來就是 swap）
    - 字重寫範圍（400..800）而不是逐一列：Google 給的本來就是可變字型，逐一列會把同一個檔
      宣告 4 次（467 條 @font-face → 115 條，同一批檔案）
    - 不能改成一般的 <link rel=stylesheet> 外連：那會擋首次繪製，實測手機 FCP 2.1 秒
  -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Noto+Sans+TC:wght@400..700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Noto+Sans+TC:wght@400..700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      /*
       * #991 T4：PrimeNG overlay 在 runtime 逐一掃 document.styleSheets 找 `-anchor-gutter`，
       * 碰到沒有 .style 的規則（@charset、@layer…）就丟例外、**整支樣式表跳過**。
       * Aura 的定義進了 @layer primeng、styles.css 開頭是 @charset，兩邊都找不到 →
       * 下拉跟觸發鈕之間的 2px 消失。所以放在這支 <style> 的**第一條**。值同 Aura 預設。
       */
      :root {
        --p-anchor-gutter: 2px;
      }
    </style>
    <!--
    開站畫面（#2161 之後，使用者 11-02 選 B「留白細流」）。純 inline CSS＋SVG、零 JS、零字型 ——
    它要在任何下載完成之前就畫得出來（index-splash.spec 守：沒有外部資源、gzip 4KB 內；c6 由 harness 掃）。

    - 線是主視覺同一張流場：flow-field.component.ts 的同一組 ψ 係數（t=200）離線積分出的流線，
      整數座標、相對指令；取樣點當控制點、中點當端點的二次樣條（接點平滑）。
      座標別再減半：手機放大後取整誤差看得出線在抖。每條線上一段亮線沿流向等速前進（linear —— 是流動，不是 UI 位移）
    - 放在 <app-root> **外面**：Angular 第一次 render 不會換掉它。第一個路由元件掛到 router-outlet
      後面時，`body:has(…)` 成立、純 CSS 淡出（lazy chunk、guard 等 /api/me 的空檔它還在，不會空白一閃）。
      app-toast 也是 outlet 的兄弟，所以排除它。App 在第一次 NavigationEnd 後再把節點移掉當保險（app.component.ts）
    - 底色 = body 的 --zinc-100。styles.css 是 inlineCritical 非同步載的，token 不一定已經在，所以帶 fallback，
      值由 spec 比對 styles.css（以前寫死 #f4f4f5，token 改成 #f5f3f1 之後就漂了，接手時閃一下）
    - color-scheme 固定 light：app 沒有深色模式，跟系統變深會在接手時黑→白一閃
    - 進場 0.12s 後才淡入：快網路在那之前就接手的人什麼都看不到（底色同 body，不閃）。
      退場 0.16s 加速離開；兩者是不同元素的 opacity，就緒在任何時刻到都從當下值淡出
  -->
    <style id="app-splash-style">
      .app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        overflow: hidden;
        color-scheme: light;
        background-color: var(--zinc-100, #f5f3f1);
        color: #1a1614; /* zinc-900 */
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;
        transition:
          opacity 0.16s cubic-bezier(0.4, 0, 1, 1),
          visibility 0s linear 0.16s;
      }
      body:has(app-root router-outlet + :not(app-toast)) .app-splash {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .app-splash__field {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        fill: none;
        stroke-linecap: round;
        /* 線寬是 viewBox 單位（1440 寬），桌機約等於 px、手機（slice 後約 ×0.94）略細。
           不用 vector-effect：寫在 <defs> 的 path 上，經 <use> 引用時不生效 */
        /* 中央留白給字標（百分比，不用 viewport 單位） */
        -webkit-mask-image: radial-gradient(closest-side, transparent 16%, #000 62%);
        mask-image: radial-gradient(closest-side, transparent 16%, #000 62%);
        animation: app-splash-in 0.32s cubic-bezier(0.23, 1, 0.32, 1) 0.12s both;
      }
      .app-splash__base {
        stroke: rgb(26 22 20 / 9%);
        stroke-width: 1;
      }
      .app-splash__flow {
        stroke: rgb(26 22 20 / 42%);
        stroke-width: 1.4;
      }
      .app-splash__flow use {
        stroke-dasharray: 16 84;
        animation: app-splash-flow 4.2s linear infinite;
      }
      .app-splash__flow use:nth-child(3n + 1) {
        animation-duration: 3.3s;
        animation-delay: -1.1s;
      }
      .app-splash__flow use:nth-child(3n + 2) {
        animation-duration: 5.4s;
        animation-delay: -2.7s;
      }
      /* 每四條一條品牌橘（accent-vivid） */
      .app-splash__flow use:nth-child(4n) {
        animation-delay: -3.6s;
        stroke: #ff6a3d;
        stroke-width: 2;
        stroke-dasharray: 22 78;
      }
      .app-splash__brand {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        margin: 0;
        text-align: center;
        font-size: 32px;
        font-weight: 800;
        line-height: 1;
        animation: app-splash-in 0.32s cubic-bezier(0.23, 1, 0.32, 1) 0.12s both;
      }
      .app-splash__sub {
        display: block;
        margin-top: 12px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.24em;
        opacity: 0.8;
      }
      .app-splash__rm {
        display: none;
      }
      /* 手機：畫面小、線少，桌機的淡度看起來像紋理不像動畫 —— 對比與亮線粗細拉高（使用者 11-02） */
      @media (max-width: 768px) {
        .app-splash__field {
          -webkit-mask-image: radial-gradient(closest-side, transparent 22%, #000 58%);
          mask-image: radial-gradient(closest-side, transparent 22%, #000 58%);
        }
        .app-splash__base {
          stroke: rgb(26 22 20 / 16%);
          stroke-width: 1.6;
        }
        .app-splash__flow {
          stroke: rgb(26 22 20 / 64%);
          stroke-width: 2.6;
        }
        .app-splash__flow use {
          stroke-dasharray: 20 80;
        }
        .app-splash__flow use:nth-child(4n) {
          stroke-width: 3.4;
          stroke-dasharray: 26 74;
        }
      }
      @keyframes app-splash-flow {
        from {
          stroke-dashoffset: 100;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes app-splash-in {
        from {
          opacity: 0;
        }
      }
      /* 減少動態：亮線不畫，淡線加深成一張成形的靜態場（同 flow-field 的 reduced 路徑）；
         「還在跑」的訊號由文字接手 —— 動畫拿掉了，資訊不能跟著拿掉 */
      @media (prefers-reduced-motion: reduce) {
        .app-splash__flow {
          display: none;
        }
        .app-splash__base {
          stroke: rgb(26 22 20 / 24%);
        }
        .app-splash__field,
        .app-splash__brand {
          animation: none;
        }
        .app-splash__rm {
          display: block;
          margin-top: 20px;
          font-size: 14px;
          font-weight: 500;
        }
      }
    </style>
  </head>
