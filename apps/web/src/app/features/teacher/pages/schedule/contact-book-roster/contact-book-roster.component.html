<div class="flex flex-col gap-4">
  <header class="flex flex-col gap-1">
    <h2 class="m-0 text-[1.125rem] font-semibold">{{ input.className }}</h2>
    <p class="m-0 text-[0.875rem] text-muted">{{ input.entryDate }}　聯絡簿</p>
  </header>

  @if (loading()) {
    <div class="skeleton-list" aria-label="聯絡簿名單載入中">
      @for (i of [1, 2, 3]; track i) {
        <span class="skeleton-bar"></span>
      }
    </div>
  } @else if (loadError()) {
    <p class="m-0 text-error-600">讀取失敗，請關閉重開。</p>
  } @else if (empty()) {
    <!-- 全寫完跟「這班沒人」在畫面上要分得出來，但兩者都不是錯誤 -->
    <p class="m-0 text-muted">這堂課的聯絡簿都寫完了。</p>
  } @else {
    <ul
      class="m-0 flex max-h-[calc(var(--window-height,100dvh)*0.5)] list-none flex-col overflow-y-auto p-0"
    >
      @for (student of students(); track student.studentId) {
        <li
          class="flex min-h-11 items-center justify-between gap-3 border-b border-b-solid border-b-surface-border p-2"
        >
          <span class="text-md">{{ student.studentName }}</span>
          <p-button
            label="撰寫"
            size="small"
            [outlined]="true"
            [loading]="opening() === student.studentId"
            (onClick)="open(student)"
          />
        </li>
      }
    </ul>
  }

  <footer class="flex justify-end">
    <p-button label="關閉" [text]="true" size="small" (onClick)="close()" />
  </footer>
</div>
