<!-- 共用殼 app-dialog-frame（#2290）：A6 t-schedule `dlg()`（h2＋✕；副標進內容區第一行（#2396）、sticky 底部） -->
<app-dialog-frame [title]="input.className" (closed)="close()">
  <!-- #2396 B：哪天 -->
  <p class="m-0 text-sm text-zinc-600" data-part="dialog-context">{{ input.entryDate }}　聯絡簿</p>
  @if (loading()) {
    <app-skeleton label="聯絡簿名單載入中" [count]="3" />
  } @else if (loadError()) {
    <p class="m-0 text-error-600">讀取失敗，請關閉重開。</p>
  } @else if (empty()) {
    <!-- 全寫完跟「這班沒人」在畫面上要分得出來，但兩者都不是錯誤 -->
    <p class="m-0 text-muted">這堂課的聯絡簿都寫完了。</p>
  } @else {
    <ul
      class="m-0 flex max-h-[calc(var(--window-height,640px)*0.5)] list-none flex-col overflow-y-auto p-0"
    >
      @for (student of students(); track student.studentId) {
        <li
          [style.view-transition-name]="'roster-' + student.studentId"
          class="vt-row flex min-h-11 items-center justify-between gap-3 border-b border-b-surface-border p-2"
        >
          <span class="text-md">{{ student.studentName }}</span>
          <p-button
            label="撰寫"
            size="small"
            [outlined]="true"
            [loading]="opening() === student.studentId"
            (onClick)="open(student)"
          />
        </li>
      }
    </ul>
  }

  <ng-container dialogFoot>
    <p-button label="關閉" [text]="true" size="small" (onClick)="close()" />
  </ng-container>
</app-dialog-frame>
