<!--
  桌機：左品牌面（max(340px, 40%)）＋右白面，兩面各自撐滿視窗高。
  手機（≤1024）：兩面各一個視窗寬並排成一條軌道（寬 = 2 × --window-width），
  整條用 left 平移 320ms —— **不用 transform**：transform 會讓軌道變成 position: fixed 後代的
  定位基準（A6 實測：選擇身分的遮罩與彈窗會跟著兩倍寬的軌道跑位）。各面自己捲動。
-->
<section
  class="grid h-[var(--window-height,100%)] grid-cols-[minmax(340px,40%)_1fr] overflow-hidden max-[1024px]:fixed max-[1024px]:top-0 max-[1024px]:left-0 max-[1024px]:flex max-[1024px]:w-[calc(var(--window-width,390px)*2)] max-[1024px]:transition-[left] max-[1024px]:duration-[320ms] max-[1024px]:ease-(--arrive) max-[1024px]:motion-reduce:transition-none max-[1024px]:[&.is-right]:left-[calc(var(--window-width,390px)*-1)]"
  [class.is-right]="isRight()"
>
  <!-- 品牌面：桌機在左；手機是左面（第一屏），上＝字標、中＝tagline、下＝入口 -->
  <aside
    class="sticky top-0 isolate flex h-[var(--window-height,100%)] flex-col overflow-hidden bg-[linear-gradient(150deg,var(--accent-vivid)_0%,var(--accent-vivid-2)_100%)] p-8 text-zinc-900 after:pointer-events-none after:absolute after:inset-0 after:z-0 after:bg-[linear-gradient(168deg,rgb(255_106_61/90%)_0%,rgb(255_106_61/62%)_34%,rgb(255_106_61/10%)_68%,rgb(255_106_61/0%)_88%)] after:content-[''] max-[1024px]:relative max-[1024px]:h-full max-[1024px]:w-(--window-width,390px) max-[1024px]:flex-none max-[1024px]:overflow-y-auto max-[1024px]:px-5 max-[1024px]:pt-8 max-[1024px]:pb-[calc(var(--space-5)+env(safe-area-inset-bottom,0px))] max-[1024px]:after:bg-[linear-gradient(180deg,rgb(255_106_61/55%)_0%,rgb(255_106_61/0%)_30%,rgb(255_106_61/0%)_62%,rgb(255_106_61/70%)_100%)]"
    [inert]="isRight()"
  >
    <app-flow-field [density]="0.8" [speed]="1" />

    <div
      class="relative z-1 max-[1024px]:flex max-[1024px]:min-h-0 max-[1024px]:flex-1 max-[1024px]:flex-col"
    >
      <!-- 補習班名稱當主標，Clessia 退成頂端一行小字的產品名（使用者 10-22 選 A，#1858；A6 是大字 Clessia，R5） -->
      <a
        class="inline-flex min-h-11 items-center gap-1.5 self-start text-[20px] leading-none font-bold tracking-[-0.02em] text-inherit no-underline min-[1025px]:min-h-0"
        [routerLink]="loginPath"
        >Clessia<span class="text-[15px] font-semibold tracking-normal opacity-80"
          >· 學程管家</span
        ></a
      >
      <!-- 名稱是另一支請求回來的：外層一直在（手機的 mt-auto 掛在這裡，版面不跟著跳），
           回來時 grid-rows 0fr → 1fr 滑開（motion.md「跳改成滑」）；PUBLIC_ORG_SLUG 沒設＝404，就一直收著 -->
      <div
        class="grid grid-rows-[0fr] transition-[grid-template-rows] duration-200 ease-(--arrive) motion-reduce:transition-none max-[1024px]:mt-auto [&.is-on]:grid-rows-[1fr]"
        [class.is-on]="orgName()"
      >
        <div class="min-h-0 overflow-hidden">
          <!-- 沒有名稱就不渲染：空的 h2 會被讀屏念成一個沒有內容的標題 -->
          @if (orgName(); as name) {
            <h2
              class="mx-0 mt-6 mb-1 text-[36px] leading-[1.1] font-bold tracking-[-0.03em] max-[1024px]:mt-0 max-[1024px]:mb-2 max-[1024px]:text-[calc(var(--window-width,390px)*0.1)]"
            >
              {{ name }}
            </h2>
          }
        </div>
      </div>
      <p
        class="m-0 mb-8 text-md font-medium opacity-78 max-[1024px]:mb-auto max-[1024px]:text-lg max-[1024px]:opacity-85"
      >
        讓學習旅程更輕鬆
      </p>
    </div>

    <!-- 公開頁的入口是一排輕量連結，不是一份選單清單（四個項目撐不起側邊選單）。
         手機上點別頁直接落在那頁的表單面（#form）；點本頁就是移到表單面；
         登入頁的「登入」改成升起底部面板（面板在 LoginComponent 裡）。 -->
    <nav
      aria-label="公開頁"
      class="relative z-1 mt-auto mb-5 flex flex-wrap gap-x-5 gap-y-2 max-[1024px]:mx-0 max-[1024px]:mt-5 max-[1024px]:mb-0 max-[1024px]:gap-x-6 max-[1024px]:gap-y-3"
    >
      @for (item of navItems(); track item.absolutePath) {
        @if (isMobile() && isLogin() && item.absolutePath === loginPath) {
          <button
            type="button"
            class="inline-flex min-h-11 items-center border-0 border-b-2 border-solid border-transparent p-0 text-lg leading-normal font-semibold text-zinc-900 no-underline transition-[opacity,border-color] duration-150 hover:border-[rgb(26_22_20/40%)] hover:opacity-100 min-[1025px]:block min-[1025px]:min-h-0 min-[1025px]:border-b-[1.5px] min-[1025px]:pb-0.5 min-[1025px]:text-md min-[1025px]:font-medium min-[1025px]:opacity-72 min-[1025px]:pointer-coarse:py-3 cursor-pointer border-zinc-900! bg-transparent font-[inherit] min-[1025px]:font-semibold! min-[1025px]:opacity-100!"
            popovertarget="login-sheet"
            aria-current="page"
          >
            {{ item.label }}
          </button>
        } @else {
          <a
            class="inline-flex min-h-11 items-center border-0 border-b-2 border-solid border-transparent p-0 text-lg leading-normal font-semibold text-zinc-900 no-underline transition-[opacity,border-color] duration-150 hover:border-[rgb(26_22_20/40%)] hover:opacity-100 min-[1025px]:block min-[1025px]:min-h-0 min-[1025px]:border-b-[1.5px] min-[1025px]:pb-0.5 min-[1025px]:text-md min-[1025px]:font-medium min-[1025px]:opacity-72 min-[1025px]:pointer-coarse:py-3"
            [routerLink]="item.absolutePath"
            [fragment]="isMobile() ? formFragment : undefined"
            [state]="isMobile() ? pushedState : undefined"
            routerLinkActive="border-zinc-900! min-[1025px]:font-semibold! min-[1025px]:opacity-100!"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{
              paths: 'exact',
              queryParams: 'ignored',
              fragment: 'ignored',
              matrixParams: 'ignored',
            }"
            >{{ item.label }}</a
          >
        }
      }
    </nav>

    <!-- 手機也放（使用者 10-22，#1858）；品牌面的 padding-bottom 已含 safe-area -->
    <p class="relative z-1 m-0 text-sm opacity-62 max-[1024px]:mt-4">&copy; 2025 Clessia Academy</p>
  </aside>

  <!-- 白面：承載表單。手機是右面，頂端一列「← 返回＋頁名」 -->
  <main
    class="flex h-[var(--window-height,100%)] items-stretch justify-center overflow-y-auto bg-white p-10 [&>.shell-route-wrapper]:contents max-[1024px]:block max-[1024px]:h-full max-[1024px]:w-(--window-width,390px) max-[1024px]:flex-none max-[1024px]:px-5 max-[1024px]:pt-0 max-[1024px]:pb-8"
    [inert]="isMobile() && !isRight()"
  >
    @if (isMobile() && !isLocked()) {
      <div
        class="sticky top-0 z-2 -mx-5 mb-4 flex h-14 items-center gap-3 border-b border-zinc-200 bg-white px-3"
      >
        <button
          type="button"
          class="inline-flex min-h-11 cursor-pointer items-center gap-1 rounded-md leading-normal border-0 bg-transparent px-3 font-[inherit] text-base font-semibold text-zinc-900 hover:bg-zinc-100"
          (click)="back()"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M13 8H3M7 4L3 8l4 4" />
          </svg>
          返回
        </button>
        <span class="text-base font-bold">{{ page()?.label }}</span>
      </div>
    }
    <div class="shell-route-wrapper u-fill-route-child">
      <router-outlet />
    </div>
  </main>
</section>
