<div class="m-auto w-full max-w-[480px] py-4">
  <header class="mb-6">
    <p class="mx-0 mb-2 mt-0 text-sm font-semibold tracking-[0.04em] text-zinc-600">最後一步</p>
    <h1 class="mx-0 mb-2 mt-0 text-2xl font-bold leading-tight text-zinc-900">綁定 LINE</h1>
  </header>

  <p class="mt-2 text-sm leading-relaxed text-zinc-500">
    綁定之後，以後用 LINE 就能直接登入，不必再向補習班索取連結。
  </p>

  @if (error()) {
    <app-inline-notice severity="error" [detail]="error()" (dismissed)="error.set(null)" />
  }

  <button
    type="button"
    class="mt-4 flex h-11 w-full cursor-pointer items-center justify-center gap-2 rounded-md border-0 bg-[#06c755] text-md font-semibold text-white transition-[background] duration-[120ms] ease-[ease] enabled:hover:bg-[#05b34c] disabled:cursor-progress"
    [disabled]="submitting()"
    (click)="linkLine()"
  >
    @if (submitting()) {
      <i class="pi pi-spinner pi-spin"></i>
      前往 LINE...
    } @else {
      綁定 LINE 帳號
    }
  </button>

  <button
    type="button"
    class="mt-3 min-h-11 w-full cursor-pointer border-0 bg-transparent p-2 text-sm text-zinc-500 enabled:hover:text-zinc-800"
    [disabled]="submitting()"
    (click)="skip()"
  >
    稍後再說
  </button>
</div>
