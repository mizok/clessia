<div class="w-full max-w-[380px] max-[860px]:px-6 max-[860px]:py-8">
  <h1 class="m-0 text-2xl font-bold tracking-[-0.02em] text-zinc-900">登入</h1>
  <p class="mx-0 mb-0 mt-2 text-md leading-[1.75] text-zinc-600">用 LINE 登入，不需要記密碼。</p>

  @if (error()) {
    <app-inline-notice severity="error" [detail]="error()" (dismissed)="error.set(null)" />
    @if (showRetry()) {
      <button
        type="button"
        class="login__retry-btn mt-3 block min-h-11 w-full cursor-pointer rounded-md border border-zinc-300 bg-transparent px-4 py-2 text-sm font-semibold text-zinc-700 hover:bg-zinc-50"
        (click)="retry()"
      >
        重試
      </button>
    }
  }

  <button
    type="button"
    class="mt-6 flex h-12 w-full cursor-pointer items-center justify-center gap-2 rounded-lg border border-[#06c755] bg-white px-4 text-base font-semibold text-[#06c755] transition-[color,background,border-color,translate] duration-[120ms] ease-[ease] motion-reduce:duration-[0.01ms] enabled:hover:-translate-y-px enabled:hover:border-[#05b34c] enabled:hover:bg-[rgb(6_199_85/8%)] enabled:hover:text-[#05b34c] enabled:active:translate-y-0 disabled:cursor-progress"
    [disabled]="submitting()"
    (click)="signInWithLine()"
  >
    @if (submitting()) {
      <i class="pi pi-spinner pi-spin" aria-hidden="true"></i>
      前往 LINE...
    } @else {
      <!-- 綠底 chip + 官方白色 icon，重現 LINE app 圖示的長相 —— 那才是家長認得的。
           純裝飾：右邊的文字已經說了「LINE」，讓螢幕閱讀器再念一次反而吵。 -->
      <span
        class="flex size-[26px] shrink-0 items-center justify-center rounded-md bg-[#06c755]"
        aria-hidden="true"
      >
        <img class="block size-[18px]" src="assets/brand/line-logo.png" alt="" />
      </span>
      使用 LINE 登入
    }
  </button>

  <!--
    **不放連到 `/enrollment` 的連結**（#694）：那一頁是純佔位殼（`<main>` 內零互動元素），
    **被擋在門外的人唯一的出路會是一扇畫在牆上的門**。使用者裁定改成一句話。

    它補的是既有錯誤訊息缺的那一半 —— 那句講的是「**已經**報名」該怎麼辦
    （向補習班索取專屬連結），這句講的是「**還沒**報名」該怎麼辦。
  -->
  @if (showRegisterHint()) {
    <p class="login__register-hint mt-3 block text-center text-sm text-zinc-600">
      請聯絡補習班登記
    </p>
  }

  <div class="mt-6 border-t border-zinc-200 pt-4">
    <p class="m-0 text-sm leading-relaxed text-zinc-600">
      第一次使用？請向補習班索取專屬連結，點開後即可綁定 LINE。
    </p>
    <p class="mx-0 mb-0 mt-2 text-xs text-zinc-500">還沒有帳號？請聯絡櫃檯開通。</p>
  </div>
</div>
