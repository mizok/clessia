<div class="login">
  <div class="login__card">
    <header class="login__brand">
      <!-- 句點是唯一的裝飾，aria-hidden 讓螢幕閱讀器只念品牌名 -->
      <h1 class="login__wordmark">
        Clessia<span class="login__wordmark-dot" aria-hidden="true">.</span>
      </h1>
    </header>

    @if (error()) {
      <app-inline-notice severity="error" [detail]="error()" (dismissed)="error.set(null)" />
    }

    <button
      type="button"
      class="login__line-btn"
      [disabled]="submitting()"
      (click)="signInWithLine()"
    >
      @if (submitting()) {
        <i class="pi pi-spinner pi-spin" aria-hidden="true"></i>
        前往 LINE...
      } @else {
        <!-- 綠底 chip + 官方白色 icon，重現 LINE app 圖示的長相 —— 那才是家長認得的。
             純裝飾：右邊的文字已經說了「LINE」，讓螢幕閱讀器再念一次反而吵。 -->
        <span class="login__line-chip" aria-hidden="true">
          <img class="login__line-logo" src="assets/brand/line-logo.png" alt="" />
        </span>
        使用 LINE 登入
      }
    </button>

    @if (showEnrollmentLink()) {
      <a class="login__enroll-link" routerLink="/enrollment">還沒報名？前往報名</a>
    }

    <div class="login__foot">
      <p class="login__hint">第一次使用？請向補習班索取專屬連結，點開後即可綁定 LINE。</p>
      <p class="login__contact">還沒有帳號？請聯絡櫃檯開通。</p>
    </div>
  </div>
</div>
