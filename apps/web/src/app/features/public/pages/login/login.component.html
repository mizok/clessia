<div class="login auth-content">
  <header class="auth-content__header">
    <p class="auth-content__badge">管理系統</p>
    <h1 class="auth-content__title">登入</h1>
  </header>

  @if (error()) {
    <app-inline-notice severity="error" [detail]="error()" (dismissed)="error.set(null)" />
  }

  <button
    type="button"
    class="login__line-btn"
    [disabled]="submitting()"
    (click)="signInWithLine()"
  >
    @if (submitting()) {
      <i class="pi pi-spinner pi-spin"></i>
      前往 LINE...
    } @else {
      使用 LINE 登入
    }
  </button>

  @if (showEnrollmentLink()) {
    <a class="login__enroll-link" routerLink="/enrollment">還沒報名？前往報名</a>
  }

  <p class="login__hint">第一次使用？請向補習班索取專屬連結，點開後即可綁定 LINE。</p>
</div>
