<div class="flex flex-col gap-5 p-5">
  <header class="flex flex-col gap-1">
    <h2 class="m-0 text-lg font-semibold text-zinc-900">
      {{ isEditing() ? '編輯價目表' : '新增價目表' }}
    </h2>
    <p class="m-0 text-xs text-zinc-500">這裡填的是定價。實際收多少在報名時可以另外議定。</p>
  </header>

  <div class="flex flex-col gap-4">
    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium text-zinc-600" for="ft-name">方案名稱 *</label>
      <input
        id="ft-name"
        type="text"
        pInputText
        maxlength="100"
        placeholder="如：國中主科月繳"
        [ngModel]="form().name"
        (ngModelChange)="update('name', $event)"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium text-zinc-600" for="ft-mode">計費模式 *</label>
      <p-select
        inputId="ft-mode"
        optionLabel="label"
        optionValue="value"
        [options]="billingModeOptions"
        [ngModel]="form().billingMode"
        (ngModelChange)="update('billingMode', $event)"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium text-zinc-600" for="ft-amount">定價 *</label>
      <p-inputnumber
        inputId="ft-amount"
        mode="currency"
        currency="TWD"
        locale="zh-TW"
        [min]="0"
        [maxFractionDigits]="0"
        [ngModel]="form().amount"
        (ngModelChange)="update('amount', $event)"
      />
    </div>

    <div class="flex flex-col gap-2">
      <span class="text-sm font-medium text-zinc-600" id="ft-active-label">狀態</span>
      <p-selectbutton
        aria-labelledby="ft-active-label"
        [options]="activeOptions"
        optionLabel="label"
        optionValue="value"
        [allowEmpty]="false"
        [ngModel]="form().isActive"
        (ngModelChange)="update('isActive', $event)"
      />
      <span class="m-0 text-xs text-zinc-600">停用後不會出現在報名選單，歷史報名不受影響。</span>
    </div>
  </div>

  <footer class="flex justify-end gap-2">
    <p-button label="取消" [text]="true" severity="secondary" (onClick)="cancel()" />
    <p-button label="儲存" [loading]="saving()" (onClick)="save()" />
  </footer>
</div>
