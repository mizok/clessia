<div class="flex flex-col gap-5 p-5">
  <header class="flex flex-col gap-1">
    <h2 class="m-0 text-lg font-semibold text-zinc-900">
      {{ isEditing() ? '編輯收費期間' : '新增收費期間' }}
    </h2>
    <p class="m-0 text-xs text-zinc-500">
      一年兩期、一年一期、照學期制都可以 —— 期間由機構自己定義。
    </p>
  </header>

  <div class="flex flex-col gap-4">
    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium text-zinc-600" for="bp-name">期間名稱 *</label>
      <input
        id="bp-name"
        type="text"
        pInputText
        maxlength="100"
        placeholder="如：2026 上學期 + 暑假"
        [ngModel]="form().name"
        (ngModelChange)="update('name', $event)"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium text-zinc-600" for="bp-start">起始日 *</label>
      <p-datepicker
        inputId="bp-start"
        dateFormat="yy-mm-dd"
        appendTo="body"
        [ngModel]="form().startDate"
        (ngModelChange)="update('startDate', $event)"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium text-zinc-600" for="bp-end">結束日 *</label>
      <p-datepicker
        inputId="bp-end"
        dateFormat="yy-mm-dd"
        appendTo="body"
        [ngModel]="form().endDate"
        (ngModelChange)="update('endDate', $event)"
      />
    </div>
  </div>

  <footer class="flex justify-end gap-2">
    <p-button label="取消" [text]="true" severity="secondary" (onClick)="cancel()" />
    <p-button label="儲存" [loading]="saving()" (onClick)="save()" />
  </footer>
</div>
