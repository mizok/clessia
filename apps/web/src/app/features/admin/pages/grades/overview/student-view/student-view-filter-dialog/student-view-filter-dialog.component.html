<div class="flex flex-col gap-4">
  <div class="dialog-header-inline">
    <div class="dialog-header-inline__content flex w-full flex-row items-center">
      <span class="text-md font-semibold text-zinc-900">篩選</span>
    </div>
    <button
      type="button"
      class="dialog-header-inline__close size-11"
      (click)="close()"
      aria-label="關閉"
    >
      <i class="pi pi-times"></i>
    </button>
  </div>

  <div class="flex flex-col gap-3">
    <div class="flex flex-col gap-2">
      <label class="text-xs font-semibold text-zinc-600">搜尋</label>
      <input
        pInputText
        type="text"
        [ngModel]="searchText()"
        (ngModelChange)="onSearchChange($event)"
        placeholder="搜尋學生姓名"
      />
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div class="flex flex-col gap-2">
        <label class="text-xs font-semibold text-zinc-600">年級</label>
        <p-select
          [options]="options?.gradeOptions ?? []"
          [ngModel]="grade()"
          (ngModelChange)="onGradeChange($event)"
          optionLabel="label"
          optionValue="value"
          placeholder="全部年級"
          [showClear]="true"
          size="small"
          [appendTo]="'body'"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-xs font-semibold text-zinc-600">就讀學校</label>
        <p-select
          [options]="options?.schoolOptions ?? []"
          [ngModel]="schoolId()"
          (ngModelChange)="onSchoolChange($event)"
          optionLabel="label"
          optionValue="value"
          placeholder="全部學校"
          [showClear]="true"
          size="small"
          [appendTo]="'body'"
        />
      </div>
    </div>

    <div class="flex flex-col gap-2">
      <label class="text-xs font-semibold text-zinc-600">啟用狀態</label>
      <p-select
        [options]="options?.statusOptions ?? []"
        [ngModel]="status()"
        (ngModelChange)="onStatusChange($event)"
        optionLabel="label"
        optionValue="value"
        size="small"
        [appendTo]="'body'"
      />
    </div>
  </div>

  <div class="flex justify-end">
    <p-button label="重設" severity="secondary" [text]="true" (onClick)="clear()" />
  </div>
</div>
