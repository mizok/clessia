<div class="flex flex-col gap-4">
  <div class="dialog-header-inline">
    <div class="dialog-header-inline__content flex w-full flex-row items-center">
      <span class="text-md font-semibold text-zinc-900">班級篩選</span>
    </div>
    <button
      type="button"
      class="dialog-header-inline__close size-11"
      (click)="close()"
      aria-label="關閉"
    >
      <i class="pi pi-times"></i>
    </button>
  </div>

  <div class="flex flex-col gap-3">
    @if (options?.campusOptions?.length) {
      <div class="flex flex-col gap-2">
        <label class="text-xs font-semibold text-zinc-600">分校</label>
        <p-select
          [options]="options?.campusOptions ?? []"
          [ngModel]="campusId()"
          (ngModelChange)="campusId.set($event)"
          optionLabel="label"
          optionValue="value"
          placeholder="選擇分校"
          size="small"
          [appendTo]="'body'"
        />
      </div>
    }

    <div class="flex flex-col gap-2">
      <label class="text-xs font-semibold text-zinc-600">年級</label>
      <p-multiselect
        [options]="options?.gradeOptions ?? []"
        [ngModel]="selectedGrades()"
        (ngModelChange)="selectedGrades.set($event ?? [])"
        optionLabel="label"
        optionValue="value"
        placeholder="全部年級"
        [showClear]="true"
        [maxSelectedLabels]="2"
        size="small"
        [appendTo]="'body'"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label class="text-xs font-semibold text-zinc-600">科目</label>
      <p-select
        [options]="options?.subjectOptions ?? []"
        [ngModel]="subjectId()"
        (ngModelChange)="subjectId.set($event)"
        optionLabel="label"
        optionValue="value"
        placeholder="全部科目"
        [showClear]="true"
        size="small"
        [appendTo]="'body'"
      />
    </div>
  </div>

  <div class="flex justify-end gap-2">
    <p-button label="重設" [text]="true" severity="secondary" (onClick)="clear()" />
    <p-button label="套用" (onClick)="apply()" />
  </div>
</div>
