<div class="school-score-editor">
  <!-- Toolbar -->
  <div class="school-score-editor__toolbar">
    <div class="school-score-editor__toolbar-row">
      <p-select
        [options]="campusOptions()"
        [ngModel]="campusId()"
        (ngModelChange)="onCampusChange($event)"
        optionLabel="label"
        optionValue="value"
        placeholder="選擇分校"
        size="small"
        [appendTo]="'body'"
        styleClass="school-score-editor__campus-select"
      />
      <p-select
        [options]="gradeOptions"
        [ngModel]="gradeFilter()"
        (ngModelChange)="onGradeFilterChange($event)"
        optionLabel="label"
        optionValue="value"
        placeholder="全部年級"
        [showClear]="true"
        size="small"
        [appendTo]="'body'"
        styleClass="school-score-editor__grade-select"
      />
      <div class="school-score-editor__search">
        <p-iconfield iconPosition="left">
          <p-inputicon styleClass="pi pi-search" />
          <input
            type="text"
            pInputText
            [ngModel]="searchTerm()"
            (ngModelChange)="onSearchInput($event)"
            placeholder="搜尋學生姓名"
            class="school-score-editor__search-input"
          />
        </p-iconfield>
      </div>
    </div>
    <div class="school-score-editor__toolbar-row">
      <p-selectbutton
        [options]="studentStatusOptions"
        [ngModel]="statusFilter()"
        (ngModelChange)="onStatusFilterChange($event)"
        optionLabel="label"
        optionValue="value"
        size="small"
      />
    </div>
  </div>

  <!-- Student list -->
  @if (loadingStudents()) {
    <div class="school-score-editor__hint">
      <i class="pi pi-spinner pi-spin"></i>
      載入學生列表...
    </div>
  } @else if (students().length === 0) {
    <div class="school-score-editor__empty">
      <i class="pi pi-users"></i>
      <span>
        @if (statusFilter() === 'pending') {
          此分校目前沒有待登錄的學生
        } @else {
          找不到符合條件的學生
        }
      </span>
    </div>
  } @else {
    <div class="school-score-editor__list">
      @for (s of students(); track s.studentId) {
        <button
          type="button"
          class="school-score-editor__row"
          (click)="openStudentDialog(s)"
        >
          <div class="school-score-editor__row-main">
            <span class="school-score-editor__row-name">{{ s.studentName }}</span>
            <span class="school-score-editor__row-grade">{{ formatGrade(s.studentGrade) }}</span>
          </div>
          <div class="school-score-editor__row-end">
            <p-tag
              [value]="getProgressText(s)"
              [severity]="getProgressSeverity(s)"
              [rounded]="true"
            />
            <i class="pi pi-chevron-right school-score-editor__row-chevron"></i>
          </div>
        </button>
      }
    </div>

    @if (totalStudents() > pageSize) {
      <p-paginator
        [rows]="pageSize"
        [totalRecords]="totalStudents()"
        [first]="(page() - 1) * pageSize"
        (onPageChange)="onPageChange($event)"
      />
    }
  }

</div>
