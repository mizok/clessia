<div class="student-view">
  <app-page-breadcrumb [items]="breadcrumbs" />

  <div class="student-view__toolbar student-view__toolbar--desktop">
    <p-select
      [options]="campusOptions()"
      [ngModel]="campusId()"
      (ngModelChange)="onCampusChange($event)"
      optionLabel="label"
      optionValue="value"
      placeholder="全部分校"
      [showClear]="true"
      size="small"
      styleClass="student-view__campus-select"
    />

    <div class="student-view__search">
      <i class="pi pi-search student-view__search-icon"></i>
      <input
        pInputText
        type="text"
        [ngModel]="searchText()"
        (ngModelChange)="onSearchChange($event)"
        placeholder="搜尋學生姓名..."
        class="student-view__search-input"
      />
    </div>

    <p-select
      [options]="gradeOptions"
      [ngModel]="gradeFilter()"
      (ngModelChange)="onGradeChange($event)"
      optionLabel="label"
      optionValue="value"
      placeholder="全部年級"
      [showClear]="true"
      size="small"
      styleClass="student-view__grade-select"
    />

    <p-select
      [options]="schoolOptions()"
      [ngModel]="schoolIdFilter()"
      (ngModelChange)="onSchoolChange($event)"
      optionLabel="label"
      optionValue="value"
      placeholder="全部學校"
      [showClear]="true"
      size="small"
      styleClass="student-view__school-select"
    />

    <p-select
      [options]="statusOptions"
      [ngModel]="activeStatusFilter()"
      (ngModelChange)="onActiveStatusChange($event)"
      optionLabel="label"
      optionValue="value"
      size="small"
      styleClass="student-view__status-select"
    />
  </div>

  <div class="student-view__toolbar student-view__toolbar--mobile">
    <p-button
      label="篩選"
      icon="pi pi-sliders-h"
      severity="secondary"
      [outlined]="true"
      (onClick)="openMobileFilterDialog()"
    />
  </div>

  @if (loadingList()) {
    <div class="student-view__loading">
      <i class="pi pi-spinner pi-spin"></i>
      載入學生名單...
    </div>
  } @else if (pagedStudents().length === 0) {
    <app-empty-state
      icon="pi pi-users"
      title="無符合的學生"
      description="請嘗試調整篩選條件或搜尋關鍵字"
    />
  } @else {
    <div class="student-view__list">
      @for (s of pagedStudents(); track s.id) {
        <button type="button" class="student-view__row" (click)="selectStudent(s)">
          <app-jdenticon-avatar class="student-view__row-avatar" [value]="s.id" [size]="44" />
          <div class="student-view__row-main">
            <div class="student-view__row-head">
              <span class="student-view__row-name">{{ s.name }}</span>
              <span class="student-view__row-grade-chip">{{ formatGrade(s.grade) }}</span>
            </div>
            <div class="student-view__row-meta">
              @if (s.school?.name; as schoolName) {
                <span class="student-view__row-school">
                  <i class="pi pi-book"></i>{{ schoolName }}
                </span>
              }
              @for (cn of s.campusNames; track cn) {
                <p-tag [value]="cn" severity="info" styleClass="student-view__row-campus" />
              }
            </div>
          </div>
          <i class="pi pi-chevron-right student-view__row-chevron"></i>
        </button>
      }
    </div>

    @if (totalStudents() > pageSize) {
      <div class="student-view__pagination">
        <p-paginator
          [first]="(currentPage() - 1) * pageSize"
          [rows]="pageSize"
          [totalRecords]="totalStudents()"
          [showCurrentPageReport]="true"
          currentPageReportTemplate="顯示 {first} - {last}，共 {totalRecords} 位學生"
          (onPageChange)="onPageChange(($event.page ?? 0) + 1)"
        />
      </div>
    }
  }
</div>
