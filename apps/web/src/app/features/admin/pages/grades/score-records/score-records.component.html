<section class="score-records">
  <header class="score-records__header">
    <p class="score-records__eyebrow">考務與成績</p>
    <h1 class="score-records__title">{{ page().label }}</h1>
    <p class="score-records__subtitle">
      從考試事件或學生成績紀錄快速回查分數內容，作為家長應對與行政查核的入口。
    </p>
  </header>

  <div class="score-records__grid">
    <article class="score-records__card">
      <h2 class="score-records__card-title">這一頁要做的事</h2>
      <ul class="score-records__list">
        <li>搜尋特定考試事件或學生考試成績</li>
        <li>查看各事件下的成績列表與缺考狀態</li>
        <li>連回學生詳情或考試事件詳情做進一步查核</li>
      </ul>
    </article>

    <article class="score-records__card">
      <h2 class="score-records__card-title">第一期建議 UI</h2>
      <ul class="score-records__list">
        <li>搜尋欄與評量類型 / 日期篩選</li>
        <li>成績紀錄列表：學生、事件、分數、狀態</li>
        <li>查看詳情按鈕與快速跳轉入口</li>
      </ul>
    </article>
  </div>
</section>
