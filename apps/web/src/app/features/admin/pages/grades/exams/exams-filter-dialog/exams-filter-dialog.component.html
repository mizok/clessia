<!-- 共用殼（#2290）：✕＝不套用、直接關 -->
<app-dialog-frame title="篩選條件" (closed)="dismiss()">
  <div class="flex flex-col gap-4">
    <div class="flex flex-col gap-2">
      <span id="exams-filter-time-range" class="text-xs font-semibold text-zinc-500">時間範圍</span>
      <p-selectbutton
        ariaLabelledBy="exams-filter-time-range"
        [options]="options?.timeRangeOptions ?? []"
        [ngModel]="timeRange()"
        (ngModelChange)="timeRange.set($event)"
        optionLabel="label"
        optionValue="value"
        [allowEmpty]="false"
        size="small"
      />
    </div>

    <div class="flex flex-col gap-2">
      <span id="exams-filter-exam-type" class="text-xs font-semibold text-zinc-500">考試類型</span>
      <p-selectbutton
        ariaLabelledBy="exams-filter-exam-type"
        [options]="options?.examTypeOptions ?? []"
        [ngModel]="examType()"
        (ngModelChange)="examType.set($event)"
        optionLabel="label"
        optionValue="value"
        [allowEmpty]="false"
        size="small"
      />
    </div>

    @if (!isAcademy()) {
      <div class="flex flex-col gap-2">
        <label for="exams-filter-dialog-1" class="text-xs font-semibold text-zinc-500">學校</label>
        <p-select
          inputId="exams-filter-dialog-1"
          [options]="options?.schoolOptions ?? []"
          [ngModel]="schoolId()"
          (ngModelChange)="schoolId.set($event)"
          optionLabel="label"
          optionValue="value"
          size="small"
          placeholder="全部學校"
          [showClear]="true"
        />
      </div>
    }

    <div class="flex flex-col gap-2">
      <label for="exams-filter-dialog-2" class="text-xs font-semibold text-zinc-500">科目</label>
      <p-select
        inputId="exams-filter-dialog-2"
        [options]="options?.subjectOptions ?? []"
        [ngModel]="subjectId()"
        (ngModelChange)="subjectId.set($event)"
        optionLabel="label"
        optionValue="value"
        size="small"
        placeholder="全部科目"
        [showClear]="true"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label for="exams-filter-dialog-3" class="text-xs font-semibold text-zinc-500">狀態</label>
      <p-select
        inputId="exams-filter-dialog-3"
        [options]="options?.statusOptions ?? []"
        [ngModel]="status()"
        (ngModelChange)="status.set($event)"
        optionLabel="label"
        optionValue="value"
        size="small"
        placeholder="全部狀態"
      />
    </div>
  </div>

  <ng-container dialogFoot>
    <p-button label="清除" [text]="true" severity="secondary" (onClick)="clear()" />
    <p-button label="套用" (onClick)="apply()" />
  </ng-container>
</app-dialog-frame>
