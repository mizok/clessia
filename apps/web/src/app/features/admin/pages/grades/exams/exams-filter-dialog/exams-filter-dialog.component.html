<div class="flex flex-col gap-4">
  <div class="flex flex-col gap-4">
    <div class="flex flex-col gap-2">
      <label class="text-xs font-semibold text-zinc-500">時間範圍</label>
      <p-selectbutton
        [options]="options?.timeRangeOptions ?? []"
        [ngModel]="timeRange()"
        (ngModelChange)="timeRange.set($event)"
        optionLabel="label"
        optionValue="value"
        [allowEmpty]="false"
        size="small"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label class="text-xs font-semibold text-zinc-500">考試類型</label>
      <p-selectbutton
        [options]="options?.examTypeOptions ?? []"
        [ngModel]="examType()"
        (ngModelChange)="examType.set($event)"
        optionLabel="label"
        optionValue="value"
        [allowEmpty]="false"
        size="small"
      />
    </div>

    @if (!isAcademy()) {
      <div class="flex flex-col gap-2">
        <label class="text-xs font-semibold text-zinc-500">學校</label>
        <p-select
          [options]="options?.schoolOptions ?? []"
          [ngModel]="schoolId()"
          (ngModelChange)="schoolId.set($event)"
          optionLabel="label"
          optionValue="value"
          size="small"
          placeholder="全部學校"
          [showClear]="true"
        />
      </div>
    }

    <div class="flex flex-col gap-2">
      <label class="text-xs font-semibold text-zinc-500">科目</label>
      <p-select
        [options]="options?.subjectOptions ?? []"
        [ngModel]="subjectId()"
        (ngModelChange)="subjectId.set($event)"
        optionLabel="label"
        optionValue="value"
        size="small"
        placeholder="全部科目"
        [showClear]="true"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label class="text-xs font-semibold text-zinc-500">狀態</label>
      <p-select
        [options]="options?.statusOptions ?? []"
        [ngModel]="status()"
        (ngModelChange)="status.set($event)"
        optionLabel="label"
        optionValue="value"
        size="small"
        placeholder="全部狀態"
      />
    </div>
  </div>

  <div class="flex justify-end gap-2">
    <p-button label="清除" [text]="true" severity="secondary" (onClick)="clear()" />
    <p-button label="套用" (onClick)="apply()" />
  </div>
</div>
