<!-- 共用殼（#2290）。A6 課表走批次步驟頁，沒畫單堂這支；標題沿用產品原本的 header -->
<app-dialog-frame title="指定補課" (closed)="closeDialog()">
  <div class="session-op-form">
    <div class="session-op-form__field">
      <label for="makeupTarget" class="session-op-form__label">補的是哪一堂停課</label>
      <p-select
        id="makeupTarget"
        [options]="options()"
        [ngModel]="selectedId()"
        (ngModelChange)="selectedId.set($event)"
        optionLabel="label"
        optionValue="value"
        placeholder="選擇一堂停課"
        styleClass="w-full"
        appendTo="body"
        [loading]="loading()"
      />

      @if (loadFailed()) {
        <p class="session-op-form__hint">可補清單載入失敗，請關閉後重試。</p>
      } @else if (!loading() && candidates().length === 0) {
        <!--
        空狀態要講「為什麼空」而不只是「沒有」—— 清單隱藏了已經被補過的停課，
        所以「空」有兩個成因（沒有停課、停課都被補走了），使用者分不出來。
      -->
        <p class="session-op-form__hint">
          這個班沒有還沒被補的停課。已經被別的課堂補過的不會出現在這裡。
        </p>
      }
    </div>

    <!--
    這個系統**不能新增單堂課**，所以整段用詞是「指定既有課堂」（#592）。
    講出限制比讓使用者去找那個不存在的新增流程好。
  -->
    <p class="session-op-form__hint">
      只能從<strong>這個班已排定的課堂</strong>裡指定 —— 系統無法新增單堂課。
    </p>
  </div>

  <ng-container dialogFoot>
    @if (existingLink()) {
      <!-- 破壞性動作放最左、跟取消／確認分開 -->
      <button
        type="button"
        class="mr-auto inline-flex min-h-11 cursor-pointer items-center border-0 bg-transparent p-0 text-md font-semibold text-error-700 underline underline-offset-[3px] disabled:cursor-not-allowed disabled:opacity-50 wide:min-h-0"
        [disabled]="submitting()"
        (click)="clearLink()"
      >
        解除連結
      </button>
    }
    <button
      type="button"
      class="inline-flex h-11 cursor-pointer items-center justify-center gap-1.5 rounded-md border border-solid px-4 text-md leading-normal font-semibold whitespace-nowrap disabled:cursor-not-allowed disabled:opacity-50 wide:h-9 border-zinc-300 bg-white text-zinc-900 hover:border-zinc-400 hover:bg-zinc-50"
      (click)="closeDialog()"
    >
      取消
    </button>
    <button
      type="button"
      class="inline-flex h-11 cursor-pointer items-center justify-center gap-1.5 rounded-md border border-solid px-4 text-md leading-normal font-semibold whitespace-nowrap disabled:cursor-not-allowed disabled:opacity-50 wide:h-9 border-accent-vivid bg-accent-vivid text-zinc-900 hover:border-accent-vivid-2 hover:bg-accent-vivid-2"
      data-testid="op-submit"
      [disabled]="!selectedId() || submitting()"
      (click)="submit()"
    >
      {{ submitting() ? '處理中…' : '確認指定' }}
    </button>
  </ng-container>
</app-dialog-frame>
