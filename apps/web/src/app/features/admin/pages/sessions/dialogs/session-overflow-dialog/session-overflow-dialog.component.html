<div class="overflow-dialog">
  @for (s of sessions(); track s.id) {
    <div class="overflow-dialog__item" (click)="openDetail(s)">
      <div class="overflow-dialog__item-head">
        <span class="overflow-dialog__class-name">{{ s.className }}</span>
        <span class="overflow-dialog__time">{{ s.startTime }}–{{ s.endTime }}</span>
      </div>
      <div class="overflow-dialog__item-meta">
        <span class="overflow-dialog__meta-pill">
          <i class="pi pi-user"></i> {{ s.teacherName }}
        </span>
        <span class="overflow-dialog__meta-pill">
          <i class="pi pi-building"></i> {{ s.campusName }}
        </span>
      </div>
    </div>
  }

  @if (sessions().length === 0) {
    <div class="overflow-dialog__empty">此時段沒有重疊的課程</div>
  }
</div>

<div class="overflow-dialog__footer">
  <p-button
    label="關閉"
    severity="secondary"
    [text]="true"
    size="small"
    (onClick)="closeDialog()"
  />
</div>
