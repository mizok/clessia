@for (g of groups(); track g.start) {
  <!-- 分組是 div（A6 `.lg`）：不是 landmark，同一頁會有幾十個「17:00 開始」區塊，讀屏的區塊清單會被灌爆 -->
  <div class="mt-4 first:mt-0">
    <!-- 分組標頭是 div（A6 `.lg__h`）：時間不是章節標題，讀屏照順序念「17:00 開始 · 4 堂」就夠 -->
    <div class="border-b border-zinc-900 pb-1 text-sm font-normal text-zinc-600 tabular-nums">
      <b class="text-base text-zinc-900">{{ g.start }}</b> 開始 · {{ g.sessions.length }} 堂
    </div>
    @for (s of g.sessions; track s.id) {
      <!--
        勾選框只在「快速選取」模式或這堂已勾時出現（A6 schedule.css:50–51，#1923）；手機一律沒有（A6）。
        週視圖的窄欄（compact）：⋯ 疊在右上角（A6 `.wc .li__more`），班名讓出 ⋯ 的寬度
      -->
      @let pickable = picking() || selectedIds().has(s.id);
      <div
        class="relative grid grid-cols-[minmax(0,1fr)_auto] items-start border-b border-surface-border"
        [class.py-2]="compact()"
        [class]="pickable ? 'wide:grid-cols-[auto_minmax(0,1fr)_auto]' : ''"
        [class.bg-zinc-100]="selectedIds().has(s.id)"
      >
        <!-- 手機沒有原地勾選框（A6）：勾課走「快速選取」面板，或長按一堂 -->
        <label
          (click)="onPickClick($event, s.id)"
          class="hidden h-11 cursor-pointer place-items-center"
          [class]="pickable ? 'wide:grid' : ''"
          [class.w-11]="!compact()"
          [class.w-7]="compact()"
        >
          <input
            type="checkbox"
            class="size-4 cursor-pointer accent-zinc-900"
            [checked]="selectedIds().has(s.id)"
            [attr.aria-label]="
              '勾 ' + s.className + ' ' + s.sessionDate.slice(5) + ' ' + s.startTime
            "
          />
        </label>
        <button
          type="button"
          class="flex min-w-0 cursor-pointer flex-col items-start gap-px border-0 bg-transparent px-0 text-left text-zinc-900"
          [class.min-h-11]="!compact()"
          [class.py-2]="!compact()"
          [attr.aria-label]="s.className + ' ' + s.startTime + '–' + s.endTime + '：看看能做什麼'"
          [attr.data-session-menu]="compact() ? s.id : null"
          (click)="onMain($event, s)"
          (pointerdown)="pressStart($event, s.id)"
          (pointerup)="pressEnd()"
          (pointercancel)="pressEnd()"
          (pointerleave)="pressEnd()"
          (contextmenu)="onContextMenu($event)"
        >
          <span
            class="text-md leading-[1.35] font-semibold"
            [class]="compact() ? 'pr-[26px]' : ''"
            [class.line-through]="s.status === 'cancelled'"
            [class.text-zinc-600]="s.status === 'cancelled'"
            >{{ s.className }}</span
          >
          @if (compact()) {
            <span class="text-sm leading-[1.35] text-zinc-600 tabular-nums"
              >到 {{ s.endTime }} ·
              <span class="whitespace-nowrap">{{ s.teacherName ?? '未指派' }}</span></span
            >
          } @else {
            <span class="text-sm leading-[1.35] text-zinc-600 tabular-nums"
              >{{ s.startTime }}–{{ s.endTime }} ·
              <span class="whitespace-nowrap">{{ s.teacherName ?? '未指派' }}</span>
              @if (s.attendanceEnrolledCount !== undefined) {
                · {{ s.attendanceEnrolledCount }} 人
              }
              @if (showCampus()) {
                · {{ s.campusName }}
              }
            </span>
          }
          <app-session-tags
            class="mt-0.5"
            [session]="s"
            [live]="live(s)"
            [clash]="clashIds().has(s.id)"
          />
        </button>
        @if (compact()) {
          <button
            type="button"
            class="absolute top-1 -right-1 grid size-11 cursor-pointer wide:size-7 place-items-center rounded-sm border-0 bg-transparent text-zinc-700 hover:bg-zinc-100 hover:text-zinc-900"
            [attr.aria-label]="s.className + ' 的操作'"
            [attr.data-session-menu]="s.id"
            (click)="menu.emit({ event: $event, session: s })"
          >
            <i class="pi pi-ellipsis-h text-sm" aria-hidden="true"></i>
          </button>
        } @else {
          <button
            type="button"
            class="inline-flex size-11 cursor-pointer items-center justify-center rounded-md border-0 bg-transparent text-zinc-900 hover:bg-zinc-200"
            [attr.aria-label]="s.className + ' 的操作'"
            [attr.data-session-menu]="s.id"
            (click)="menu.emit({ event: $event, session: s })"
          >
            <i class="pi pi-ellipsis-h" aria-hidden="true"></i>
          </button>
        }
      </div>
    }
  </div>
}
