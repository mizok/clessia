<section class="session-filters">
  <div class="session-filters__mobile">
    <!--
      手機版**刻意**用 `mm/dd` 而不是全站的 `yy-mm-dd`（#425 M4 查證後保留）：
      一、窄列塞不下 `2026-09-01 - 2026-09-30`（23 字元），短版只要 13；
      二、短版若也用連字號，`09-01 - 09-30` 裡的連字號會跟 PrimeNG 的區間分隔符
          ` - ` 撞在一起讀不開 —— 有年份的長版靠 `2026` 開頭自己斷得開，短版沒有。
      下面那支桌機版是同一個 `listDateRange()` 的另一軌，用長版。
      **這是同一概念的長短版，不是不一致** —— 要「統一」之前先讀這段。
    -->
    <p-datepicker
      class="session-filters__mobile-date clessia-filter-control clessia-filter-control--date-range"
      selectionMode="range"
      [ngModel]="listDateRange()"
      (ngModelChange)="onListDateRangeChange($event)"
      dateFormat="mm/dd"
      placeholder="日期範圍"
      inputStyleClass="p-inputtext-sm clessia-filter-input"
      [showIcon]="true"
      [appendTo]="'body'"
      [firstDayOfWeek]="1"
      [numberOfMonths]="1"
      [readonlyInput]="true"
    />
    <button class="session-filters__mobile-toggle" (click)="openAdvancedFilters.emit()">
      <i class="pi pi-filter session-filters__mobile-toggle-icon"></i>
      篩選
      @if (activeFilterCount() > 0) {
        <span class="session-filters__mobile-badge">{{ activeFilterCount() }}</span>
      }
    </button>
  </div>

  <div class="session-filters__row session-filters__row--list clessia-filter-bar">
    <p-datepicker
      class="session-filters__control clessia-filter-control clessia-filter-control--date-range"
      selectionMode="range"
      [ngModel]="listDateRange()"
      (ngModelChange)="onListDateRangeChange($event)"
      dateFormat="yy-mm-dd"
      placeholder="選擇日期範圍"
      inputStyleClass="p-inputtext-sm clessia-filter-input"
      [showIcon]="true"
      [appendTo]="'body'"
      [firstDayOfWeek]="1"
      [numberOfMonths]="1"
      [readonlyInput]="true"
    />
    @if (campuses().length > 1) {
      <p-select
        class="session-filters__control clessia-filter-control"
        size="small"
        panelStyleClass="session-filters-panel"
        [options]="campuses()"
        optionLabel="name"
        optionValue="id"
        placeholder="所有分校"
        [showClear]="true"
        [appendTo]="'body'"
        [filter]="true"
        filterBy="name"
        filterPlaceholder="搜尋分校..."
        [ngModel]="selectedCampusId()"
        (ngModelChange)="onCampusChange($event)"
      />
    }
    <p-button
      styleClass="session-filters__advanced-button"
      size="small"
      severity="secondary"
      [outlined]="true"
      (onClick)="openAdvancedFilters.emit()"
    >
      <i class="pi pi-sliders-h"></i>
      進階篩選
      @if (activeFilterCount() > 0) {
        <span class="session-filters__advanced-badge">{{ activeFilterCount() }}</span>
      }
    </p-button>
    @if (hasActiveFilters()) {
      <p-button
        label="清除篩選"
        severity="secondary"
        [text]="true"
        size="small"
        icon="pi pi-times"
        (onClick)="clearFilters.emit()"
      />
    }
  </div>
</section>
