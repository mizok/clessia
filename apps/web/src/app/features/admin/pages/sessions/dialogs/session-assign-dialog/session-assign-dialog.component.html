<form [formGroup]="form" (ngSubmit)="submit()" class="session-op-form">
  @if (submitError()) {
    <app-inline-notice
      severity="error"
      [detail]="submitError()"
      (dismissed)="submitError.set(null)"
    />
  }

  <div
    class="mb-3 flex flex-col gap-1 rounded-r-md border border-l-[3px] border-zinc-200 border-l-accent-400 bg-zinc-50 px-3 py-2"
  >
    <span class="text-xs font-semibold tracking-[0.04em] text-accent-600 uppercase">課堂</span>
    <span class="text-sm leading-normal font-medium text-zinc-700">
      {{ session()?.className }} · {{ session()?.sessionDate }} {{ session()?.startTime }}–{{
        session()?.endTime
      }}
    </span>
  </div>

  <div class="session-op-form__field">
    <label for="assignTeacher" class="session-op-form__label">
      指派老師<span class="session-op-form__required">*</span>
    </label>
    <p-select
      id="assignTeacher"
      formControlName="teacherId"
      [options]="teachers()"
      optionLabel="displayName"
      optionValue="id"
      placeholder="選擇老師"
      styleClass="w-full"
      appendTo="body"
      [filter]="true"
      filterBy="displayName"
      [loading]="loadingTeachers()"
    />
    @if (!loadingTeachers() && teachers().length === 0) {
      <p class="mt-2 mb-0 text-sm text-zinc-500">目前沒有符合該課堂分校與科目的可指派老師。</p>
    }
  </div>

  <div class="session-op-form__footer">
    <p-button label="取消" severity="secondary" [text]="true" (onClick)="closeDialog()" />
    <p-button
      label="確認指派"
      severity="primary"
      type="submit"
      [disabled]="form.invalid || loadingTeachers()"
      [loading]="isSubmitting()"
    />
  </div>
</form>
