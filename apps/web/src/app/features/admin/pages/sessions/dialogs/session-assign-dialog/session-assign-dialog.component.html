<!-- 共用殼（#2290）。A6 課表走批次步驟頁，沒畫單堂的這支；標題沿用產品原本的 header -->
<app-dialog-frame title="指派老師" (closed)="closeDialog()">
  <form [formGroup]="form" (ngSubmit)="submit()" class="session-op-form">
    @if (submitError()) {
      <app-inline-notice
        severity="error"
        [detail]="submitError()"
        (dismissed)="submitError.set(null)"
      />
    }

    <div
      class="mb-3 flex flex-col gap-1 rounded-r-md border border-l-[3px] border-zinc-200 border-l-accent-400 bg-zinc-50 px-3 py-2"
    >
      <span class="text-xs font-semibold tracking-[0.04em] text-accent-600 uppercase">課堂</span>
      <span class="text-sm leading-normal font-medium text-zinc-700">
        {{ session()?.className }} · {{ session()?.sessionDate }} {{ session()?.startTime }}–{{
          session()?.endTime
        }}
      </span>
    </div>

    <div class="session-op-form__field">
      <label for="assignTeacher" class="session-op-form__label">
        指派老師<span class="session-op-form__required">*</span>
      </label>
      <p-select
        id="assignTeacher"
        formControlName="teacherId"
        [options]="teachers()"
        optionLabel="displayName"
        optionValue="id"
        placeholder="選擇老師"
        styleClass="w-full"
        appendTo="body"
        [filter]="true"
        filterBy="displayName"
        [loading]="loadingTeachers()"
      />
      @if (!loadingTeachers() && teachers().length === 0) {
        <p class="mt-2 mb-0 text-sm text-zinc-500">目前沒有符合該課堂分校與科目的可指派老師。</p>
      }
    </div>
  </form>

  <ng-container dialogFoot>
    <button
      type="button"
      class="inline-flex h-11 cursor-pointer items-center justify-center gap-1.5 rounded-md border border-solid px-4 text-md leading-normal font-semibold whitespace-nowrap disabled:cursor-not-allowed disabled:opacity-50 wide:h-9 border-zinc-300 bg-white text-zinc-900 hover:border-zinc-400 hover:bg-zinc-50"
      (click)="closeDialog()"
    >
      取消
    </button>
    <button
      type="button"
      class="inline-flex h-11 cursor-pointer items-center justify-center gap-1.5 rounded-md border border-solid px-4 text-md leading-normal font-semibold whitespace-nowrap disabled:cursor-not-allowed disabled:opacity-50 wide:h-9 border-accent-vivid bg-accent-vivid text-zinc-900 hover:border-accent-vivid-2 hover:bg-accent-vivid-2"
      data-testid="op-submit"
      [disabled]="form.invalid || loadingTeachers() || isSubmitting()"
      (click)="submit()"
    >
      {{ isSubmitting() ? '處理中…' : '確認指派' }}
    </button>
  </ng-container>
</app-dialog-frame>
