<app-dialog-frame
  title="櫃台代刷到班"
  sub="幫沒帶卡的學生登記到班，今天所有的課都算到了"
  (closed)="closed.emit()"
>
  <!-- A6 forms.checkin：表單一律畫出來；沒人可選時下拉鎖住並說原因，不換成另一種版面 -->
  <!-- 稿 .fdlg form：列距 16、欄距 12 -->
  <form class="grid gap-x-3 gap-y-4" (submit)="$event.preventDefault(); submit()">
    <app-select-field
      label="學生（今天還沒到的）"
      labelSize="md"
      [placeholder]="candidates().length === 0 ? '今天要來的都到了或請假了' : '選一位學生'"
      [required]="true"
      [disabled]="candidates().length === 0"
      [options]="options()"
      [appendTo]="overlayHost()"
      [value]="picked()"
      (valueChange)="picked.set($event)"
    />
    @if (error(); as message) {
      <p class="m-0 text-sm text-error-700" role="alert">{{ message }}</p>
    }
  </form>
  <!-- A6 `.fdlg__foot`：必填沒填不鎖死送出鈕，左邊寫還差什麼（同 staff-form-dialog） -->
  <ng-container dialogFoot>
    <p class="form-dialog__why" aria-live="polite">{{ missingHint() }}</p>
    <button
      type="button"
      class="inline-flex h-11 cursor-pointer items-center justify-center gap-1.5 rounded-md border border-solid border-zinc-300 bg-white px-4 text-md leading-normal font-semibold whitespace-nowrap text-zinc-900 hover:border-zinc-400 hover:bg-zinc-50 wide:h-9"
      (click)="closed.emit()"
    >
      取消
    </button>
    <button
      type="button"
      class="inline-flex h-11 cursor-pointer items-center justify-center gap-1.5 rounded-md border border-solid border-accent-vivid bg-accent-vivid px-4 text-md leading-normal font-semibold whitespace-nowrap text-zinc-900 hover:border-accent-vivid-2 hover:bg-accent-vivid-2 aria-disabled:opacity-55 wide:h-9"
      data-testid="checkin-desk-submit"
      [attr.aria-disabled]="!!missingHint() || busy()"
      (click)="submit()"
    >
      {{ busy() ? '登記中…' : '登記到班' }}
    </button>
  </ng-container>
</app-dialog-frame>
