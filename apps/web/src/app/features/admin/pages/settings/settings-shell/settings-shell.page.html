<app-page-open>
  <ng-container openTitle
    ><span class="settings-shell__title">{{ page().label }}</span></ng-container
  >
</app-page-open>

<div class="page-wrap pt-4">
  <p-tabs [value]="activeTab()" (valueChange)="onTabChange($event)">
    <p-tablist>
      @for (tab of tabs; track tab.value) {
        <p-tab [value]="tab.value">{{ tab.label }}</p-tab>
      }
    </p-tablist>
  </p-tabs>
</div>

<div class="page-wrap pt-6 pb-12 wide:pt-8">
  <router-outlet />
</div>
