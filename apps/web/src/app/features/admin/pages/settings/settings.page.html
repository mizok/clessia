<p-toast appendTo="body" />

<div class="settings-page">
  <div class="settings-page__header">
    <h2 class="settings-page__title">{{ page().label }}</h2>
  </div>

  @if (loading()) {
    <div class="settings-page__section">
      <p-skeleton height="2rem" styleClass="mb-2" />
      <p-skeleton height="3rem" />
    </div>
  } @else if (loadFailed()) {
    <!--
      **取數失敗不能渲染表單**（#805）：`attendanceModeValue` 這時是硬編碼的
      `'per_session'`，一間實際設定為 `daily_checkin` 的補習班會看到「隨堂點名」被選中，
      而儲存鈕可按 —— 按下去就把那個沒讀到的值寫回去，靜靜改掉出勤模式。
    -->
    <app-load-failed description="沒有讀到系統設定，可能是連線問題" (retry)="loadSettings()" />
  } @else {
    <div class="settings-page__section">
      <h3 class="settings-page__section-title">出勤紀錄模式</h3>
      <p class="settings-page__section-desc">
        <strong>隨堂點名</strong>：老師在每堂課結束後逐一標記學生出席狀態。<br />
        <strong>日到班</strong>：學生抵達分校打卡後，系統自動勾選當天所有課堂為出席。
      </p>
      <div class="settings-page__control">
        <p-selectbutton
          [options]="attendanceModeOptions"
          [(ngModel)]="attendanceModeValue"
          optionLabel="label"
          optionValue="value"
        />
        <span class="settings-page__divider" aria-hidden="true"></span>
        <p-button
          label="儲存"
          icon="pi pi-check"
          [loading]="saving()"
          (onClick)="saveAttendanceMode()"
        />
      </div>
    </div>

    <div class="settings-page__section">
      <h3 id="settings-responsible-title" class="settings-page__section-title">誰負責點名</h3>
      <p class="settings-page__section-desc">
        <strong>行政負責</strong
        >：由行政人員點名。老師端只看得到自己課堂的名單與到／假／缺，不能點名或修改。<br />
        <strong>老師負責</strong>：老師端出現點名、教務日誌、聯絡簿，可在補登期限內修改。
      </p>
      <div class="settings-page__control">
        <p-selectbutton
          [options]="attendanceResponsibleOptions"
          [(ngModel)]="attendanceResponsibleValue"
          optionLabel="label"
          optionValue="value"
          ariaLabelledBy="settings-responsible-title"
        />
        <span class="settings-page__divider" aria-hidden="true"></span>
        <p-button
          label="儲存"
          icon="pi pi-check"
          [loading]="savingResponsible()"
          (onClick)="saveAttendanceResponsible()"
        />
      </div>
    </div>
  }
</div>
