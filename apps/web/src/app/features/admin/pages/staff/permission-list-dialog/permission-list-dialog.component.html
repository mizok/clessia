<div class="dialog-header-inline">
  <div class="dialog-header-inline__content">
    <span class="dialog-header-inline__title">{{ staffName }} 的權限</span>
  </div>
  <button
    type="button"
    class="dialog-header-inline__close size-11"
    (click)="close()"
    aria-label="關閉"
  >
    <i class="pi pi-times"></i>
  </button>
</div>

<div class="flex flex-col gap-4 p-4">
  @if (items.length > 0) {
    <ul class="m-0 flex list-none flex-col gap-2 p-0">
      @for (item of items; track item.value) {
        <li
          class="flex flex-col rounded-md bg-zinc-100 px-3 py-2"
          [attr.data-permission]="item.value"
        >
          <b class="text-base text-zinc-900">{{ item.label }}</b>
          <span class="text-sm text-zinc-600">{{ item.description }}</span>
        </li>
      }
    </ul>
  } @else {
    <p class="m-0 text-base text-zinc-700">沒有額外的細部權限。</p>
  }
  <p class="m-0 text-sm text-zinc-600">要調整權限，請從這個人的「編輯」進去。</p>
  <div class="flex justify-end">
    <p-button label="關閉" severity="secondary" [outlined]="true" (onClick)="close()" />
  </div>
</div>
