<!-- 共用殼（#2290）：標題照 A6 settings.html schoolForm（編輯寫「編輯學校：簡稱」） -->
<app-dialog-frame [title]="title()" (closed)="close()">
  <div class="flex flex-col gap-4">
    <div class="form-dialog__field">
      <label class="form-dialog__label" for="school-name"
        >學校全名<span class="form-dialog__required">*</span></label
      >
      <input
        pInputText
        id="school-name"
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
        placeholder="例：台北市立明湖國中"
      />
    </div>

    <!-- A6：簡稱與學制同一列（各半寬），手機疊成兩列 -->
    <div class="grid gap-4 wide:grid-cols-2">
      <div class="form-dialog__field">
        <label class="form-dialog__label" for="school-short">簡稱（選填）</label>
        <input
          pInputText
          id="school-short"
          [ngModel]="shortName()"
          (ngModelChange)="shortName.set($event)"
          placeholder="例：明湖國中"
        />
      </div>
      <div class="form-dialog__field">
        <label class="form-dialog__label" for="school-level">學制</label>
        <p-select
          inputId="school-level"
          [options]="levelOptions"
          optionLabel="label"
          optionValue="value"
          [ngModel]="level()"
          (ngModelChange)="level.set($event)"
          appendTo="body"
        />
      </div>
    </div>

    <fieldset class="form-dialog__field m-0 border-0 p-0">
      <legend class="form-dialog__label">狀態</legend>
      <div class="flex gap-6">
        <label class="flex min-h-11 items-center gap-2">
          <p-radiobutton
            name="school-status"
            [value]="true"
            [ngModel]="isActive()"
            (ngModelChange)="isActive.set($event)"
          />
          啟用
        </label>
        <label class="flex min-h-11 items-center gap-2">
          <p-radiobutton
            name="school-status"
            [value]="false"
            [ngModel]="isActive()"
            (ngModelChange)="isActive.set($event)"
          />
          停用
        </label>
      </div>
    </fieldset>
  </div>

  <ng-container dialogFoot>
    <p class="form-dialog__why" aria-live="polite">{{ missingHint() }}</p>
    <button
      type="button"
      class="inline-flex h-11 cursor-pointer items-center justify-center gap-1.5 rounded-md border border-solid border-zinc-300 bg-white px-4 text-md leading-normal font-semibold whitespace-nowrap text-zinc-900 hover:border-zinc-400 hover:bg-zinc-50 wide:h-9"
      (click)="close()"
    >
      取消
    </button>
    <button
      type="button"
      class="inline-flex h-11 cursor-pointer items-center justify-center gap-1.5 rounded-md border border-solid border-accent-vivid bg-accent-vivid px-4 text-md leading-normal font-semibold whitespace-nowrap text-zinc-900 hover:border-accent-vivid-2 hover:bg-accent-vivid-2 aria-disabled:opacity-55 wide:h-9"
      data-testid="school-submit"
      [attr.aria-disabled]="!canSubmit()"
      (click)="submit()"
    >
      {{ submitting() ? '儲存中…' : '儲存' }}
    </button>
  </ng-container>
</app-dialog-frame>
