<div class="form-dialog">
  <div class="dialog-header-inline">
    <div class="dialog-header-inline__content">
      <span class="dialog-header-inline__title">{{
        mode() === 'create' ? '新增學校' : '編輯學校'
      }}</span>
    </div>
    <button
      type="button"
      class="dialog-header-inline__close size-11"
      (click)="close()"
      aria-label="關閉"
    >
      <i class="pi pi-times"></i>
    </button>
  </div>

  <div class="flex flex-col gap-4">
    <div class="form-dialog__field">
      <label class="form-dialog__label">學校全名<span class="form-dialog__required">*</span></label>
      <input
        pInputText
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
        placeholder="例：台北市立明湖國中"
      />
    </div>

    <!-- A6：簡稱與學制同一列（各半寬），手機疊成兩列 -->
    <div class="grid gap-4 wide:grid-cols-2">
      <div class="form-dialog__field">
        <label class="form-dialog__label" for="school-short">簡稱（選填）</label>
        <input
          pInputText
          id="school-short"
          [ngModel]="shortName()"
          (ngModelChange)="shortName.set($event)"
          placeholder="例：明湖國中"
        />
      </div>
      <div class="form-dialog__field">
        <label class="form-dialog__label" for="school-level">學制</label>
        <p-select
          inputId="school-level"
          [options]="levelOptions"
          optionLabel="label"
          optionValue="value"
          [ngModel]="level()"
          (ngModelChange)="level.set($event)"
          appendTo="body"
        />
      </div>
    </div>

    <fieldset class="form-dialog__field m-0 border-0 p-0">
      <legend class="form-dialog__label">狀態</legend>
      <div class="flex gap-6">
        <label class="flex min-h-11 items-center gap-2">
          <p-radiobutton
            name="school-status"
            [value]="true"
            [ngModel]="isActive()"
            (ngModelChange)="isActive.set($event)"
          />
          啟用
        </label>
        <label class="flex min-h-11 items-center gap-2">
          <p-radiobutton
            name="school-status"
            [value]="false"
            [ngModel]="isActive()"
            (ngModelChange)="isActive.set($event)"
          />
          停用
        </label>
      </div>
    </fieldset>

    <div class="form-dialog__footer">
      <button
        pButton
        class="min-h-11"
        label="取消"
        severity="secondary"
        size="small"
        text
        (click)="close()"
      ></button>
      <button
        pButton
        class="min-h-11"
        label="儲存"
        size="small"
        [disabled]="!canSubmit()"
        [loading]="submitting()"
        (click)="submit()"
      ></button>
    </div>
  </div>
</div>
