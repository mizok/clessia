<div class="flex flex-col gap-4">
  <!--
    **不用麵包屑**（#728）：這一頁是 `/admin/settings` tab 殼底下的一個 tab，
    而殼自己已經畫了 `<h1>系統設定</h1>` + tab 列 —— 再放一條
    `系統設定 › 學校管理` 會讓「系統設定」在同一個畫面上出現兩次，
    而且切到別的 tab 時那條又不見了。

    標題用 `<h2>` 不是 `<h1>`：**殼擁有這個頁面的 h1**。
    樣式與另外三個 tab 相同（`--text-2xl` / bold），所以畫面不會不一樣。
  -->
  <header
    class="flex flex-col items-stretch gap-4 wide:flex-row wide:items-start wide:justify-between"
  >
    <div class="flex flex-col gap-1">
      <h2 class="schools-page__title m-0 text-lg font-semibold text-zinc-900">學校管理</h2>
      <p class="m-0 text-sm text-zinc-500">管理學生就讀的學校清單，供學生資料填寫時選用</p>
    </div>
  </header>

  <div class="flex flex-wrap items-center gap-3">
    <input
      pInputText
      placeholder="搜尋學校名稱..."
      [ngModel]="search()"
      (ngModelChange)="onSearch($event)"
    />
    <button
      pButton
      class="min-h-11"
      icon="pi pi-plus"
      label="新增學校"
      size="small"
      (click)="openCreate()"
    ></button>
  </div>

  <!-- 第一次才是轉圈；之後重抓保留舊內容並變淡（#1641 5b） -->
  <app-reload-veil [loading]="loading()">
    <div reloadSkeleton class="flex items-center gap-2 p-8 text-zinc-500">
      <i class="pi pi-spinner pi-spin"></i> 載入中…
    </div>
    @if (loadFailed()) {
      <app-load-failed description="沒有讀到學校清單，可能是連線問題" (retry)="load()" />
    } @else if (schools().length === 0) {
      <app-empty-state
        icon="pi pi-building-columns"
        title="尚無學校"
        description="點右上角「新增學校」建立第一筆"
      />
    } @else {
      <!-- 原生表格＋@for（#1641 5b）：p-table 的列沒有穩定身分，列不能各自淡入淡出與補位 -->
      <div class="overflow-x-auto rounded-lg border border-zinc-200 bg-white">
        <table class="w-full border-collapse text-left text-sm text-zinc-900">
          <thead>
            <tr class="border-b border-zinc-200 bg-zinc-50 text-zinc-600">
              <th class="px-4 py-3 font-semibold">名稱</th>
              <th class="px-4 py-3 font-semibold">簡稱</th>
              <th class="px-4 py-3 font-semibold">學生數</th>
              <th class="px-4 py-3 font-semibold">狀態</th>
              <th class="w-[140px] px-4 py-3 font-semibold">操作</th>
            </tr>
          </thead>
          <tbody>
            @for (school of schools(); track school.id) {
              <tr
                class="vt-row border-b border-zinc-200 last:border-b-0"
                [style.view-transition-name]="'school-' + school.id"
              >
                <td class="px-4 py-2">{{ school.name }}</td>
                <td class="px-4 py-2">{{ school.shortName ?? '—' }}</td>
                <td class="px-4 py-2 tabular-nums">{{ school.studentCount }}</td>
                <td class="px-4 py-2">
                  <app-status-dot [tone]="school.isActive ? 'done' : 'inactive'">{{
                    school.isActive ? '啟用' : '停用'
                  }}</app-status-dot>
                </td>
                <td class="px-4 py-1">
                  <button
                    pButton
                    icon="pi pi-pencil"
                    severity="secondary"
                    size="small"
                    text
                    class="size-11"
                    aria-label="編輯學校"
                    (click)="openEdit(school)"
                  ></button>
                  <button
                    pButton
                    icon="pi pi-trash"
                    severity="danger"
                    size="small"
                    text
                    class="size-11"
                    aria-label="刪除學校"
                    (click)="onDelete(school)"
                  ></button>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    }
  </app-reload-veil>

  <p-confirmDialog />
</div>
