<div class="schools-page">
  <app-page-breadcrumb [items]="breadcrumbs" />

  <div class="schools-page__toolbar">
    <input
      pInputText
      placeholder="搜尋學校名稱..."
      [ngModel]="search()"
      (ngModelChange)="onSearch($event)"
    />
    <button pButton icon="pi pi-plus" label="新增學校" size="small" (click)="openCreate()"></button>
  </div>

  @if (loading()) {
    <div class="schools-page__loading"><i class="pi pi-spinner pi-spin"></i> 載入中…</div>
  } @else if (schools().length === 0) {
    <app-empty-state
      icon="pi pi-building-columns"
      title="尚無學校"
      description="點右上角「新增學校」建立第一筆"
    />
  } @else {
    <p-table [value]="schools()" styleClass="schools-page__table">
      <ng-template pTemplate="header">
        <tr>
          <th>名稱</th>
          <th>簡稱</th>
          <th>學生數</th>
          <th>狀態</th>
          <th style="width: 140px">操作</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-school>
        <tr>
          <td>{{ school.name }}</td>
          <td>{{ school.shortName ?? '—' }}</td>
          <td>{{ school.studentCount }}</td>
          <td>
            <p-tag
              [value]="school.isActive ? '啟用' : '停用'"
              [severity]="school.isActive ? 'success' : 'secondary'"
            />
          </td>
          <td>
            <button
              pButton
              icon="pi pi-pencil"
              severity="secondary"
              size="small"
              text
              (click)="openEdit(school)"
            ></button>
            <button
              pButton
              icon="pi pi-trash"
              severity="danger"
              size="small"
              text
              (click)="onDelete(school)"
            ></button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  }

  @if (dialogOpen()) {
    <app-school-form-dialog
      [editing]="editing()"
      (saved)="onSaved($event)"
      (closed)="dialogOpen.set(false)"
    />
  }

  <p-toast />
  <p-confirmDialog />
</div>
