<!-- 共用殼（#2290）。標題寫期別（#2316）：同一位學生好幾張帳單，收之前要看得出是哪一張 -->
<app-dialog-frame [title]="title()" (closed)="cancel()">
  <!-- #2396 B＋C：是誰，以及決定收多少要看的應繳、已收、尚欠、到期 -->
  <p class="m-0 text-sm text-zinc-600" data-part="dialog-context">{{ context() }}</p>
  <div class="flex flex-col gap-4">
    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium text-zinc-600" for="pf-amount">
        {{ isRefund() ? '退費金額 *' : '收款金額 *' }}
      </label>
      <p-inputnumber
        inputId="pf-amount"
        mode="currency"
        currency="TWD"
        locale="zh-TW"
        [min]="0"
        [maxFractionDigits]="0"
        [ngModel]="form().amount"
        (ngModelChange)="update('amount', $event)"
      />
      @if (!isRefund()) {
        <span class="text-xs text-zinc-500">
          可以少於應繳 —— 部分收款是常態，帳單會自動變成「部分繳」。
        </span>
      }
    </div>

    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium text-zinc-600" for="pf-method">付款方式 *</label>
      <p-select
        inputId="pf-method"
        optionLabel="label"
        optionValue="value"
        [options]="methodOptions"
        [ngModel]="form().method"
        (ngModelChange)="update('method', $event)"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium text-zinc-600" for="pf-paid-at">
        {{ isRefund() ? '退費日期 *' : '收款日期 *' }}
      </label>
      <p-datepicker
        inputId="pf-paid-at"
        dateFormat="yy-mm-dd"
        [showIcon]="true"
        [ngModel]="form().paidAt"
        (ngModelChange)="update('paidAt', $event)"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium text-zinc-600" for="pf-note">
        備註{{ isRefund() ? '（退費原因，必填）' : '' }}
      </label>
      <input
        id="pf-note"
        type="text"
        pInputText
        maxlength="200"
        [placeholder]="
          isRefund()
            ? '如：期中退班，剩餘 6 週按比例退'
            : form().method === 'transfer'
              ? '如：轉帳末五碼 12345'
              : '如：定金'
        "
        [ngModel]="form().note"
        (ngModelChange)="update('note', $event)"
      />
    </div>

    @if (form().method === 'transfer') {
      <p class="m-0 rounded-md border border-zinc-200 bg-zinc-50 p-3 text-xs text-zinc-600">
        憑證圖上傳尚未開放。目前請把帳號後五碼寫在備註裡，家長回傳的截圖先留在原本的地方。
      </p>
    }
  </div>

  <ng-container dialogFoot>
    <p-button label="取消" [text]="true" severity="secondary" (onClick)="cancel()" />
    <p-button
      [label]="isRefund() ? '記錄退費' : '記錄收款'"
      [severity]="isRefund() ? 'danger' : 'primary'"
      [loading]="saving()"
      (onClick)="save()"
    />
  </ng-container>
</app-dialog-frame>
