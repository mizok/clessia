<div class="flex flex-col gap-5 p-5">
  <header class="flex flex-col gap-1">
    <h2 class="m-0 text-lg font-semibold text-zinc-900">記錄堂數購買</h2>
    <p class="m-0 text-xs text-zinc-500">{{ data.studentName }}</p>
  </header>

  <div class="flex flex-col gap-4">
    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium text-zinc-600" for="spf-count">購買堂數 *</label>
      <p-inputnumber
        inputId="spf-count"
        [min]="1"
        [showButtons]="true"
        [ngModel]="form().purchasedCount"
        (ngModelChange)="update('purchasedCount', $event)"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium text-zinc-600" for="spf-date">購買日期 *</label>
      <p-datepicker
        inputId="spf-date"
        dateFormat="yy-mm-dd"
        [showIcon]="true"
        [ngModel]="form().purchasedAt"
        (ngModelChange)="update('purchasedAt', $event)"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium text-zinc-600" for="spf-note">備註</label>
      <input
        id="spf-note"
        type="text"
        pInputText
        maxlength="200"
        placeholder="如：現金付訖"
        [ngModel]="form().note"
        (ngModelChange)="update('note', $event)"
      />
    </div>
  </div>

  <footer class="flex justify-end gap-2">
    <p-button label="取消" [text]="true" severity="secondary" (onClick)="cancel()" />
    <p-button label="記錄購買" [loading]="saving()" (onClick)="save()" />
  </footer>
</div>
