<!-- A6 `.coll`（#1705 共用樣式）；學生檔案的摺疊列同一組一次只開一個（name="student-folds"，帳單章也是這一組） -->
<details class="coll" name="student-folds">
  <summary class="coll__sum min-h-14 wide:min-h-16">
    <h2 class="coll__t m-0">{{ title() }}</h2>
    <span appTextSwap class="coll__m">{{ meta() }}</span>
  </summary>
  <div class="coll__body">
    <ng-content />
  </div>
</details>
