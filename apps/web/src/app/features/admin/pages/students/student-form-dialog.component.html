<!-- 共用殼（#2290）：h2 當可及名稱，內距與底部照殼 -->
<app-dialog-frame [title]="isCreateMode() ? '新增學生' : '編輯學生資料'" (closed)="cancel()">
  <!-- 姓名 -->
  <div class="form-dialog__field">
    <label for="student-form-dialog-1" class="form-dialog__label">
      姓名<span class="form-dialog__required">*</span>
    </label>
    <input
      id="student-form-dialog-1"
      type="text"
      pInputText
      [ngModel]="formData().name"
      (ngModelChange)="updateForm('name', $event)"
      placeholder="請輸入學生姓名"
      [disabled]="loading()"
      [class.p-invalid]="!!errors()['name']"
      class="w-full"
    />
    @if (errors()['name']; as msg) {
      <span class="mt-1 block text-xs text-error-600">{{ msg }}</span>
    }
  </div>

  <!-- 家長（選填，僅在未預填家長時顯示 —— 對齊「新增學生」兩個入口的能力） -->
  @if (showParentPicker()) {
    <div class="form-dialog__field">
      <label for="student-form-dialog-2" class="form-dialog__label">家長（選填）</label>
      <p-autocomplete
        inputId="student-form-dialog-2"
        [ngModel]="selectedParent()"
        (ngModelChange)="onParentChange($event)"
        [suggestions]="parentSuggestions()"
        (completeMethod)="searchParents($event)"
        optionLabel="name"
        placeholder="輸入姓名搜尋既有家長，留空即建立無家長學生"
        [disabled]="loading()"
        [fluid]="true"
        [appendTo]="'body'"
      >
        <ng-template pTemplate="item" let-parent>
          <div class="flex flex-col gap-1">
            <span>{{ parent.name }}</span>
            <span class="text-[0.8125rem] text-zinc-600">{{ formatParentMeta(parent) }}</span>
          </div>
        </ng-template>
      </p-autocomplete>
    </div>
  }

  <!-- 年級 + 學校 -->
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <div class="form-dialog__field">
      <label for="student-form-dialog-3" class="form-dialog__label">
        年級<span class="form-dialog__required">*</span>
      </label>
      <p-select
        inputId="student-form-dialog-3"
        [options]="gradeOptions"
        [ngModel]="formData().grade"
        (ngModelChange)="updateForm('grade', $event)"
        optionLabel="label"
        optionValue="value"
        placeholder="選擇年級"
        [disabled]="loading()"
        [class.p-invalid]="!!errors()['grade']"
        styleClass="w-full"
      />
      @if (errors()['grade']; as msg) {
        <span class="mt-1 block text-xs text-error-600">{{ msg }}</span>
      }
    </div>
    <div class="form-dialog__field">
      <label for="student-form-dialog-4" class="form-dialog__label">
        就讀學校<span class="form-dialog__required">*</span>
      </label>
      <div class="flex items-stretch gap-2 [&>:first-child]:flex-1">
        <p-select
          inputId="student-form-dialog-4"
          [options]="schools()"
          [ngModel]="formData().schoolId"
          (ngModelChange)="updateForm('schoolId', $event)"
          optionLabel="name"
          optionValue="id"
          [filter]="true"
          filterBy="name,shortName"
          [showClear]="true"
          placeholder="選擇或搜尋學校"
          [disabled]="loading()"
          [class.p-invalid]="!!errors()['schoolId']"
          [appendTo]="'body'"
          styleClass="w-full"
        />
        <p-button
          icon="pi pi-plus"
          severity="secondary"
          size="small"
          [text]="true"
          (onClick)="creatingSchool.set(true)"
          [disabled]="loading()"
          pTooltip="新增學校"
        />
      </div>
      @if (errors()['schoolId']; as msg) {
        <span class="mt-1 block text-xs text-error-600">{{ msg }}</span>
      }
      @if (creatingSchool()) {
        <div class="mt-2 flex items-center gap-2">
          <input
            pInputText
            [ngModel]="newSchoolName()"
            (ngModelChange)="newSchoolName.set($event)"
            placeholder="輸入新學校全名"
            class="w-full"
          />
          <p-button
            label="建立"
            size="small"
            [disabled]="!newSchoolName().trim()"
            (onClick)="quickCreateSchool()"
          />
          <p-button
            label="取消"
            severity="secondary"
            size="small"
            [text]="true"
            (onClick)="creatingSchool.set(false); newSchoolName.set('')"
          />
        </div>
      }
    </div>
  </div>

  <!-- 生日 + 性別 -->
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <div class="form-dialog__field">
      <label for="student-form-dialog-5" class="form-dialog__label">生日</label>
      <p-datepicker
        inputId="student-form-dialog-5"
        [ngModel]="formData().birthday"
        (ngModelChange)="updateForm('birthday', $event)"
        placeholder="選擇生日"
        dateFormat="yy-mm-dd"
        [showIcon]="true"
        [disabled]="loading()"
        styleClass="w-full"
      />
    </div>
    <div class="form-dialog__field">
      <label for="student-form-dialog-6" class="form-dialog__label">性別</label>
      <p-select
        inputId="student-form-dialog-6"
        [options]="genderOptions"
        [ngModel]="formData().gender"
        (ngModelChange)="updateForm('gender', $event)"
        optionLabel="label"
        optionValue="value"
        placeholder="選擇性別"
        [showClear]="true"
        [disabled]="loading()"
        styleClass="w-full"
      />
    </div>
  </div>

  <!-- 電話 + Email -->
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <div class="form-dialog__field">
      <label for="student-form-dialog-7" class="form-dialog__label">學生電話</label>
      <input
        id="student-form-dialog-7"
        type="tel"
        pInputText
        [ngModel]="formData().phone"
        (ngModelChange)="updateForm('phone', $event)"
        placeholder="0912-345-678"
        [disabled]="loading()"
        class="w-full"
      />
    </div>
    <div class="form-dialog__field">
      <label for="student-form-dialog-8" class="form-dialog__label">學生 Email</label>
      <input
        id="student-form-dialog-8"
        type="email"
        pInputText
        [ngModel]="formData().email"
        (ngModelChange)="updateForm('email', $event)"
        placeholder="student@example.com"
        [disabled]="loading()"
        class="w-full"
      />
    </div>
  </div>

  <!-- 地址 -->
  <div class="form-dialog__field">
    <label for="student-form-dialog-9" class="form-dialog__label">居住地址</label>
    <input
      id="student-form-dialog-9"
      type="text"
      pInputText
      [ngModel]="formData().address"
      (ngModelChange)="updateForm('address', $event)"
      placeholder="完整居住地址"
      [disabled]="loading()"
      class="w-full"
    />
  </div>

  <!-- 緊急聯絡人 -->
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <div class="form-dialog__field">
      <label for="student-form-dialog-10" class="form-dialog__label">緊急聯絡人姓名</label>
      <input
        id="student-form-dialog-10"
        type="text"
        pInputText
        [ngModel]="formData().emergencyContactName"
        (ngModelChange)="updateForm('emergencyContactName', $event)"
        placeholder="緊急聯絡人"
        [disabled]="loading()"
        class="w-full"
      />
    </div>
    <div class="form-dialog__field">
      <label for="student-form-dialog-11" class="form-dialog__label">緊急聯絡人電話</label>
      <input
        id="student-form-dialog-11"
        type="tel"
        pInputText
        [ngModel]="formData().emergencyContactPhone"
        (ngModelChange)="updateForm('emergencyContactPhone', $event)"
        placeholder="緊急聯絡電話"
        [disabled]="loading()"
        class="w-full"
      />
    </div>
  </div>

  <!-- 備註 -->
  <div class="form-dialog__field">
    <label for="student-form-dialog-12" class="form-dialog__label">備註</label>
    <textarea
      id="student-form-dialog-12"
      pTextarea
      [ngModel]="formData().notes"
      (ngModelChange)="updateForm('notes', $event)"
      placeholder="特殊需求、注意事項..."
      rows="3"
      [disabled]="loading()"
      class="w-full"
    ></textarea>
  </div>

  <ng-container dialogFoot>
    <p-button
      label="取消"
      [text]="true"
      severity="secondary"
      [disabled]="loading()"
      (onClick)="cancel()"
    />
    <p-button
      [label]="isCreateMode() ? '建立學生' : '儲存'"
      [icon]="loading() ? 'pi pi-spinner pi-spin' : 'pi pi-check'"
      [loading]="loading()"
      (onClick)="save()"
      [disabled]="loading()"
    />
  </ng-container>
</app-dialog-frame>
