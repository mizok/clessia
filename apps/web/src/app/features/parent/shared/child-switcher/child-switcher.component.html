@if (childScope.status() === 'failed') {
  <!--
    **不講的話這裡什麼都不會出現** —— 而三頁的 effect 也因為 activeChildId 是 null
    而不打 API，結果是一個完全空白的家長端，跟「這個帳號還沒綁孩子」一模一樣。
  -->
  <div class="child-switcher">
    <span class="child-switcher__badge child-switcher__badge--error">讀不到孩子資料</span>
  </div>
} @else if (childScope.children().length > 0) {
  <div class="child-switcher">
    @if (childScope.canSwitch()) {
      <button
        #switcherTrigger
        type="button"
        class="child-switcher__badge child-switcher__badge--interactive"
        (click)="pop.toggle($event, switcherTrigger)"
      >
        {{ childScope.activeChild()?.name }}
        <i class="child-switcher__badge-icon pi pi-chevron-down"></i>
      </button>

      <p-popover #pop styleClass="child-switcher-overlay">
        <div class="child-switcher__list">
          <p class="child-switcher__list-title">切換孩子</p>
          @for (child of otherChildren(); track child.id) {
            <button
              class="child-switcher__list-item"
              type="button"
              (click)="pop.hide(); select(child.id)"
            >
              {{ child.name }}
            </button>
          }
        </div>
      </p-popover>
    } @else {
      <span class="child-switcher__badge">{{ childScope.activeChild()?.name }}</span>
    }
  </div>
}
