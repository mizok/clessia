@if (childScope.status() === 'failed') {
  <!--
    **不講的話這裡什麼都不會出現** —— 而三頁的 effect 也因為 activeChildId 是 null
    而不打 API，結果是一個完全空白的家長端，跟「這個帳號還沒綁孩子」一模一樣。
  -->
  <div class="child-switcher inline-flex items-center">
    <span
      class="child-switcher__badge child-switcher__badge--error inline-flex items-center gap-2 rounded-full border border-band-ink-muted px-3 py-1 text-xs font-semibold tracking-[0.02em] text-error-600"
      >讀不到孩子資料</span
    >
  </div>
} @else if (childScope.children().length > 0) {
  <div class="child-switcher inline-flex items-center">
    @if (childScope.canSwitch()) {
      <button
        #switcherTrigger
        type="button"
        class="child-switcher__badge child-switcher__badge--interactive inline-flex min-h-11 -my-0.5 pointer-coarse:my-0 cursor-pointer items-center gap-2 rounded-full border border-band-ink-muted bg-transparent py-1 pr-2 pl-3 text-xs font-semibold tracking-[0.02em] text-band-ink hover:bg-[rgb(0_0_0/6%)]"
        (click)="pop.toggle($event, switcherTrigger)"
      >
        {{ childScope.activeChild()?.name }}
        <i class="child-switcher__badge-icon pi pi-chevron-down text-[10px]"></i>
      </button>

      <p-popover #pop styleClass="child-switcher-overlay">
        <div class="child-switcher__list flex min-w-[160px] flex-col p-2">
          <p
            class="child-switcher__list-title mx-0 mt-0 mb-1 px-2 text-xs font-semibold text-zinc-500"
          >
            切換孩子
          </p>
          @for (child of otherChildren(); track child.id) {
            <button
              class="child-switcher__list-item block min-h-11 -my-0.5 pointer-coarse:my-0 w-full cursor-pointer rounded-md border-0 bg-transparent p-2 text-left text-sm text-zinc-900 hover:bg-zinc-100"
              type="button"
              (click)="pop.hide(); select(child.id)"
            >
              {{ child.name }}
            </button>
          }
        </div>
      </p-popover>
    } @else {
      <span
        class="child-switcher__badge inline-flex items-center gap-2 rounded-full border border-band-ink-muted px-3 py-1 text-xs font-semibold tracking-[0.02em] text-band-ink"
        >{{ childScope.activeChild()?.name }}</span
      >
    }
  </div>
}
