<div class="parent-notifications">
  <app-announcement-inbox [heading]="page().label">
    @if (push.state() === 'default') {
      <div inboxOpen class="parent-notifications__hint mt-4 flex flex-wrap items-center gap-3">
        <p class="m-0 text-base font-medium text-band-ink">
          開啟繳費提醒，帳單快到期時手機會通知你。
        </p>
        <button
          type="button"
          class="inline-flex h-11 cursor-pointer items-center justify-center gap-1.5 rounded-md border-0 bg-zinc-900 px-4 text-md leading-[1.5] font-semibold whitespace-nowrap text-white hover:bg-zinc-800 disabled:cursor-wait disabled:opacity-70 wide:h-9"
          data-testid="push-hint-enable"
          [disabled]="enabling()"
          (click)="enable()"
        >
          <i class="pi pi-bell" aria-hidden="true"></i>
          開啟繳費提醒
        </button>
        @if (enableFailed()) {
          <p class="m-0 w-full text-md font-semibold text-band-ink" role="alert">
            沒有設定成功，請再試一次。
          </p>
        }
      </div>
    }

    <button
      inboxTools
      type="button"
      class="parent-notifications__settings inline-flex h-11 cursor-pointer items-center justify-center gap-1.5 rounded-md border border-solid border-zinc-300 bg-white px-4 text-md leading-[1.5] font-semibold whitespace-nowrap text-zinc-900 hover:border-zinc-400 hover:bg-zinc-50 wide:h-9"
      data-testid="push-settings-open"
      aria-haspopup="dialog"
      (click)="openSettings()"
    >
      <i class="pi pi-bell" aria-hidden="true"></i>
      {{ status() ? '通知設定：' + status() : '通知設定' }}
    </button>
  </app-announcement-inbox>

  <!--
    原生 <dialog> + showModal()（同管理端「發送通知」）：Esc、焦點圈住、關掉後焦點回到入口由瀏覽器做。
    桌機是對話框，≤860 是從下面滑上來的底部面板（#1634 overlay-motion）。
  -->
  <dialog
    #settings
    class="parent-notifications__dialog overlay-motion overlay-motion--from-bottom-narrow m-auto max-h-[calc(100%-2rem)] min-h-11 w-[min(560px,calc(100%-2rem))] flex-col overflow-visible rounded-lg border-0 bg-white p-0 text-zinc-900 shadow-[0_24px_48px_-12px_rgb(26_22_20/32%)] backdrop:bg-zinc-900/40 max-wide:inset-x-0 max-wide:top-auto max-wide:bottom-0 max-wide:m-0 max-wide:max-h-[calc(100%-48px)] max-wide:w-full max-wide:max-w-none max-wide:rounded-none max-wide:rounded-t-xl open:flex"
    aria-labelledby="push-settings-title"
    data-testid="push-settings-dialog"
    (click)="onBackdrop($event)"
    (close)="settingsOpen.set(false)"
  >
    <div
      class="relative min-h-0 overflow-y-auto overscroll-contain pb-[env(safe-area-inset-bottom,0px)]"
    >
      <button
        type="button"
        class="absolute top-2 right-2 grid size-11 cursor-pointer place-items-center rounded-full border-0 bg-transparent text-zinc-900 hover:bg-zinc-100"
        aria-label="關閉"
        (click)="closeSettings()"
      >
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
      @if (settingsOpen()) {
        <app-push-settings />
      }
    </div>
  </dialog>
</div>
