<div class="role-picker flex flex-col gap-5">
  <div class="text-center">
    <p
      class="mx-0 mt-0 mb-3 inline-block rounded-full bg-accent-50 px-3 py-1 text-xs font-semibold tracking-[0.08em] text-accent-600"
    >
      選擇身分
    </p>
    <h2 class="m-0 mb-2 text-xl leading-tight font-bold tracking-[-0.01em] text-zinc-900">
      {{ displayName() }}，你好
    </h2>
    <p class="m-0 text-sm leading-relaxed text-zinc-500">這個帳號有多個身分，請選擇要進入的介面</p>
  </div>

  <div class="flex flex-col gap-2">
    @for (opt of roleOptions(); track opt.role) {
      <button
        class="role-picker__option group/opt flex min-h-11 cursor-pointer items-center gap-3 rounded-lg border border-zinc-200 bg-white px-4 py-3 text-left transition-[border-color,background,translate] duration-[120ms] ease-[ease] hover:border-accent-400 hover:bg-accent-50 active:translate-y-px [&.role-picker__option--active]:border-accent-500 [&.role-picker__option--active]:bg-accent-50"
        type="button"
        [class.role-picker__option--active]="activeRole() === opt.role"
        (click)="selectRole(opt.role)"
      >
        <span
          class="flex size-9 shrink-0 items-center justify-center rounded-md bg-zinc-100 text-lg text-zinc-500 transition-[color,background] duration-[120ms] ease-[ease] group-hover/opt:bg-accent-100 group-hover/opt:text-accent-600 group-[.role-picker__option--active]/opt:bg-accent-100 group-[.role-picker__option--active]/opt:text-accent-600"
        >
          <i class="pi" [class]="'pi ' + opt.icon" aria-hidden="true"></i>
        </span>
        <span class="flex min-w-0 flex-1 flex-col">
          <span class="text-md font-semibold text-zinc-800">{{ opt.label }}</span>
          <span class="text-sm text-zinc-500">{{ opt.description }}</span>
        </span>
        <i
          class="pi pi-chevron-right shrink-0 text-sm text-zinc-300 transition-colors duration-[120ms] ease-[ease] group-hover/opt:text-accent-500"
          aria-hidden="true"
        ></i>
      </button>
    }
  </div>
</div>
