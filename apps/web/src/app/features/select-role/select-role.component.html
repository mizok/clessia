<div class="flex min-h-full flex-col items-center justify-center gap-4 px-4 py-8">
  <p class="m-0 text-3xl font-bold tracking-[-0.04em] text-zinc-300">Clessia</p>

  <!-- 有身分時內容在彈窗裡（動態 import）；沒有身分時彈窗不開，
       所以這裡要自己說明，不然使用者看到的是跟「卡在載入中」一樣的空白頁 -->
  @if (noRoles()) {
    <p class="m-0 max-w-[32ch] text-center leading-[1.7] text-muted">
      這個帳號目前沒有可用的身分，請聯絡補習班櫃檯開通。
    </p>
  }
</div>
