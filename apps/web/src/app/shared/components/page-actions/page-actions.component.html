<!-- 標頭：**手機也保留**。次要行動（操作紀錄、匯入）投影在這裡，
     它們在手機上仍然要按得到 —— 主要行動搬走不代表其他行動跟著消失。 -->
<!-- 標頭裡的 p-button（含頁面投影進來的）照 A6 `.btn`（#1591），高度改走 tbar-control（#1903 全部同高：手機 44／桌機 40）、13px／600、`0 16px`、gap 6px；
     次要（outlined secondary）白底、zinc-300 框、近黑字。PrimeNG 預設 42 高、16px／500，每頁都量到這組差 -->
<div
  class="page-actions__header flex items-center gap-2 [&_.p-button]:tbar-control [&_.p-button]:gap-1.5 [&_.p-button]:px-4 [&_.p-button]:py-0 [&_.p-button]:text-md [&_.p-button]:leading-normal [&_.p-button-label]:font-semibold [&_.p-button-outlined.p-button-secondary]:border-zinc-300 [&_.p-button-outlined.p-button-secondary]:bg-white [&_.p-button-outlined.p-button-secondary]:text-zinc-900"
>
  <ng-content />
  @if (primary(); as action) {
    <!-- 主要／次要行動在標頭裡的那一份**只在桌機出現**；手機由下方的托盤承擔 -->
    @if (secondary(); as second) {
      @if (secondaryOnDesktop()) {
        <div class="page-actions__header-secondary hidden min-[640.02px]:block">
          <p-button
            [styleClass]="secondaryClass"
            [label]="second.label"
            [icon]="second.icon ?? ''"
            [disabled]="!!second.disabled"
            [outlined]="true"
            severity="secondary"
            (onClick)="onSecondary($event)"
          />
        </div>
      }
    }
    @if (primaryOnDesktop()) {
      <div class="page-actions__header-primary hidden min-[640.02px]:block">
        <p-button
          [label]="action.label"
          [icon]="action.icon ?? ''"
          [disabled]="!!action.disabled"
          (onClick)="onPrimary($event)"
        />
      </div>
    }
  }
</div>

@if (primary(); as action) {
  <!-- 手機：浮起托盤（A6 .dock，灰底 zinc-100）：按鈕靠右、依內容寬。**只有一顆時托盤只包住按鈕**（#2005，偏離 A6 的滿版，a6-adoption-rules R5）；兩顆才滿版。**底部留白不在這裡** —— 這個元件宣告在頁面標頭，
       佔位塊放這裡等於保留了標頭下方的空間，而托盤蓋住的是清單最後一列。
       留白由 `.shell-content` 用 `:has()` 自己處理，見 shell-layout 的模板。 -->
  <div
    data-toast-dock
    class="page-actions__dock fixed right-3 bottom-[calc(12px+env(safe-area-inset-bottom,0px))] z-100 flex justify-end gap-2 rounded-lg border border-solid border-zinc-200 bg-zinc-100 p-2 shadow-[0_10px_28px_-8px_rgb(26_22_20/45%)] min-[640.02px]:hidden"
    [class.left-3]="!!secondary()"
  >
    @if (secondary(); as second) {
      <p-button
        [styleClass]="'page-actions__secondary justify-center ' + dockClass + ' ' + secondaryClass"
        [label]="second.mobileLabel ?? second.label"
        [icon]="second.icon ?? ''"
        [disabled]="!!second.disabled"
        [outlined]="true"
        severity="secondary"
        (onClick)="onSecondary($event)"
      />
    }
    <p-button
      [styleClass]="'page-actions__cta justify-center ' + dockClass"
      [label]="action.mobileLabel ?? action.label"
      [icon]="action.icon ?? ''"
      [disabled]="!!action.disabled"
      (onClick)="onPrimary($event)"
    />
  </div>
}
