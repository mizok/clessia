<!-- 標頭：**手機也保留**。次要行動（操作紀錄、匯入）投影在這裡，
     它們在手機上仍然要按得到 —— 主要行動搬走不代表其他行動跟著消失。 -->
<div class="page-actions__header flex items-center gap-2">
  <ng-content />
  @if (primary(); as action) {
    <!-- 主要／次要行動在標頭裡的那一份**只在桌機出現**；手機由下方的托盤承擔 -->
    @if (secondary(); as second) {
      <div class="page-actions__header-secondary hidden min-[640.02px]:block">
        <p-button
          [label]="second.label"
          [icon]="second.icon ?? ''"
          [disabled]="!!second.disabled"
          [outlined]="true"
          severity="secondary"
          (onClick)="onSecondary($event)"
        />
      </div>
    }
    <div class="page-actions__header-primary hidden min-[640.02px]:block">
      <p-button
        [label]="action.label"
        [icon]="action.icon ?? ''"
        [disabled]="!!action.disabled"
        (onClick)="onPrimary($event)"
      />
    </div>
  }
</div>

@if (primary(); as action) {
  <!-- 手機：浮起托盤（A6 .dock）。**底部留白不在這裡** —— 這個元件宣告在頁面標頭，
       佔位塊放這裡等於保留了標頭下方的空間，而托盤蓋住的是清單最後一列。
       留白由 `.shell-content` 用 `:has()` 自己處理，見 shell-layout 的模板。 -->
  <div
    class="page-actions__dock fixed inset-x-3 bottom-[calc(12px+env(safe-area-inset-bottom,0px))] z-100 grid auto-cols-fr grid-flow-col gap-2 rounded-lg border border-solid border-zinc-200 bg-white p-2 shadow-[0_10px_28px_-8px_rgb(26_22_20/45%)] min-[640.02px]:hidden"
  >
    @if (secondary(); as second) {
      <p-button
        styleClass="page-actions__secondary w-full justify-center"
        [label]="second.label"
        [icon]="second.icon ?? ''"
        [disabled]="!!second.disabled"
        [outlined]="true"
        severity="secondary"
        (onClick)="onSecondary($event)"
      />
    }
    <p-button
      styleClass="page-actions__cta w-full justify-center"
      [label]="action.label"
      [icon]="action.icon ?? ''"
      [disabled]="!!action.disabled"
      (onClick)="onPrimary($event)"
    />
  </div>
}
