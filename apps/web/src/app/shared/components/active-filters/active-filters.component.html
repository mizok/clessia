@if (filters().length > 0) {
  <ul class="m-0 flex list-none flex-wrap gap-2 p-0 wide:hidden" aria-label="已套用的篩選">
    @for (f of filters(); track f.key) {
      <li>
        <button
          type="button"
          class="inline-flex min-h-11 cursor-pointer items-center gap-1.5 rounded-full border border-solid border-zinc-300 bg-white px-3 text-md font-medium text-zinc-900 hover:bg-zinc-50 focus-visible:outline-2 focus-visible:outline-accent-500"
          [attr.aria-label]="'移除篩選：' + f.label"
          (click)="removed.emit(f.key)"
        >
          {{ f.label }}
          <i class="pi pi-times text-xs text-zinc-500" aria-hidden="true"></i>
        </button>
      </li>
    }
  </ul>
}
