<button
  type="button"
  class="filter-chip tbar-control flex h-9 w-fit cursor-pointer items-center gap-1.5 rounded-full border border-solid border-zinc-300 bg-white px-3 text-md leading-normal font-semibold whitespace-nowrap text-zinc-800 [font-family:inherit] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-500 [&.filter-chip--active]:border-zinc-900 [&.filter-chip--active]:text-zinc-900 [&.filter-chip--active]:shadow-[inset_0_0_0_1px_var(--zinc-900)]"
  [class.filter-chip--active]="active()"
  [attr.aria-pressed]="active()"
  (click)="toggle.emit()"
>
  @if (icon(); as ic) {
    <i class="filter-chip__icon text-sm" [class]="'pi ' + ic"></i>
  }
  <ng-content />
</button>
