<div [class]="boxClass()">
  <h2 [class]="nameClass()">
    {{ name() }}
  </h2>
  @if (sub()) {
    <span
      class="chapter-head__sub text-sm font-medium text-zinc-600 tabular-nums wide:mt-1"
      data-testid="chapter-sub"
      >{{ sub() }}</span
    >
  }
  @if (count() !== null) {
    <!-- A6 `.chap__tally`：「12 位」是同一段字、同字級；只有投影進來的補充說明是小字（`.chap__tally span`） -->
    <!-- prettier-ignore -->
    <p [class]="tallyClass()">{{ count() }} {{ unit() }}<span class="text-md font-medium tracking-normal text-zinc-600"><ng-content /></span></p>
  }
  <!-- 章頭的行動（A6 `.chap__act`）：投影帶 `chapterActions` 屬性的元素 -->
  <ng-content select="[chapterActions]" />
</div>
