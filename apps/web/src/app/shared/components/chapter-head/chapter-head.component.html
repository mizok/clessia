<div
  class="chapter-head flex items-baseline wide:flex-col wide:gap-x-0"
  [class.flex-col]="stacked()"
  [class.flex-wrap]="!stacked()"
  [class.gap-x-3]="!stacked()"
>
  <h2
    class="chapter-head__name m-0 leading-none font-bold tracking-[-0.04em] wide:text-[44px]"
    [class.text-[26px]]="!stacked()"
    [class.text-[34px]]="stacked()"
    [class.text-zinc-900]="tone() === 'default'"
    [class.text-error-700]="tone() === 'error'"
  >
    {{ name() }}
  </h2>
  @if (count() !== null) {
    <p
      class="chapter-head__tally m-0 text-lg font-bold tracking-[-0.02em] text-zinc-900 tabular-nums wide:mt-3 wide:text-xl"
      [class.mt-3]="stacked()"
    >
      {{ count() }}
      @if (unit()) {
        <span class="text-md font-medium tracking-normal text-zinc-600">{{ unit() }}</span>
      }
      <span class="text-md font-medium tracking-normal text-zinc-600"><ng-content /></span>
    </p>
  }
  <!-- 章頭的行動（A6 `.chap__act`）：投影帶 `chapterActions` 屬性的元素 -->
  <ng-content select="[chapterActions]" />
</div>
