<!-- 共用殼（#2290）：h2 當可及名稱，內距與底部照殼 -->
<app-dialog-frame title="帳號已建立" (closed)="onHide()">
  <app-inline-notice severity="info" [detail]="noticeDetail()" [dismissible]="false" />

  <div
    class="login-link__qr flex justify-center rounded-lg border border-solid border-zinc-200 bg-white p-4"
  >
    <qrcode [qrdata]="loginUrl()" [width]="220" errorCorrectionLevel="M" elementType="canvas" />
  </div>

  <p class="login-link__for m-0 text-center text-sm font-semibold text-zinc-800">
    {{ personName() }}
  </p>

  <div class="login-link__fallback flex justify-center print:hidden">
    <button
      type="button"
      class="login-link__copy-btn inline-flex min-h-11 cursor-pointer items-center gap-2 border-none bg-transparent px-3 py-2 text-sm text-zinc-500 hover:text-accent-600"
      pTooltip="複製連結"
      tooltipPosition="top"
      (click)="copyToClipboard(loginUrl(), '登入連結')"
    >
      <i class="pi pi-copy"></i>
      掃不到？複製連結用 LINE 傳給對方
    </button>
  </div>

  <ng-container dialogFoot>
    <p-button
      class="print:hidden"
      label="列印給對方帶走"
      icon="pi pi-print"
      severity="secondary"
      [outlined]="true"
      (onClick)="print()"
    />
    <p-button class="print:hidden" label="完成" (onClick)="onHide()" />
  </ng-container>
</app-dialog-frame>
