<p-toast position="top-center" [baseZIndex]="30000" />

<div class="dialog-header-inline">
  <div class="dialog-header-inline__content">
    <span class="dialog-header-inline__title">帳號已建立</span>
  </div>
  <button
    type="button"
    class="dialog-header-inline__close size-11"
    (click)="onHide()"
    aria-label="關閉"
  >
    <i class="pi pi-times"></i>
  </button>
</div>

<div class="login-link flex flex-col gap-4 p-4">
  <app-inline-notice severity="info" [detail]="noticeDetail()" [dismissible]="false" />

  <div
    class="login-link__qr flex justify-center rounded-lg border border-solid border-zinc-200 bg-white p-4"
  >
    <qrcode [qrdata]="loginUrl()" [width]="220" errorCorrectionLevel="M" elementType="canvas" />
  </div>

  <p class="login-link__for m-0 text-center text-sm font-semibold text-zinc-800">
    {{ personName() }}
  </p>

  <div class="login-link__fallback flex justify-center print:hidden">
    <button
      type="button"
      class="login-link__copy-btn inline-flex min-h-11 cursor-pointer items-center gap-2 border-none bg-transparent px-3 py-2 text-sm text-zinc-500 hover:text-accent-600"
      pTooltip="複製連結"
      tooltipPosition="top"
      (click)="copyToClipboard(loginUrl(), '登入連結')"
    >
      <i class="pi pi-copy"></i>
      掃不到？複製連結用 LINE 傳給對方
    </button>
  </div>

  <div class="login-link__actions flex justify-end gap-2 print:hidden">
    <p-button
      label="列印給對方帶走"
      icon="pi pi-print"
      severity="secondary"
      [outlined]="true"
      (onClick)="print()"
    />
    <p-button label="完成" (onClick)="onHide()" />
  </div>
</div>
