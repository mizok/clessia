<div class="dialog-frame form-dialog form-dialog--a6">
  <div class="dialog-header-inline">
    <div class="dialog-header-inline__content">
      <h2 appDialogTitle class="dialog-header-inline__title">{{ title() }}</h2>
      <!-- 沒有副標（R5「彈窗與抽屜不放副標」，#2396）：識別資訊、內容本體寫在內容區第一行 -->
    </div>
    <button
      type="button"
      class="dialog-header-inline__close size-11 wide:size-10"
      aria-label="關閉"
      (click)="closed.emit()"
    >
      <i class="pi pi-times" aria-hidden="true"></i>
    </button>
  </div>
  <div class="dialog-frame__body"><ng-content /></div>
  <div class="form-dialog__footer"><ng-content select="[dialogFoot]" /></div>
</div>
