<button
  type="button"
  class="filter-toggle tbar-control inline-flex max-w-44 cursor-pointer items-center gap-1.5 rounded-md border border-zinc-300 bg-white px-4 text-md leading-normal font-semibold whitespace-nowrap text-zinc-900 hover:border-zinc-400"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="controls()"
  (click)="open.set(!open())"
>
  <i class="pi pi-sliders-h shrink-0 text-sm" aria-hidden="true"></i>
  <span class="filter-toggle__label truncate">篩選：{{ summary() }}</span>
  @if (active()) {
    <span
      class="filter-toggle__dot size-2 shrink-0 rounded-full bg-accent-vivid"
      aria-hidden="true"
    ></span>
  }
</button>
