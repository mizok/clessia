<div class="confirm-dialog p-2">
  <p class="confirm-dialog__message mx-0 mt-0 mb-6 leading-[1.6] text-zinc-900">
    {{ data.message }}
  </p>

  @if (data.requireNotes) {
    <div class="confirm-dialog__notes mb-4">
      <textarea
        pTextarea
        [(ngModel)]="notes"
        [placeholder]="data.notesPlaceholder ?? '請填寫原因（必填）'"
        rows="3"
        class="w-full"
      ></textarea>
    </div>
  }

  <div class="confirm-dialog__actions flex justify-end gap-2">
    <p-button
      [label]="data.rejectLabel ?? '取消'"
      [outlined]="true"
      severity="secondary"
      (onClick)="reject()"
    />
    <p-button
      [label]="data.acceptLabel ?? '確認'"
      [severity]="data.acceptSeverity ?? 'danger'"
      [disabled]="!canAccept"
      (onClick)="accept()"
    />
  </div>
</div>
