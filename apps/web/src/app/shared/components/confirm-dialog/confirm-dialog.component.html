<div class="confirm-dialog">
  <p class="confirm-dialog__message">{{ data.message }}</p>
  <div class="confirm-dialog__actions">
    <p-button
      [label]="data.rejectLabel ?? '取消'"
      [outlined]="true"
      severity="secondary"
      (onClick)="reject()"
    />
    <p-button
      [label]="data.acceptLabel ?? '確認'"
      [severity]="data.acceptSeverity ?? 'danger'"
      (onClick)="accept()"
    />
  </div>
</div>
