<div class="form-dialog">
  <div class="dialog-header-inline">
    <div class="dialog-header-inline__content">
      <span class="dialog-header-inline__title">修改密碼</span>
    </div>
    <button type="button" class="dialog-header-inline__close" (click)="close()" aria-label="關閉">
      <i class="pi pi-times"></i>
    </button>
  </div>

  @if (success()) {
    <div class="change-password-dialog__section change-password-dialog__section--success">
      <i class="pi pi-check-circle change-password-dialog__success-icon"></i>
      <p class="change-password-dialog__success-text">密碼修改成功！</p>
    </div>
  } @else {
    <form class="change-password-dialog__section" (ngSubmit)="onSubmit()">
      @if (error()) {
        <p class="change-password-dialog__error-banner">
          <i class="pi pi-exclamation-circle"></i>
          {{ error() }}
        </p>
      }

      <div class="form-dialog__field">
        <label class="form-dialog__label" for="currentPassword">目前密碼</label>
        <input
          pInputText
          type="password"
          id="currentPassword"
          [(ngModel)]="currentPassword"
          name="currentPassword"
          placeholder="輸入目前密碼"
          [disabled]="submitting()"
          class="w-full"
        />
      </div>

      <div class="form-dialog__field">
        <label class="form-dialog__label" for="newPassword">新密碼</label>
        <input
          pInputText
          type="password"
          id="newPassword"
          [(ngModel)]="newPassword"
          name="newPassword"
          placeholder="至少 6 位元組"
          [disabled]="submitting()"
          class="w-full"
        />
      </div>

      <div class="form-dialog__field">
        <label class="form-dialog__label" for="confirmPassword">確認新密碼</label>
        <input
          pInputText
          type="password"
          id="confirmPassword"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="再次輸入新密碼"
          [disabled]="submitting()"
          class="w-full"
        />
      </div>

      <div class="form-dialog__footer">
        <p-button
          label="取消"
          severity="secondary"
          [outlined]="true"
          [disabled]="submitting()"
          (onClick)="close()"
        />
        <p-button
          type="submit"
          label="確認修改"
          severity="secondary"
          [loading]="submitting()"
          (onClick)="onSubmit()"
        />
      </div>
    </form>
  }
</div>
