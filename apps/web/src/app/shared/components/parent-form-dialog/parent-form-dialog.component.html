<div class="form-dialog">
  <div class="dialog-header-inline">
    <div class="dialog-header-inline__content">
      <span class="dialog-header-inline__title">
        {{ isEditMode() ? '編輯家長資料' : '新增家長' }}
      </span>
    </div>
    <button type="button" class="dialog-header-inline__close" (click)="cancel()" aria-label="關閉">
      <i class="pi pi-times"></i>
    </button>
  </div>

  <!-- 姓名 -->
  <div class="form-dialog__field">
    <label class="form-dialog__label"> 姓名<span class="form-dialog__required">*</span> </label>
    <input
      type="text"
      pInputText
      [ngModel]="formData().name"
      (ngModelChange)="updateForm('name', $event)"
      placeholder="請輸入家長姓名"
      [disabled]="loading()"
      class="w-full"
    />
  </div>

  <!-- Email + 手機 -->
  <div class="form-dialog__row">
    @if (!isEditMode()) {
      <p class="form-dialog__row-hint">Email 與手機號碼擇一必填</p>
    }
    <div class="form-dialog__field">
      <label class="form-dialog__label"> Email<span class="form-dialog__required">*</span> </label>
      <input
        type="email"
        pInputText
        [ngModel]="formData().email"
        (ngModelChange)="updateForm('email', $event)"
        placeholder="parent@example.com"
        [disabled]="loading()"
        class="w-full"
      />
    </div>
    <div class="form-dialog__field">
      <label class="form-dialog__label">
        手機號碼<span class="form-dialog__required">*</span>
      </label>
      <input
        type="tel"
        pInputText
        [ngModel]="formData().phone"
        (ngModelChange)="updateForm('phone', $event)"
        placeholder="0912-345-678"
        [disabled]="loading()"
        class="w-full"
      />
    </div>
  </div>

  <!-- 備註 -->
  <div class="form-dialog__field">
    <label class="form-dialog__label">備註</label>
    <textarea
      pTextarea
      [ngModel]="formData().notes"
      (ngModelChange)="updateForm('notes', $event)"
      placeholder="特殊需求、注意事項..."
      rows="3"
      [disabled]="loading()"
      class="w-full"
    ></textarea>
  </div>

  @if (errorMessage()) {
    <app-inline-notice
      severity="error"
      [detail]="errorMessage()"
      (dismissed)="errorMessage.set(null)"
    />
  }

  @if (!isEditMode()) {
    <app-inline-notice
      severity="info"
      detail="建立後會產生一次性登入連結（QR），請家長當場用手機掃描並綁定 LINE"
      [dismissible]="false"
    />
  }

  <!-- Footer -->
  <div class="form-dialog__footer">
    <p-button
      label="取消"
      [text]="true"
      severity="secondary"
      [disabled]="loading()"
      (onClick)="cancel()"
    />
    <p-button
      [label]="isEditMode() ? '儲存' : '建立家長'"
      [icon]="loading() ? 'pi pi-spinner pi-spin' : isEditMode() ? 'pi pi-check' : 'pi pi-plus'"
      [loading]="loading()"
      [disabled]="!isFormValid()"
      (onClick)="save()"
    />
  </div>
</div>
