  <h2>課表 · A6 第六輪</h2>
<h3>10/02 修正（第四次）：手機快速選取改成底部面板</h3>
<p>你說「手機版的快速選取按鈕要小一點，不要做成整個 col；看能不能改成跳 popup；也不需要那個完成按鈕」。只改手機，桌機完全不變。</p>
<ul>
  <li><strong>入口變小</strong>：「快速選取」不再整條撐滿，只有字那麼寬、40px 高，放在日期那一列下面靠右（日／週＋六天日期已經把那一列塞滿，放不進同一列）。白底近黑框，因為它是次要入口。勾了課之後按鈕上直接寫「快速選取 · 已勾 3」。</li>
  <li><strong>按下去從底部升起一塊面板</strong>，跟帳號選單同一種深一階的灰。最上面是「快速選取 · 週四 10/1」和關閉鈕；接著是「一次勾：這一整天／某位老師這週的課／某個班整期的課」；再下面是那一天的每一堂課，依開始時間分組，一列一堂（勾選框、班名、時間、老師）。整列都可以點來勾。已停課、已上完的勾不了，旁邊寫原因。</li>
  <li><strong>底部固定的動作區</strong>：「已勾 N 堂」＋「全部取消選取」，下面兩顆大按鈕「其他動作」（改時間、代課、指派老師、恢復、改到別天…就是原本「選動作」那一套）和橘色的「停課」。一堂都沒勾時按不下去。從「颱風」「老師請假」「整期改時間」的例子進來時，橘色那顆會變成那個例子的下一步（例如「批次代課」）。</li>
  <li><strong>沒有「完成」</strong>：關掉面板（右上關閉、按 Esc、點面板外面）就是離開選取。已勾的課留著，再打開還在。</li>
  <li><strong>關掉之後怎麼看得出勾了哪些</strong>：課表清單裡已勾的那幾列左邊有一個小小的近黑勾、底色淡灰（不是勾選框，點那一列照舊是打開那一堂的「⋯」）。</li>
  <li><strong>手機上拿掉的</strong>：清單裡原地出現的勾選框、固定在底部的批次動作列。<strong>其他入口改成打開面板</strong>：長按一堂、單堂「⋯」裡的「加入批次調整」，都會勾起那一堂並打開面板。</li>
  <li><strong>按了動作之後</strong>：步驟頁（動作 → 預覽 → 完成）照舊蓋在面板上面。中途按取消，回到面板；套用完按「完成」，面板一起收起來，回到課表看結果。</li>
</ul>

<p>你說「常用批次可以拿掉，批次選取課程改成快速選取，應該要可以批次取消選取，再加入稍微深一點的灰色塊，作為手機版從底下冒出來的 panel 的底色」。</p>

  <li><strong>「批次調整課堂」改名「快速選取」</strong>，選取方式不變。批次模式裡原本那一列叫「快速勾選」，跟「快速選取」只差一個字，所以改成「一次勾：這一整天／某位老師這週的課／某個班整期的課」。</li>

<h3>10/02 修正：手機版黑色減量</h3>
<p>你說「手機版除了 header 以外不宜有太大的黑色塊面，太過刺眼」。只改手機，桌機不變：①批次動作列從整片黑改成灰面，頂端一條 2px 近黑線、浮在內容上，主按鈕「停課」維持橘；②步驟頁底部按鈕列從黑改成白面加細線，只有主按鈕有顏色；③批次模式裡整條黑的「完成」改成白底近黑框（它是離開模式，不是主要動作）。各列裡的主要按鈕（黑底白字的「打電話」「收款」等）沒有改，等你決定。</p>

<h3>10/02 修正：常用批次改成 pill</h3>
<p>你說「常用批次的板塊太大了，可以做成 pill 式，不需要說明」。三張大卡改成一列 pill，只留名稱：「颱風整天停課」「老師請假找人代」「班級整期改時間」。點了行為不變：直接進入情境、課已勾好。正在走的那個 pill 用近黑框標示。這一列在桌機只占 36px（原本約 190px）；手機是可橫滑的一列。下面講到「情境卡」的段落，指的就是這一列 pill。</p>

<h3>A5：黑色減量</h3>
<p>你說手機版黑色塊面太多、桌機也略多。這一輪把「黑」的意思縮小：<strong>黑只用在全站導覽（頁首），以及暫時出現的操作</strong>（勾了課之後的批次動作列、步驟頁的底部按鈕列）。頁面自己的工具列和手機底部動作列改回白底，用一條近黑細線分區 —— 分區靠線，不靠整片黑。手機頁首只有字標那一列是黑，導覽那一列改成白底分頁。下面各段裡講到「黑工具列」「黑動作列」的地方，現在都是白底。</p>
<h3>這一輪：拿掉說明按鈕、改用字</h3>
<p>你說「這頁怎麼看」不該存在，「選取」也看不懂。所以按鈕、桌機浮層、手機底部抽屜整個拿掉；裡面每一項不是讓畫面自己說清楚，就是刪掉，沒有搬去別處藏。</p>
<ul>
  <li><strong>「一列一位老師、橫軸是時間」</strong>→ <strong>畫面自己說</strong>：甘特左欄頂端寫「老師」，軸上寫時刻。</li>
  <li><strong>「黑色直線＝現在」</strong>→ <strong>畫面本來就說了</strong>：線頭寫「現在 17:40」。</li>
  <li><strong>「灰色直帶＝最滿的時段」</strong>→ <strong>畫面本來就說了</strong>：帶上寫「最滿 15 班」。</li>
  <li><strong>「異動條右邊小直條＝每 15 分鐘同時幾班」</strong>→ <strong>圖刪掉，留字</strong>：「最滿 19:00–20:00 · 同時 15 班」。</li>
  <li><strong>手機「依開始時間分組」「週視圖點一天看那天」</strong>→ <strong>畫面本來就說了</strong>：組頭寫「17:00 開始 · 3 堂」，週視圖每一行右邊有箭頭。說明刪掉。</li>
  <li><strong>課塊樣式圖例</strong>（粗框＝上課中、灰底＝已上完、虛線＝停課）→ <strong>每種都有字</strong>：「上課中」「停課・颱風」原本就有；<strong>「已上完」這一輪新加</strong>（灰色小字，不搶眼）。框線與底色只是加強，不再需要被解釋。</li>
  <li><strong>代課／調課／補課／未指派／撞堂標籤的說明</strong>→ <strong>刪掉</strong>，標籤本身就是字。</li>
  <li><strong>「點一堂或 ⋯ 看能做什麼」</strong>→ <strong>刪掉</strong>：每塊右上的 ⋯ 一直看得到。</li>
  <li><strong>「要一次改好幾堂按『選取』…」</strong>→ <strong>按鈕自己說</strong>：「選取」改名「<strong>批次調整課堂</strong>」，進去之後變「<strong>完成</strong>」（只收起勾選，已勾的留著；動作列上的「清除」才放掉）。桌機滑過課塊就露出勾選框，不必先按按鈕；手機同一顆按鈕，長按一堂也能進。Shift 範圍勾的提示只在批次模式出現：「按住 Shift 再勾一堂，中間的會一起勾起來」。</li>
  <li><strong>其他「選取」字樣</strong>：快速選取 →「快速勾選：這一整天／某位老師這週的課／某個班整期的課」；週視圖「選整天」→「勾選這一整天」；動作列「N 堂已選 · 手動選取」→「已勾 N 堂 · 逐堂勾選」；單堂 ⋯「加入選取」→「加入批次調整」；步驟條「選取 → 動作 → 預覽 → 完成」→「勾選課堂 → 動作 → 預覽 → 完成」；結果頁「留在選取中」→「保留勾選」。</li>

  <p class="lede">在 A3 上改，不重來。首屏只回答兩件事：今天哪裡有異動（白色的「異動」條，每則可點）、要動手的地方在哪（黑色工具列＋點課塊）。一次改好幾堂的工具收進「批次調整課堂」。同時 15 班的晚上照樣以老師為列，不擠。</p>

  <h3>收了什麼、收到哪、怎麼叫出來</h3>
  <ul>
    <li><strong>色面四個數字（最滿幾班、異動幾堂、停課、老師數）→ 刪掉</strong>。異動數寫進色面那句話（「今天 18 堂課，2 堂有異動。」）；最滿時段只留在異動條右邊；停課數與老師數跟甘特重複（停課在異動條裡、老師就是列數）。</li>
    <li><strong>三個「快速勾選」控制項 → 收進「批次調整課堂」</strong>。按工具列的「批次調整課堂」，工具列下面多一列「快速勾選：這一整天／某位老師這週的課／某個班整期的課」；按「完成」收回。手機上一旦已經勾了課，這一列自動收起，不佔首屏。</li>
    <li><strong>勾選框 → 平常收起</strong>，放在課塊右下角（右上是 ⋯），出現或收起都不推動班名。桌機滑過課塊就露出來，可以直接勾；按「批次調整課堂」、手機長按一堂、或在單堂「⋯」勾「加入批次調整」也會叫出來。已勾的那堂永遠看得到自己的勾。</li>
    <li><strong>週視圖每欄的「勾選這一整天」→ 收進批次模式</strong>，按「批次調整課堂」後才出現在欄首。</li>
    <li><strong>「同時幾班」84px 密度列＋「今天的異動」一行 → 合成一條「異動」條</strong>：左邊是異動（可點，直接打開那堂），右邊只寫「最滿 19:00–20:00 · 同時 15 班」。甘特上用一條淺灰直帶標出最滿時段，帶上直接寫「最滿 15 班」。</li>
    <li><strong>沒有動到的</strong>：單堂「⋯」、批次動作列的六個動作、三個例子、週視圖每欄的摘要、甘特本身。</li>
  </ul>

  <h3>黑色塊面用在哪、為什麼</h3>
  <ul>
    <li><strong>黑＝你用來移動與動手的東西</strong>，跟頁首同一個面：① 日／週＋日期＋「批次調整課堂」的工具列（批次模式時多一列「快速勾選」）；② 勾了課才浮出來的批次動作列（A3 是白色浮卡）；③ 批次步驟頁（桌機右側抽屜、手機全螢幕）的底部按鈕列；④ 手機的底部動作列（＝同一條批次動作列，手機版只留「停課」＋「選動作」）。</li>
    <li><strong>白＝內容</strong>：異動條、甘特、課塊、清單、單堂「⋯」浮層、步驟頁的內容。課塊永遠不黑。</li>
    <li><strong>橘在黑上只有兩種意思</strong>：選中的日期底線（＝「你在哪」，跟頁首目前頁同一個語法），以及「下一步按這顆」（批次動作列裡從例子帶進來的那個動作、步驟頁的「預覽／套用／完成」）。其他黑面按鈕是白框白字；「選動作」與已按下的「完成」是白底。</li>
    <li>黑面上沒有紅綠琥珀：撞堂、未指派、預覽裡的「不會套用」都在白面上。黑面上的字全部用 --on-ink／-2／-3（7.0:1 以上）。</li>
  </ul>

  <h3>上課中改成怎麼表示</h3>
  <ul>
    <li>A3 的上課中是整塊塗黑。A4 黑變成「結構」之後，黑色課塊會被讀成工具列或選中，所以改成：<strong>白底、2px 近黑粗框＋一個「● 上課中」描邊標籤</strong>（一般課塊是 1px 淺灰框）。手機清單與週視圖同一個標籤（A3 是黑底膠囊）。</li>
    <li>跟「已勾」分得開：已勾＝外圈一道環＋灰底＋勾選框打勾；上課中＝框本身變粗＋字。兩者可以同時成立。現在線（黑色直線＋「現在 17:40」）照舊，會穿過上課中的那幾塊。</li>
  </ul>

  <h3>借了誰的什麼</h3>
  <ul>
    <li>航空公司與機場地勤的「機組排班甘特」（以人為列、時間為軸）：人不能分身，所以列內天然不重疊 —— 15 班同時還排得下的原因。</li>
    <li>Linear／Gmail 的多選語法：勾選、Shift 範圍勾、勾了之後底部出現動作列；Gmail 桌機滑過一列就露出勾選框；Figma／Linear 的深色工具列與淺色畫布分家（工具是一種面、內容是另一種面）。</li>
    <li>Terraform／資料庫 migration 的 plan → apply：先看「會改哪些、哪些不會改、為什麼」再套用，對上 API 的 dryRun。</li>
    <li>Google Calendar 手機版的底部抽屜：單堂操作在手機上從底部升起。</li>
  </ul>

  <h3>第一次看的人會怎麼讀</h3>
  <ul>
    <li><strong>橘色那句話</strong>：今天幾堂、幾堂有異動。</li>
    <li><strong>黑色工具列</strong>：換天、換日／週、要一次改好幾堂按「批次調整課堂」（桌機也可以直接滑過課塊勾）。</li>
    <li><strong>「異動」條</strong>：哪幾堂有異動（點一則直接打開那堂）＋幾點最滿。</li>
    <li><strong>甘特</strong>：左欄頂寫「老師」，一列一位；每塊課的狀態都是字（上課中、已上完、停課・颱風、代課・原 X、調課、補課、未指派老師、撞堂）。點整塊或「⋯」看這堂能做什麼。</li>
  </ul>

  <h3>15 班同時怎麼撐住</h3>
  <ul>
    <li>日視圖：列數＝當天上課的老師數（最多 16），跟同時幾班無關；每列 70px，一塊至少 90 分鐘寬，不截字。密度列拿掉之後甘特往上提了約 60px，1440×900 首屏看得到 7 位老師（A3 是 4 位）。</li>
    <li>週視圖：每天一欄、依開始時間分組 —— 同時 15 班就是 15 行，往下長。手機每天一行，點進那天。</li>
  </ul>

  <h3>操作對照（按鈕 → ACTIONS.md）</h3>
  <ul>
    <li>單堂「⋯」：查看異動紀錄、管理出勤狀況、調課、代課、指派老師、指定為補課／改指定補課、停課、取消停課 —— 出現條件照現在產品的右鍵選單。停課那堂的「加開一堂補課」＝<strong>新</strong>（需要 POST /sessions）。</li>
    <li>批次動作列：停課＝batch-cancel；恢復課堂＝batch-uncancel；改時段（同一天）＝batch-update-time；指派老師＝batch-assign-teacher（includeAssigned）。全部先 dryRun。改到別天＝<strong>新</strong>（batch-reschedule）；批次代課＝<strong>新</strong>（batch-substitute，會逐堂寫代課紀錄）。</li>
    <li>「某個班整期的課」需要 GET /sessions?classId=&amp;from=&amp;to=（設計稿沒驗證）。沒畫教室：schema 沒有 room。</li>
  </ul>

  <h3>三個例子（hash 直接進）</h3>
  <ul>
    <li><code>#typhoon</code>：10/2 整天已勾 → 停課 → 預覽（3 堂已停課，略過）→ 套用 → 補課怎麼辦＋整批復原。</li>
    <li><code>#teacher-leave</code>：本週今天起最多堂的老師 → 批次代課（新）→ 預覽（代課老師有一堂撞到）→ 套用 → 沒人接的那堂保留勾選。</li>
    <li><code>#retime</code>：週五一班整期 → 改時段（同一天）晚 90 分鐘 → 預覽（國慶補假、元旦略過）→ 套用。</li>
    <li>每一個都可加 <code>-action</code>／<code>-preview</code>／<code>-done</code>；<code>#op</code> 打開一堂的操作；<code>#week</code> 週視圖。</li>
  </ul>

  <h3>代價</h3>
  <ul>
    <li>勾選框平常收起：桌機滑過就露出來，手機要靠「批次調整課堂」按鈕或長按。週視圖桌機的清單列滑過<strong>不會</strong>露出勾選框（會擠動欄寬），要先按按鈕。</li>
    <li>「每 15 分鐘幾班」的細節沒了：只剩「最滿幾點到幾點、同時幾班」一句與甘特上的灰帶。</li>
    <li>上課中的粗框在淺灰框旁邊夠明顯，但不像 A3 黑塊那樣遠遠就看得到；遠看靠現在線定位。</li>
    <li>以老師為列看不到「哪間教室空著」—— schema 本來就沒有教室。</li>
    <li>批次動作列浮在設計稿膠囊上方（bottom 64px），真實產品沒有膠囊時可以貼底。</li>
  </ul>
