<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A6 排版 · 通知中心（家長端）</title>
<link rel="stylesheet" href="../shared/world.css">
<link rel="stylesheet" href="a6.css">
<style>
  /* 收件匣：跟管理端通知中心「收到的」同一種（未讀＝橘點＋粗體），但老師收件匣只有公告、沒有類型 */
  .nt { border-bottom: 1px solid var(--surface-border); }
  .nt > summary { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: var(--space-3); align-items: baseline; padding: var(--space-4) 0; list-style: none; cursor: pointer; }
  .nt > summary::-webkit-details-marker { display: none; }
  /* 10/02 計畫席裁定：未讀用橘點，不用紅（紅留給錯誤與逾期）。accent-500 對白約 5:1，過圖形元素 3:1 */
  .nt__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-500); align-self: center; }
  .nt.is-read .nt__dot { visibility: hidden; }
  .nt__t { font-size: var(--text-base); font-weight: var(--font-bold); color: var(--zinc-900); }
  .nt.is-read .nt__t { font-weight: var(--font-medium); color: var(--zinc-700); }
  .nt > summary:hover .nt__t { text-decoration: underline; text-underline-offset: 3px; }
  .nt__at { font-size: var(--text-sm); color: var(--zinc-600); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .nt__body { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); padding: 0 0 var(--space-4) calc(12px + var(--space-3)); }
  .nt__body p { margin-right: auto; max-width: 64ch; font-size: var(--text-md); color: var(--zinc-800); line-height: var(--leading-relaxed); }
  .nt__by { display: block; margin-top: var(--space-1); font-size: var(--text-sm); color: var(--zinc-600); }
  /* 課務異動那幾則：原本／改為 兩欄（新）。只有字，不靠顏色分 */
  .nt__chg { display: grid; grid-template-columns: 3em minmax(0, 1fr); gap: var(--space-1) var(--space-3); width: 100%; max-width: 64ch; margin: 0; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--zinc-100); font-size: var(--text-md); }
  .nt__chg dt { color: var(--zinc-600); }
  .nt__chg dd { margin: 0; font-weight: var(--font-medium); font-variant-numeric: tabular-nums; }
  .nt__chg .is-off { text-decoration: line-through; color: var(--zinc-600); }
  .keep { padding: var(--space-6) 0; font-size: var(--text-sm); color: var(--zinc-600); }
  @media (max-width: 860px) {
    .nt > summary { grid-template-columns: 12px minmax(0, 1fr); gap: 2px var(--space-3); }
    .nt__at { grid-column: 2; }
    .nt__body .btn { min-height: 44px; }
  }
</style>
</head>
<body data-direction="a6">
<div id="app"></div>

<template id="notes">
  <h2>通知中心 · 家長端（#990 批 5）</h2>
  <h3>規格 vs 現況</h3>
  <table>
    <thead><tr><th>項目</th><th>應然規格（specs/parent/notifications.md）</th><th>產品現況（sitemap/_shared/announcement-inbox.md）</th><th>設計稿怎麼畫</th></tr></thead>
    <tbody>
      <tr><td>內容</td><td>查看課務異動通知；類型圖示待 announcements 加 type 欄位（09-04 裁定 v1 不做）</td><td>共用公告收件匣（跟老師端同一支元件），只有公告</td><td>照做，跟老師端通知同一種收件匣；沒有類型圖示。依今天／昨天／這週／更早分章（時間軸，新的在上）</td></tr>
      <tr><td>孩子切換器</td><td>—</td><td>沒有（收件匣不帶 childId，公告發給全體家長）</td><td>照做：<b>不帶切換器、不 gate</b>，沒有孩子的家長照樣看得到公告</td></tr>
      <tr><td>已讀／未讀</td><td>未讀有藍點</td><td>紅點；展開一則就標成已讀</td><td>橘點（accent-500）＋粗體（10/02 裁定：紅留給錯誤與逾期）。展開即已讀，開場的未讀數跟著減</td></tr>
      <tr><td>展開</td><td>原地展開：異動類型與原因、原課堂、新課堂、相關課堂連結</td><td>一次只能展開一則；內文＋「—— 發布者」</td><td>原地展開（同名 details，一次一則）。<b>課務異動那幾則多一塊「原本／改為」</b>（標「新」：要 announcements 帶結構化的課堂資訊才做得到，現在只有內文），附「看課表」連家長端課表（新）</td></tr>
      <tr><td>全部標為已讀</td><td>有</td><td>只在有未讀時出現</td><td>照做；按了 toast 可復原</td></tr>
      <tr><td>保留</td><td>90 天</td><td>—</td><td>底部寫「通知保留 90 天」</td></tr>
      <tr><td>校區</td><td>—</td><td>有 campusName 時時間後面帶「· 校區」</td><td>保留</td></tr>
    </tbody>
  </table>
</template>

<script src="../shared/data.js"></script>
<script src="../shared/flow.js"></script>
<script src="../shared/proto.js"></script>
<script src="a6.js"></script>
<script>
(function () {
  const { C, icon, shell, md, esc } = A2;
  const T = C.TODAY;
  // 發給家長的公告（最壞情況：近 90 天 24 則）。chg：課務異動，展開時多一塊「原本／改為」（新）
  const SRC = [
    ['國三英文 A 班 今天代課通知', '原任課老師請假，今天 19:00 的課由江承睿老師代課，上課時間與教室不變。', { was: ['10/1（四）19:00', '原任老師'], now: ['10/1（四）19:00', '江承睿 老師代課'] }],
    ['國小五年級英文班 10/3 停課', '10/3（六）教室設備維護停課，補課時間確定後另行通知。', { was: ['10/3（六）15:00', 'A 教室'], now: ['停課', '補課時間另行通知'], off: true }],
    ['颱風停課：10/2（五）全日停課', '颱風警報已發布，10/2 全日停課。補課時間另行通知，請留意課表。', null],
    ['期中考成績 10/10 開放查詢', '各班期中考成績會在 10/10（六）開放查詢，請到「成績」查看。', null],
    ['國一數學 A 班 10/8 調課通知', '10/8（四）的課調整到 10/9（五）同一時段，教室改到 B 教室。', { was: ['10/8（四）15:30', 'A 教室'], now: ['10/9（五）15:30', 'B 教室'] }],
    ['十月學費帳單已開立', '十月學費帳單已開立，請在到期日前繳費。可以到「繳費」查看明細。', null],
    ['國慶連假 10/10–10/11 停課', '國慶連假兩天停課，課表已調整，補課排在 10/17（六）。', null],
    ['冬季班續課說明', '冬季班將自動續課，若要調整班級或停課，請在 11/12 前到「續課資訊」申請異動。', null],
  ];
  const BY = ['林主任', '陳櫃台', '張教務'];
  let seq = 0;
  const N = Array.from({ length: 24 }, (_, i) => {
    const s = SRC[i % SRC.length];
    const day = C.addDays(T, -Math.floor(i * i / 8));
    const at = `${String(day === T ? 9 + (i % 8) : 19 - (i % 9)).padStart(2, '0')}:${['05', '20', '35', '50'][i % 4]}`;
    return { id: 'a' + ++seq, title: s[0], body: s[1], chg: s[2], day, at, by: BY[i % 3], campus: i % 3 ? C.campuses[0] : '', read: i > 3 };
  });
  const label = (d) => (d === T ? '今天' : d === C.addDays(T, -1) ? '昨天' : d > C.addDays(T, -7) ? '這週' : '更早');
  const unread = () => N.filter((n) => !n.read).length;
  const chgBlock = (c) => `<dl class="nt__chg"><dt>原本</dt><dd${c.off ? ' class="is-off"' : ''}>${c.was.join(' · ')}</dd><dt>改為</dt><dd>${c.now.join(' · ')}<span class="new">新</span></dd></dl>`;

  shell({
    role: 'parent',
    page: 'p-notifications',
    title: '',
    bar: `<p class="tbar__txt"><strong id="ucount"></strong></p><div class="tbar__act"><button class="btn" type="button" data-allread>${icon.check}全部標為已讀</button></div>`,
    phase: 5300,
  }, `<div id="body"></div>`);

  const head = () => {
    const u = unread();
    document.querySelector('.open__title').innerHTML = u ? `${u} 則未讀，<br>今天 ${N.filter((n) => n.day === T).length} 則新通知。` : '通知都看過了。';
    document.getElementById('ucount').textContent = u ? `${u} 則未讀` : '沒有未讀';
    // 產品規則：沒有未讀就不放這顆按鈕
    document.querySelector('[data-allread]').hidden = !u;
  };
  const render = () => {
    const groups = ['今天', '昨天', '這週', '更早'].map((g) => [g, N.filter((n) => label(n.day) === g)]).filter(([, a]) => a.length);
    document.getElementById('body').innerHTML = groups.map(([g, a]) => `<section class="chap" aria-label="${g}">
      <div class="chap__side"><div class="chap__big">${g}</div><p class="chap__tally">${a.length} 則${a.some((n) => !n.read) ? ` <span>· 未讀 ${a.filter((n) => !n.read).length}</span>` : ''}</p></div>
      <div>${a.map((n) => `<details class="nt${n.read ? ' is-read' : ''}" name="inbox" data-n="${n.id}">
        <summary><span class="nt__dot" aria-hidden="true"></span><span class="nt__t">${esc(n.title)}${n.read ? '' : '<span class="sr">（未讀）</span>'}</span><span class="nt__at">${md(n.day)} ${n.at}${n.campus ? ` · ${n.campus}` : ''}</span></summary>
        <div class="nt__body">${n.chg ? chgBlock(n.chg) : ''}<p>${esc(n.body)}<span class="nt__by">—— ${n.by}</span></p>${n.chg ? `<a class="btn btn--sm" href="p-schedule.html">看課表<span class="new">新</span>${icon.right}</a>` : ''}</div>
      </details>`).join('')}</div>
    </section>`).join('') + `<p class="keep">通知保留 90 天。</p>`;
    head();
  };
  render();

  // 展開一則＝已讀（產品行為）
  document.addEventListener('toggle', (e) => {
    const d = e.target;
    if (!d.matches || !d.matches('details.nt') || !d.open) return;
    const n = N.find((x) => x.id === d.dataset.n);
    if (n.read) return;
    n.read = true;
    d.classList.add('is-read');
    const sr = d.querySelector('.sr'); if (sr) sr.remove();
    head();
  }, true);
  document.addEventListener('click', (e) => {
    if (!e.target.closest('[data-allread]')) return;
    const was = N.filter((n) => !n.read);
    was.forEach((n) => (n.read = true));
    render();
    A2.toast(`已把 ${was.length} 則標為已讀`, { undo: () => { was.forEach((n) => (n.read = false)); render(); } });
  });
})();
</script>
</body>
</html>
