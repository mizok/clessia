<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A6 排版 · 綁定 LINE（公開頁）</title>
<link rel="stylesheet" href="../shared/world.css">
<link rel="stylesheet" href="a6.css">
<style>
  /* 照產品 link-line.component.scss ＋ shared/_auth-form.scss（auth-content）搬 */
  @media (min-width: 1025px) {
    html, body, #app, .ps { height: 100%; }
    .ps__main { min-height: 100%; }
    .ps__route { justify-content: center; }
  }
  .auth-content { width: 100%; max-width: 480px; padding: var(--space-4) 0; }
  .auth-content__header { margin-bottom: var(--space-6); }
  /* 產品的 .auth-content__badge 沒有任何樣式規則（全庫 grep 不到），所以「最後一步」渲染成一般內文。
     設計稿補成跟選擇身分的眉標同一種小標（產品 bug 列給計畫席） */
  .auth-content__badge { display: inline-block; margin-bottom: var(--space-3); padding: var(--space-1) var(--space-3); font-size: var(--text-xs); font-weight: var(--font-semibold); letter-spacing: 0.08em; color: var(--accent-600); background: var(--accent-50); border-radius: var(--radius-full); }
  .auth-content__title { margin-bottom: var(--space-2); font-size: var(--text-2xl); font-weight: var(--font-bold); line-height: var(--leading-tight); color: var(--zinc-900); }
  .link-line { --line-brand: #06c755; --line-brand-hover: #05b34c; }
  /* 產品這段 text-align: center，但標頭靠左 —— 同一欄兩種對齊。設計稿跟標頭一起靠左；字色 zinc-500 → 600（設計稿的 500 較淺） */
  .link-line__lead { margin-top: var(--space-2); font-size: var(--text-sm); line-height: var(--leading-relaxed); color: var(--zinc-600); }
  .link-line__btn { display: flex; align-items: center; justify-content: center; gap: var(--space-2); width: 100%; height: 44px; margin-top: var(--space-4); font: inherit; font-size: var(--text-md); font-weight: var(--font-semibold);
    color: #fff; background: var(--line-brand); border: none; border-radius: var(--radius-md); cursor: pointer; transition: background 0.15s; }
  .link-line__btn:hover:not([aria-busy='true']) { background: var(--line-brand-hover); }
  .link-line__btn[aria-busy='true'] { cursor: progress; }
  .link-line__skip { width: 100%; min-height: 44px; margin-top: var(--space-3); padding: var(--space-2); font: inherit; font-size: var(--text-sm); color: var(--zinc-600); background: none; border: none; cursor: pointer; }
  .link-line__skip:hover:not(:disabled) { color: var(--zinc-800); }
  .link-line__skip:disabled { cursor: not-allowed; }
  .spin { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .notice { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-top: var(--space-4); padding: var(--space-3); border: 1px solid #fecaca; border-radius: var(--radius-lg);
    background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%); color: #991b1b; font-size: var(--text-sm); }
  .notice__close { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; width: 28px; height: 28px; border: 0; border-radius: var(--radius-sm); background: none; color: currentColor; cursor: pointer; }
  @media (pointer: coarse) { .notice__close { width: 44px; height: 44px; } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2s; } }
</style>
</head>
<body data-direction="a6">
<div id="app"></div>

<template id="notes">
  <h2>綁定 LINE · 公開頁（#990 批 6）</h2>
  <h3>規格 vs 現況</h3>
  <table>
    <thead><tr><th>項目</th><th>應然規格</th><th>產品現況（sitemap/public/link-line.md）</th><th>設計稿怎麼畫</th></tr></thead>
    <tbody>
      <tr><td>入口</td><td>一次性連結兌換完的落地頁</td><td>同；不在公開頁外框的四條連結裡</td><td>照搬</td></tr>
      <tr><td>綁定 LINE 帳號</td><td>—</td><td>整頁離開去 LINE 授權；送出中兩顆鍵都停用、主鍵變「前往 LINE...」</td><td>送出中照做（不降透明度），接著 toast「已綁定 LINE」→ 導到選擇身分</td></tr>
      <tr><td>稍後再說</td><td>—</td><td>導到 /select-role；「沒綁定」是合法而且可以永久的狀態（例：供應商破窗進來處理問題）</td><td>照搬，導到選擇身分。<b>不要把它當成「還沒做完的跳過鍵」拿掉</b></td></tr>
      <tr><td>錯誤提示</td><td>—</td><td>可關閉的紅色提示：「無法連線到 LINE，請稍後再試」</td><td>照搬，用 <code>#error</code> 看</td></tr>
      <tr><td>眉標「最後一步」</td><td>—</td><td>class 存在但沒有樣式（看起來是一般內文）</td><td>補成眉標樣式（產品 bug，列給計畫席）</td></tr>
      <tr><td>說明文字對齊</td><td>—</td><td>置中，但標頭靠左</td><td>跟標頭一起靠左</td></tr>
    </tbody>
  </table>
</template>

<script src="../shared/data.js"></script>
<script src="../shared/flow.js"></script>
<script src="../shared/proto.js"></script>
<script src="a6.js"></script>
<script>
(function () {
  const { pub, icon, toast } = A2;
  const err = location.hash === '#error';
  pub({ page: 'pub-link-line' }, `
    <div class="link-line auth-content">
      <header class="auth-content__header">
        <p class="auth-content__badge">最後一步</p>
        <h1 class="auth-content__title">綁定 LINE</h1>
      </header>
      <p class="link-line__lead">綁定之後，以後用 LINE 就能直接登入，不必再向補習班索取連結。</p>
      <div id="err">${err ? `<div class="notice" role="alert"><p>無法連線到 LINE，請稍後再試</p><button type="button" class="notice__close" aria-label="關閉訊息" data-close>${icon.x}</button></div>` : ''}</div>
      <button type="button" class="link-line__btn" id="bind">綁定 LINE 帳號</button>
      <button type="button" class="link-line__skip" id="skip">稍後再說</button>
    </div>`);

  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-close]')) { document.getElementById('err').innerHTML = ''; return; }
    if (e.target.closest('#skip')) { location.href = 'pub-select-role.html'; return; }
    const b = e.target.closest('#bind');
    if (!b || b.getAttribute('aria-busy') === 'true') return;
    b.setAttribute('aria-busy', 'true');
    b.innerHTML = '<span class="spin" aria-hidden="true"></span>前往 LINE...';
    document.getElementById('skip').disabled = true;
    // 示範：LINE 授權完成回來
    setTimeout(() => { toast('已綁定 LINE，下次用 LINE 就能直接登入'); setTimeout(() => { location.href = 'pub-select-role.html'; }, 900); }, 700);
  });
})();
</script>
</body>
</html>
