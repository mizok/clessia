<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A6 排版 · 成績總覽 · 班級視角</title>
<link rel="stylesheet" href="../shared/world.css">
<link rel="stylesheet" href="a6.css">
<style>
  .crow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--space-3); border-bottom: 1px solid var(--surface-border); }
  .crow__main { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.5fr) 88px; align-items: center; gap: var(--space-2) var(--space-6); padding: var(--space-4) 0; border: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; min-width: 0; }
  .crow__main:hover .crow__name { text-decoration: underline; text-underline-offset: 4px; }
  .crow__main:focus-visible { outline: 2px solid var(--zinc-900); outline-offset: 2px; border-radius: var(--radius-sm); }
  .crow__name { display: block; font-size: var(--text-lg); font-weight: var(--font-semibold); }
  .crow__meta, .crow__last { font-size: var(--text-sm); color: var(--zinc-600); }
  .crow__last b { color: var(--zinc-900); font-weight: var(--font-semibold); }
  .crow__n { text-align: right; font-size: var(--text-xl); font-weight: var(--font-bold); font-variant-numeric: tabular-nums; }
  .crow__n small { display: block; font-size: var(--text-xs); font-weight: var(--font-medium); color: var(--zinc-600); }
  .badge { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 var(--space-3); border: 1px solid var(--zinc-900); border-radius: var(--radius-full); font-size: var(--text-sm); font-weight: var(--font-semibold); text-decoration: none; white-space: nowrap; }
  .badge:hover { background: var(--zinc-100); }
  .ff { display: grid; gap: var(--space-3); width: 260px; max-width: 100%; }
  .ff label { display: grid; gap: var(--space-1); font-size: var(--text-md); font-weight: var(--font-semibold); color: var(--zinc-700); }
  .ff .dd { width: 100%; height: 40px; }
  .ff__foot .btn { margin-left: auto; }
  .ff__foot { display: flex; justify-content: space-between; align-items: center; }
  .chip[aria-pressed='true'] { background: var(--zinc-900); border-color: var(--zinc-900); color: #fff; }
  /* 班級考試統計 */
  .gdlg { width: min(760px, calc(100% - 32px)); overflow: auto; }
  .gdlg__bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); padding: 0 var(--space-6) var(--space-3); }
  .gdlg__bar .dd { height: 36px; min-width: 220px; max-width: 100%; }
  .seg { display: inline-flex; border: 1px solid var(--zinc-300); border-radius: var(--radius-md); overflow: hidden; }
  .seg button { height: 34px; padding: 0 var(--space-3); border: 0; background: #fff; font: inherit; font-size: var(--text-md); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--zinc-300); }
  .seg button[aria-pressed='true'] { background: var(--zinc-900); color: #fff; font-weight: var(--font-semibold); }
  .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--space-3); margin: 0 var(--space-6) var(--space-4); padding: var(--space-4); border-radius: var(--radius-lg); background: var(--gray); }
  .stats dt { font-size: var(--text-sm); color: var(--zinc-700); }
  .stats dd { margin: 2px 0 0; font-size: var(--text-2xl); font-weight: var(--font-bold); font-variant-numeric: tabular-nums; }
  .dist { margin: 0 var(--space-6) var(--space-4); }
  .dist__h { font-size: var(--text-md); font-weight: var(--font-bold); color: var(--zinc-800); margin-bottom: var(--space-2); }
  .dist__r { display: grid; grid-template-columns: 112px minmax(0, 1fr) 56px; align-items: center; gap: var(--space-3); padding: 3px 0; font-size: var(--text-sm); font-variant-numeric: tabular-nums; }
  .dist__bar { height: 10px; border-radius: 5px; background: var(--zinc-900); min-width: 2px; }
  .dist__r--fail .dist__bar { background: var(--error-700); }
  .dist__r--fail span:first-child { color: var(--error-700); font-weight: var(--font-semibold); }
  .gdlg__list { padding: 0 var(--space-6) var(--space-4); }
  .rec { display: grid; grid-template-columns: minmax(0, 1fr) 72px 120px; align-items: center; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: 1px solid var(--surface-border); }
  .rec__name { font-weight: var(--font-semibold); text-decoration: none; }
  .rec__name:hover { text-decoration: underline; text-underline-offset: 3px; }
  .rec__v { text-align: right; font-size: var(--text-lg); font-weight: var(--font-bold); font-variant-numeric: tabular-nums; }
  .rec .tag { justify-self: end; }
  .gdlg__foot { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--space-2); padding: var(--space-3) var(--space-6) var(--space-6); background: inherit; }
  @media (max-width: 860px) {
    .crow__main { grid-template-columns: minmax(0, 1fr) 64px; }
    .crow__last { grid-column: 1 / -1; grid-row: 2; }
    .crow { grid-template-columns: minmax(0, 1fr); gap: 0; padding-bottom: var(--space-3); }
    .crow .badge { justify-self: start; }
    .gdlg { width: 100%; }
    .gdlg__bar, .gdlg__list { padding-left: var(--space-4); padding-right: var(--space-4); }
    .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-left: var(--space-4); margin-right: var(--space-4); }
    .dist { margin-left: var(--space-4); margin-right: var(--space-4); }
    .gdlg__foot { padding: var(--space-3) var(--space-4) calc(var(--space-4) + env(safe-area-inset-bottom, 0px)); }
  }
</style>
</head>
<body data-direction="a6">
<div id="app"></div>

<template id="notes">
  <h2>成績總覽 · 班級視角 · A6（#990 批 2）</h2>
  <h3>規格 vs 現況</h3>
  <table>
    <thead><tr><th>項目</th><th>應然規格（grades.md）</th><th>產品現況（sitemap grades-overview-class）</th><th>設計稿怎麼畫</th></tr></thead>
    <tbody>
      <tr><td>依考試分組</td><td>成績列表可「依考試」分組</td><td>班級清單依課程分組，點一班開「班級考試統計」，對話框裡選一場考試</td><td>沿用產品的形狀（課程 → 班級 → 考試），這就是規格的「依考試」</td></tr>
      <tr><td>班級列</td><td>—</td><td>班名、年級範圍、上限 N 人；有待登錄時多一個徽章（按下未驗）</td><td>多寫最近一次考試的平均與不及格人數；「待登錄 N」直接連到成績登錄頁</td></tr>
      <tr><td>待登錄籌碼（頁首）</td><td>—</td><td>有，按下效果未驗</td><td>按下只看有待登錄的班，再按一次取消</td></tr>
      <tr><td>統計</td><td>及格／不及格用顏色區分</td><td>平均、最高、最低（唯讀）</td><td>平均、最高、最低，加上不及格與缺考人數；分數分布每一段都寫人數，不及格那一段紅字＋文字</td></tr>
      <tr><td>名單篩選</td><td>狀態：正常／缺考／補考</td><td>全部／已登錄／缺考／補考</td><td>保留，另加「待登錄」（只在那場還有人沒登錄時出現）</td></tr>
      <tr><td>結束動作</td><td>—</td><td>只有「關閉」</td><td>加「登錄這場成績」（到成績登錄頁）與「班級詳情」</td></tr>
    </tbody>
  </table>
</template>

<script src="../shared/data.js"></script>
<script src="../shared/flow.js"></script>
<script src="../shared/proto.js"></script>
<script src="a6.js"></script>
<script>
// 成績資料（grades.html／grades-student.html／grades-class.html 三頁同一份產生器，改一份要三份一起改）
// ponytail: 三頁各貼一份，避免為了 demo 多一支共用檔；要改就 grep「gradesData」
function gradesData(C) {
  let seed = 990;
  const r = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
  const exams = C.exams.map((e) => ({ id: e.id, classId: e.classId, name: e.name, date: e.date, type: 'academy', pass: e.classId === 'c14' ? 70 : 60, rows: {} }));
  exams.forEach((e, k) => Object.entries(C.exams[k].scores).forEach(([sid, v]) => {
    const x = r();
    e.rows[sid] = x < 0.04 ? { st: 'absent' } : x < 0.07 ? { st: 'makeup', v } : { st: 'ok', v };
  }));
  ['c4', 'c9', 'c12'].forEach((cid, k) => {
    const e = { id: `${cid}-e4`, classId: cid, name: '第四次小考', date: C.addDays(C.TODAY, -1 - (k % 2)), type: 'academy', pass: 60, rows: {} };
    C.classById[cid].studentIds.forEach((sid, i) => (e.rows[sid] = i % 3 === 0 ? { st: 'pending' } : { st: 'ok', v: Math.round(58 + r() * 40) }));
    exams.push(e);
  });
  const school = C.students.filter((s) => s.grade.startsWith('J')).flatMap((s) => ['數學', '英文', '國文'].map((sub) => ({ sid: s.id, sub, name: `第一次段考 · ${sub}`, date: C.addDays(C.TODAY, -14), v: Math.round(42 + r() * 58), pass: 60 })));
  const stat = (e) => {
    const rows = Object.values(e.rows), vs = rows.filter((x) => 'v' in x).map((x) => x.v);
    return { n: rows.length, done: vs.length, absent: rows.filter((x) => x.st === 'absent').length, pending: rows.filter((x) => x.st === 'pending').length,
      avg: vs.length ? Math.round(vs.reduce((a, b) => a + b, 0) / vs.length) : 0, max: Math.max(...vs), min: Math.min(...vs), fail: vs.filter((v) => v < e.pass).length };
  };
  return { exams, school, stat };
}

(function () {
  const { C, icon, shell, md, esc } = A2;
  const { exams, stat } = gradesData(C);
  const label = { P5: '小五', P6: '小六', J1: '國一', J2: '國二', J3: '國三' };
  const courseOf = (c) => `${c.grades[0].startsWith('P') ? '國小' : '國中'}${c.subject}`;
  const examsOf = (cid) => exams.filter((e) => e.classId === cid).sort((a, b) => b.date.localeCompare(a.date));
  const pendOf = (cid) => examsOf(cid).reduce((t, e) => t + stat(e).pending, 0);
  const campusOf = (c) => C.campuses[Number(c.id.slice(1)) % 3 === 0 ? 1 : 0]; // ponytail: 示範資料沒有班級分校，每三班一班放景美
  const pendTotal = C.classes.filter((c) => pendOf(c.id)).length;
  const st = { q: '', campus: '', grade: '', sub: '', pend: false };
  const opt = (pairs, v) => pairs.map(([k, l]) => `<option value="${esc(k)}"${k === v ? ' selected' : ''}>${esc(l)}</option>`).join('');

  shell({
    page: 'grades',
    back: `<a class="open__back" href="grades.html">${icon.left}成績總覽</a>`,
    title: `${C.classes.length} 個班，<br>${pendTotal} 個班還有成績沒登錄。`,
    bar: `<label class="tsearch">${icon.search}<input type="search" placeholder="找課程或班級" aria-label="搜尋課程或班級"></label>
      <div class="tbar__act">${pendTotal ? `<button class="btn chip" type="button" data-pend aria-pressed="false">待登錄 ${pendTotal}</button>` : ''}
        <button class="btn" type="button" popovertarget="filt">${icon.filter}<span id="fmeta">篩選</span></button>
        <div class="pop" id="filt" popover><div class="ff">
          <label>分校<select class="acset__in" data-f="campus">${opt([['', '全部分校'], ...C.campuses.map((c) => [c, c])], '')}</select></label>
          <label>年級<select class="acset__in" data-f="grade">${opt([['', '全部年級'], ...Object.entries(label)], '')}</select></label>
          <label>科目<select class="acset__in" data-f="sub">${opt([['', '全部科目'], ...[...new Set(C.classes.map((c) => c.subject))].map((s) => [s, s])], '')}</select></label>
          <div class="ff__foot"><button class="tlink" type="button" data-clear>清除篩選</button><button class="btn btn--sm" type="button" popovertarget="filt" popovertargetaction="hide">完成</button></div>
        </div></div></div>`,
    phase: 3500,
  }, `<p class="count" id="count" hidden></p><div id="list"></div>`);

  function render() {
    const q = st.q.trim();
    const hit = C.classes.filter((c) => (!q || c.name.includes(q) || courseOf(c).includes(q)) && (!st.campus || campusOf(c) === st.campus)
      && (!st.grade || c.grades.includes(st.grade)) && (!st.sub || c.subject === st.sub) && (!st.pend || pendOf(c.id)));
    const courses = [...new Set(hit.map(courseOf))];
    const narrowed = q || st.campus || st.grade || st.sub || st.pend;
    const cEl = document.getElementById('count');
    cEl.hidden = !narrowed;
    cEl.innerHTML = `<span>顯示 <strong>${hit.length}</strong> 個班（共 ${C.classes.length}）${st.pend ? ' · 只看有待登錄的' : ''}</span><button type="button" data-clear>清除篩選</button>`;
    document.getElementById('list').innerHTML = courses.length ? courses.map((k) => { const a = hit.filter((c) => courseOf(c) === k); return `<section class="chap" aria-label="${k}">
      <div class="chap__side"><div class="chap__big" style="font-size:32px">${k}</div><p class="chap__tally">${a.length} 個班</p></div>
      <div>${a.map((c) => {
        const e = examsOf(c.id).find((x) => stat(x).done), s = e && stat(e), p = pendOf(c.id);
        return `<div class="crow"><button class="crow__main" type="button" data-cid="${c.id}" aria-haspopup="dialog">
          <span><span class="crow__name">${c.name}</span><span class="crow__meta">${c.grades.map((g) => label[g]).join('、')} · ${c.studentIds.length} 人在班 · 上限 ${c.capacity} 人 · ${campusOf(c)}</span></span>
          <span class="crow__last">${e ? `最近：<b>${e.name}</b>（${md(e.date)}） · 不及格 ${s.fail} 人${s.absent ? ` · 缺考 ${s.absent}` : ''}` : '還沒有考試'}</span>
          <span class="crow__n">${e ? s.avg : '—'}<small>平均</small></span></button>
          ${p ? `<a class="badge" href="scores.html">${icon.edit}待登錄 ${p}</a>` : ''}</div>`;
      }).join('')}</div></section>`; }).join('') : `<p class="empty">沒有符合的班級。試試其他關鍵字，或按「清除篩選」。</p>`;
    const parts = [st.campus, st.grade && label[st.grade], st.sub].filter(Boolean);
    document.getElementById('fmeta').textContent = `篩選：${parts.length ? parts.join(' · ') : '全部'}`;
    // 只有真的有篩選時才出現「清除篩選」
    document.querySelector('.ff__foot [data-clear]').hidden = !narrowed;
    const chip = document.querySelector('[data-pend]'); if (chip) chip.setAttribute('aria-pressed', st.pend);
  }

  // ── 班級考試統計（對話框，唯讀）──
  const dlg = document.createElement('dialog');
  dlg.className = 'acset gdlg';
  dlg.setAttribute('aria-labelledby', 'gd-t');
  document.body.append(dlg);
  const df = { cid: '', scope: 'all', eid: '', show: 'all' };
  function detail() {
    const c = C.classById[df.cid];
    const list = examsOf(c.id).filter((e) => df.scope === 'all' || stat(e).pending);
    if (!list.find((e) => e.id === df.eid)) df.eid = list[0] ? list[0].id : '';
    const e = list.find((x) => x.id === df.eid), s = e && stat(e);
    const rows = e ? Object.entries(e.rows).map(([sid, x]) => ({ s: C.studentById[sid], ...x })) : [];
    const shown = rows.filter((x) => df.show === 'all' || (df.show === 'done' ? 'v' in x : x.st === df.show)).sort((a, b) => ('v' in b ? b.v : -1) - ('v' in a ? a.v : -1));
    const B = [['90–100', 90, 101], ['80–89', 80, 90], ['70–79', 70, 80], ['60–69', 60, 70], ['60 以下', 0, 60]];
    const vs = rows.filter((x) => 'v' in x).map((x) => x.v), mx = Math.max(1, ...B.map(([, lo, hi]) => vs.filter((v) => v >= lo && v < hi).length));
    dlg.innerHTML = `<div class="acset__head"><div><h2 class="acset__t" id="gd-t">${c.name}</h2><p class="fdlg__sub">${c.grades.map((g) => label[g]).join('、')} · 上限 ${c.capacity} 人 · ${c.teacher} 老師</p></div><button class="acset__x" type="button" aria-label="關閉" data-x>${icon.x}</button></div>
      <div class="gdlg__bar">
        <div class="seg" role="group" aria-label="考試範圍"><button type="button" data-scope="pending" aria-pressed="${df.scope === 'pending'}">待登錄 ${examsOf(c.id).filter((x) => stat(x).pending).length}</button><button type="button" data-scope="all" aria-pressed="${df.scope === 'all'}">全部 ${examsOf(c.id).length}</button></div>
        ${list.length ? `<select class="acset__in" aria-label="選一場考試" data-df="eid">${opt(list.map((x) => [x.id, `${x.name}（${md(x.date)}）`]), df.eid)}</select>` : ''}
      </div>
      ${e ? `<dl class="stats">
          <div><dt>平均</dt><dd>${s.avg}</dd></div><div><dt>最高</dt><dd>${s.max}</dd></div><div><dt>最低</dt><dd>${s.min}</dd></div>
          <div><dt>不及格（${e.pass} 分以下）</dt><dd>${s.fail} 人</dd></div><div><dt>${s.pending ? '還沒登錄' : '缺考'}</dt><dd>${s.pending || s.absent} 人</dd></div></dl>
        <div class="dist"><p class="dist__h">分數分布 · 已登錄 ${s.done}／${s.n} 人</p>${B.map(([l, lo, hi]) => { const n = vs.filter((v) => v >= lo && v < hi).length; return `<div class="dist__r${lo < e.pass && hi <= e.pass ? ' dist__r--fail' : ''}"><span>${l}${lo < e.pass && hi <= e.pass ? ' 不及格' : ''}</span><span class="dist__bar" style="width:${(n / mx) * 100}%"></span><span>${n} 人</span></div>`; }).join('')}</div>
        <div class="gdlg__bar"><div class="seg" role="group" aria-label="名單">${[['all', '全部', rows.length], ['done', '已登錄', s.done], ['absent', '缺考', s.absent], ['makeup', '補考', rows.filter((x) => x.st === 'makeup').length], ...(s.pending ? [['pending', '待登錄', s.pending]] : [])].map(([k, l, n]) => `<button type="button" data-show="${k}" aria-pressed="${df.show === k}">${l} ${n}</button>`).join('')}</div></div>
        <div class="gdlg__list">${shown.length ? shown.map((x) => `<div class="rec"><a class="rec__name" href="student.html">${x.s.name}</a><span class="rec__v">${'v' in x ? x.v : '—'}</span>
          ${x.st === 'absent' ? `<span class="tag tag--quiet">${icon.x}缺考</span>` : x.st === 'pending' ? '<span class="tag tag--warn">還沒登錄</span>' : x.v < e.pass ? `<span class="tag tag--error">${icon.alert}不及格</span>` : x.st === 'makeup' ? '<span class="tag tag--quiet">補考</span>' : '<span class="tag tag--ok">及格</span>'}</div>`).join('') : '<p class="empty">這一類沒有人。</p>'}</div>`
      : `<p class="empty" style="padding:var(--space-4) var(--space-6)">${df.scope === 'pending' ? '這個班的成績都登錄完了。' : '這個班還沒有考試。'}</p>`}
      <div class="gdlg__foot"><a class="btn" href="class.html">班級詳情</a>${e ? `<a class="btn btn--cta" href="scores.html">${s.pending ? `登錄這場成績（還差 ${s.pending} 人）` : '看這場的成績登錄'}</a>` : ''}<button class="btn" type="button" data-x>關閉</button></div>`;
  }
  dlg.addEventListener('click', (e) => {
    if (e.target === dlg || e.target.closest('[data-x]')) dlg.close();
    const sc = e.target.closest('[data-scope]'); if (sc) { df.scope = sc.dataset.scope; df.show = 'all'; detail(); }
    const sh = e.target.closest('[data-show]'); if (sh) { df.show = sh.dataset.show; detail(); }
  });
  dlg.addEventListener('change', (e) => { if (e.target.dataset.df === 'eid') { df.eid = e.target.value; df.show = 'all'; detail(); } });

  document.addEventListener('click', (e) => {
    const r = e.target.closest('[data-cid]');
    if (r) { Object.assign(df, { cid: r.dataset.cid, scope: st.pend ? 'pending' : 'all', eid: '', show: 'all' }); detail(); dlg.showModal(); }
    if (e.target.closest('[data-pend]')) { st.pend = !st.pend; render(); }
    if (e.target.closest('[data-clear]')) { Object.assign(st, { q: '', campus: '', grade: '', sub: '', pend: false }); document.querySelector('.tsearch input').value = ''; document.querySelectorAll('[data-f]').forEach((s) => (s.value = '')); render(); }
  });
  document.addEventListener('change', (e) => { const k = e.target.dataset.f; if (k) { st[k] = e.target.value; render(); } });
  document.querySelector('.tsearch input').addEventListener('input', (e) => { st.q = e.target.value; render(); });
  render();
})();
</script>
</body>
</html>
