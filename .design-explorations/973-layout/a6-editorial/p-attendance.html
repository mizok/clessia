<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A6 排版 · 到班紀錄（家長端）</title>
<link rel="stylesheet" href="../shared/world.css">
<link rel="stylesheet" href="a6.css">
<style>
  .seg { display: inline-flex; border: 1px solid var(--zinc-300); border-radius: var(--radius-md); overflow: hidden; background: #fff; }
  .seg button { height: 38px; padding: 0 var(--space-4); border: 0; background: #fff; font: inherit; font-size: var(--text-md); color: var(--zinc-900); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--zinc-300); }
  .seg button[aria-pressed='true'] { background: var(--zinc-900); color: #fff; font-weight: var(--font-semibold); }
  .ym { height: 40px; padding: 0 var(--space-3); border: 1px solid var(--zinc-300); border-radius: var(--radius-md); background: #fff; font: inherit; font-size: var(--text-base); color: var(--zinc-900); }
  .count { margin-top: var(--space-6); font-size: var(--text-md); color: var(--zinc-600); }
  /* 一天一段：左欄日期＋當天到班，右欄當天的課 */
  .day { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: var(--space-2) var(--space-6); padding: var(--space-4) 0; border-bottom: 1px solid var(--surface-border); }
  .day__d { font-size: var(--text-lg); font-weight: var(--font-bold); font-variant-numeric: tabular-nums; }
  .day__d small { margin-left: var(--space-2); font-size: var(--text-md); font-weight: var(--font-medium); color: var(--zinc-600); }
  .day__in { display: block; margin-top: 2px; font-size: var(--text-md); color: var(--zinc-700); font-variant-numeric: tabular-nums; }
  .day__in--no { color: var(--zinc-600); }
  .day__none { align-self: center; font-size: var(--text-md); color: var(--zinc-600); }
  .day--empty { padding: var(--space-3) 0; }
  .day--empty .day__d { font-size: var(--text-base); font-weight: var(--font-semibold); color: var(--zinc-700); }
  .rec { border-radius: var(--radius-md); }
  .rec + .rec { margin-top: var(--space-1); }
  .rec__b { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto 16px; align-items: center; gap: var(--space-3); width: 100%; min-height: 44px; padding: var(--space-2) var(--space-3); border: 0; border-radius: var(--radius-md); background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  .rec__b:hover { background: var(--zinc-50); }
  .rec__b:focus-visible { outline: 2px solid var(--zinc-900); outline-offset: 2px; }
  .rec__b svg:last-child { transition: transform var(--transition-fast); color: var(--zinc-600); }
  .rec__b[aria-expanded='true'] svg:last-child { transform: rotate(180deg); }
  .rec__b[aria-expanded='true'] { background: var(--zinc-100); border-radius: var(--radius-md) var(--radius-md) 0 0; }
  .rec__s { font-weight: var(--font-bold); }
  .rec__s--absent { color: var(--error-700); }
  .rec__s--on_leave, .rec__s--none, .rec__s--later, .rec__s--live { color: var(--zinc-600); font-weight: var(--font-semibold); }
  .rec__c { font-weight: var(--font-semibold); }
  .rec__t { font-size: var(--text-sm); color: var(--zinc-600); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rec__more { display: grid; gap: var(--space-1); padding: var(--space-2) var(--space-3) var(--space-3) calc(56px + var(--space-3) * 2); border-radius: 0 0 var(--radius-md) var(--radius-md); background: var(--zinc-100); font-size: var(--text-md); color: var(--zinc-800); }
  .rec__more b { font-weight: var(--font-semibold); color: var(--zinc-900); }
  .loadmore { display: flex; justify-content: center; padding: var(--space-6) 0; }
  .loadmore .btn { height: 40px; }
  @media (max-width: 860px) {
    .tbar__in { gap: var(--space-2); }
    .seg { flex: 1 1 100%; }
    .seg button { flex: 1; height: 44px; }
    .ym { flex: 1 1 auto; height: 44px; }
    .tbar__act { margin-left: 0; }
    .tbar__act .btn { height: 44px; }
    .day { grid-template-columns: minmax(0, 1fr); gap: var(--space-2); }
    .day--empty { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
    .rec__b { grid-template-columns: 56px minmax(0, 1fr) 16px; gap: 2px var(--space-3); padding: var(--space-2); }
    .rec__t { grid-column: 2; grid-row: 2; }
    .rec__b svg:last-child { grid-column: 3; grid-row: 1 / 3; }
    .rec__more { padding-left: calc(44px + var(--space-3) + var(--space-2)); }
    .loadmore .btn { width: 100%; height: 44px; }
  }
</style>
</head>
<body data-direction="a6">
<div id="app"></div>

<template id="notes">
  <h2>到班紀錄 · 家長端（#990 批 5）</h2>
  <h3>規格 vs 現況</h3>
  <table>
    <thead><tr><th>項目</th><th>應然規格（specs/parent/attendance.md、rules/attendance-rules.md）</th><th>產品現況（sitemap/parent/attendance.md）</th><th>設計稿怎麼畫</th></tr></thead>
    <tbody>
      <tr><td>孩子</td><td>—（共用切換器）</td><td>橘帶左上孩子徽章，≥2 孩子可切換</td><td>共用 <code>A2.kids</code>；切換後整頁換成那個孩子的紀錄。hash 帶 <code>kids-1</code>／<code>kids-0</code>／<code>kids-failed</code> 看其他形態</td></tr>
      <tr><td>頁首錨點</td><td>本月缺席次數（只算缺席、不含請假；跟下方期間無關；沒載到不顯示 0）</td><td>大數字＋「次缺席／本月」</td><td>照做，標籤寫「本月缺席」。標題改成回答家長最常問的那一句：<b>孩子今天到了沒</b>（日到班的刷卡時間或「還沒到」），手機首屏只回答這一題</td></tr>
      <tr><td>期間</td><td>近 10 天／近 30 天／指定月份</td><td>三顆切換鈕；選月份才多出月份輸入框</td><td>照做；月份用原生 <code>input type="month"</code>，範圍是本學期</td></tr>
      <tr><td>逐日清單</td><td>日期、到班狀態（已到班＋時間／未到班）、當天課堂與出勤；沒課寫「今日無課」</td><td>日期（YYYY-MM-DD）＋課堂列；<b>沒有當天的到班時間</b></td><td>左欄日期＋「16:42 到班（掃碼）」或「沒有到班紀錄」；沒課的日子壓成一行淡字，不跟有課的日子搶版面</td></tr>
      <tr><td>出勤三態</td><td>出席／請假／缺席；沒有遲到</td><td>同</td><td>示範資料的 late 一律顯示「出席」。<b>沒有紀錄＋課已結束 ≠ 缺席</b>（rules §6），寫「沒有紀錄」；今天的課寫「上課中」／「還沒上」</td></tr>
      <tr><td>課堂明細</td><td>點課堂列內展開（accordion），再點收合</td><td>就地展開，一次一筆；內容是時間或備註，都沒有就寫「沒有更多資訊」</td><td>照做（一次一筆）。展開內容：上課時間、老師、教室、請假原因／停課原因</td></tr>
      <tr><td>停課</td><td>—</td><td>課堂列帶「停課」chip</td><td>保留：列尾寫「停課 · 原因」</td></tr>
      <tr><td>更多歷史</td><td>往下捲動載入更多</td><td>「載入更多」按鈕</td><td>保留按鈕（捲動自動載入在手機上會讓頁尾永遠到不了）；近 30 天先列 14 天</td></tr>
      <tr><td>家長請假</td><td>rules §4：請假由管理員或家長建立</td><td>家長端沒有請假入口</td><td>工具列加「幫孩子請假」<span class="new">新</span>，用共用的請假表單；送出後範圍內的課就地改成「請假」</td></tr>
    </tbody>
  </table>
  <h3>這一頁</h3>
  <ul>
    <li>示範孩子林子晴（國三、三個班），近 30 天有出席、請假、缺席、停課與「今天上課中」各種列。</li>
    <li>本月錨點跟期間篩選無關：切到「近 30 天」數字不變（規格明寫）。示範的今天是 10/1，所以本月缺席是 0 —— 那是好消息，不是沒資料。</li>
  </ul>
</template>

<script src="../shared/data.js"></script>
<script src="../shared/flow.js"></script>
<script src="../shared/proto.js"></script>
<script src="a6.js"></script>
<script>
(function () {
  const { C, icon, shell, md, wd, kids, forms } = A2;
  const kid = kids.active;
  const cls = kid ? kid.enrollments.map((e) => e.classId) : [];
  const leaves = kid ? C.leaves.filter((l) => l.studentId === kid.id) : [];
  const nowMin = A2.toMin(C.NOW);

  // 這個孩子某一堂的出勤：請假單優先，其次點名紀錄；沒紀錄的課分「還沒上」與「沒有紀錄」（rules §6：不是缺席）
  const extraLeave = [];
  const stOf = (s) => {
    if (s.status === 'cancelled') return 'cancelled';
    if (extraLeave.some((r) => s.date >= r[0] && s.date <= r[1]) || leaves.some((l) => l.date === s.date)) return 'on_leave';
    const v = (C.attendance[s.id] || {})[kid.id];
    if (v) return v === 'late' ? 'present' : v;
    if (s.date === C.TODAY && A2.toMin(s.end) > nowMin) return A2.toMin(s.start) <= nowMin ? 'live' : 'later';
    return 'none';
  };
  const LABEL = { present: '出席', on_leave: '請假', absent: '缺席', none: '沒有紀錄', later: '還沒上', live: '上課中', cancelled: '停課' };
  // ponytail: 示範資料只有今天的刷卡時間；過去的日子用第一堂課開始前 5–44 分鐘合成
  const arrival = (date, list) => {
    if (date === C.TODAY) { const e = A2.todayOf[kid.id]; return e && e.state === 'arrived' ? e.arrivedAt : null; }
    if (!list.some((s) => stOf(s) === 'present')) return null;
    const m = Math.min(...list.map((s) => A2.toMin(s.start))) - 5 - (+date.slice(8) * 7) % 40;
    return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
  };

  // 標題：孩子今天到了沒（手機首屏只回答這一題）
  let title = '到班紀錄';
  if (kid) {
    const t = A2.todayOf[kid.id];
    const todays = C.sessions.filter((s) => cls.includes(s.classId) && s.date === C.TODAY && s.status !== 'cancelled');
    title = !todays.length ? `${kid.name}<br>今天沒有課。`
      : t && t.state === 'arrived' ? `${kid.name}<br>今天 ${t.arrivedAt} 到班。`
      : t && t.state === 'on_leave' ? `${kid.name}<br>今天請假。`
      : t && t.state === 'missing' ? `${kid.name}<br>今天還沒到班。` : `${kid.name}<br>今天還沒到，${todays[0].start} 上課。`;
  }
  const monthStart = C.TODAY.slice(0, 8) + '01';
  const absentMonth = kid ? C.sessions.filter((s) => cls.includes(s.classId) && s.date >= monthStart && s.date <= C.TODAY && stOf(s) === 'absent').length : 0;

  const st = { period: '10', ym: C.TODAY.slice(0, 7), shown: 14, open: null };
  shell({
    role: 'parent', page: 'p-attendance', child: true,
    title, sub: kid ? '日到班：刷卡一次，當天所有的課都算到了。' : '',
    stats: kid ? [{ n: absentMonth, label: '本月缺席', unit: '次' }] : [],
    bar: kid ? `<div class="seg" role="group" aria-label="期間">${[['10', '近 10 天'], ['30', '近 30 天'], ['m', '選月份']].map(([k, l]) => `<button type="button" data-p="${k}" aria-pressed="${k === st.period}">${l}</button>`).join('')}</div>
      <input class="ym" type="month" id="ym" aria-label="月份" min="${C.TERM_START.slice(0, 7)}" max="${C.TODAY.slice(0, 7)}" value="${st.ym}" hidden>
      <div class="tbar__act"><button class="btn" type="button" id="leave">${icon.leave}幫孩子請假<span class="new">新</span></button></div>` : '',
    phase: 1800,
  }, kids.gate(`<p class="count" id="count"></p><div id="list"></div><div class="loadmore" id="lm"></div>`));
  if (!kid) return;

  const range = () => {
    if (st.period === 'm') { const a = st.ym + '-01', end = C.addDays(C.addDays(a, 32).slice(0, 8) + '01', -1); return [a, end < C.TODAY ? end : C.TODAY]; }
    return [C.addDays(C.TODAY, -(+st.period - 1)), C.TODAY];
  };
  const recHtml = (s) => {
    const v = stOf(s), id = s.id;
    const lv = leaves.find((l) => l.date === s.date);
    const more = [`<span>${s.teacher} 老師 · ${s.room}</span>`];
    if (v === 'cancelled') more.push(`<span>停課原因：${s.change ? s.change.reason : '補習班停課'}</span>`);
    if (v === 'on_leave') more.push(`<span>請假${lv ? `：${lv.reason}（${lv.by}${lv.via ? '・' + lv.via : ''}）` : '：家長從這裡送出'}</span>`);
    if (v === 'none') more.push('<span>這堂課沒有點名紀錄，不算缺席。有疑問請聯絡補習班。</span>');
    return `<div class="rec"><button class="rec__b" type="button" aria-expanded="${st.open === id}" aria-controls="m-${id}" data-r="${id}">
      <span class="rec__s rec__s--${v}">${v === 'absent' ? '缺席' : LABEL[v]}</span><span class="rec__c">${s.className}</span><span class="rec__t">${s.start}–${s.end}</span>${icon.down}</button>
      <div class="rec__more" id="m-${id}"${st.open === id ? '' : ' hidden'}>${more.join('')}</div></div>`;
  };
  function render() {
    const [a, b] = range();
    const dates = [];
    for (let d = b; d >= a; d = C.addDays(d, -1)) dates.push(d);
    const vis = st.period === '10' ? dates : dates.slice(0, st.shown);
    document.getElementById('count').textContent = `${md(a)}–${md(b)}，共 ${dates.length} 天`;
    document.getElementById('list').innerHTML = vis.map((d) => {
      const list = C.sessions.filter((s) => cls.includes(s.classId) && s.date === d).sort((x, y) => (x.start < y.start ? -1 : 1));
      const head = `<span class="day__d">${md(d)}<small>週${wd(d)}${d === C.TODAY ? '・今天' : ''}</small></span>`;
      if (!list.length) return `<section class="day day--empty">${head}<span class="day__none">今日無課</span></section>`;
      const t = arrival(d, list);
      const allOff = list.every((s) => ['on_leave', 'cancelled'].includes(stOf(s)));
      return `<section class="day"><div>${head}<span class="day__in${t ? '' : ' day__in--no'}">${t ? `${t} 到班` : allOff ? '這天不用到' : d === C.TODAY ? '還沒到班' : '沒有到班紀錄'}</span></div>
        <div>${list.map(recHtml).join('')}</div></section>`;
    }).join('');
    document.getElementById("lm").innerHTML = vis.length < dates.length ? `<button class="btn" type="button" id="loadmore">載入更多（還有 ${dates.length - vis.length} 天）</button>` : '';
  }
  render();

  document.addEventListener('click', (e) => {
    const p = e.target.closest('[data-p]');
    if (p) {
      st.period = p.dataset.p; st.shown = 14; st.open = null;
      document.querySelectorAll('[data-p]').forEach((x) => x.setAttribute('aria-pressed', x === p));
      document.getElementById('ym').hidden = st.period !== 'm';
      render();
      return;
    }
    const r = e.target.closest('[data-r]');
    if (r) { st.open = st.open === r.dataset.r ? null : r.dataset.r; render(); document.querySelector(`[data-r="${r.dataset.r}"]`).focus(); return; }
    if (e.target.closest('#loadmore')) { st.shown += 14; render(); return; }
    if (e.target.closest('#leave')) forms.leave({ studentId: kid.id, onDone: (_, v) => { extraLeave.push([v.d1, v.d2]); render(); } });
  });
  document.getElementById('ym').addEventListener('change', (e) => { if (e.target.value) { st.ym = e.target.value; st.open = null; render(); } });
})();
</script>
</body>
</html>
