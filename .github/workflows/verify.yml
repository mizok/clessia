name: verify

# 這是專案唯一「不可繞過」的驗證層。
#
# 本機的 Stop hook 跑的是同一組 gate，但它繞得過（Bash heredoc 寫檔不觸發 PreToolUse、
# CLESSIA_STOP_GATE=0、git commit --no-verify、直接關掉 hook）。所以本機那層的定位是
# 「把回饋左移到編輯當下」，真正的把關在這裡。
#
# 刻意用 run-many 而不是 affected：整套跑完本機只要 8 秒，affected 需要正確的 base ref
# （nx.json 的 defaultBase 是不存在的 `dev`），為了省幾秒去換一個會安靜失準的東西不划算。

# 觸發條件刻意涵蓋所有分支的 push，而不是只有 main + PR：
# 這個專案的實際工作方式是在長期 feature branch 上直接推送，PR 開得晚。
# 只掛 main + pull_request 的話，功能開發全程都不會有任何 CI 回饋 —— 第一版就是這樣寫的，
# 推上去之後零個 run，連 workflow 語法都沒被 GitHub 驗證到。
#
# 不另外掛 pull_request：開 PR 時該 commit 早已被 push 驗證過，重複跑只是浪費。
on:
  push:
  workflow_dispatch:

# 同一個**分支**連續推送時取消前一次，只留最新結果 —— **但 main 例外**。
#
# `github.ref` 涵蓋 `refs/heads/main`，而註解原本寫的意圖是「同一個 PR」——
# **作用範圍比註解描述的大**。於是 main 的每一次 push 都會殺掉前一次，
# 而 main 的每個 commit 是一個獨立、需要各自被驗證的狀態。
#
# 實測（2026-09-07，issue #600）：verify.yml 在 main 上最近 30 顆 run
# **28 顆 cancelled、1 顆 success**。那不是「板上很安靜」——
# **沒有紅燈不代表綠，代表一整段時間沒有觀測**。
#
# 更尖的後果：「PR 綠不蘊含 main 綠」那條規則今晚才實際發生過一次
#（A21 合進 main 才紅在 sync-feature-map，#563）——
# **而如果 main 的 CI 從來沒跑完，那條規則就永遠沒有機會生效。
# 守衛存在，但它從來沒被執行過。**
#
# 代價是合併密集時 main 會有多顆 run 並行、CI 分鐘數上升。那是刻意換的：
# 沒有結論就無法二分，而 main 壞掉時「是哪一筆造成的」正是唯一要回答的問題。
#
# ⚠️ **改這個表達式之前先想清楚怎麼驗它。** 它的兩個分支要用兩支分支去證：
# 在任何非 main 的分支上它都是 `true`，所以「推兩個 commit 到測試分支看兩顆都跑完」
# **會得到相反的結果，而那個失敗跟「修法無效」長得一模一樣**。
# 2026-09-07 的驗法寫在 PR 裡：拋棄式分支＋暫時把它加進例外，兩個方向各驗一次。
concurrency:
  # **main 的每一顆 commit 各自一個 group。** 尾巴在非 main 分支上是空字串，
  # 所以那些分支的 group 跟以前完全一樣。
  #
  # 為什麼不能只靠下面那個 `cancel-in-progress`（#603 就是只做了那半，不夠）：
  # `cancel-in-progress: false` 的語意是「**不要殺正在跑的那顆**」，後來的 run 會
  # **排隊**在同一個 group 上 —— 而**同一個 group 最多只留一顆排隊中的**，
  # 第三顆一到，中間那顆排隊的就被取消。
  #
  # 於是行為只是從「新的殺舊的」變成「最舊的活著跑完、中間排隊的被丟掉」，
  # **而這支 workflow 要的是「main 的每一筆都有結論，壞了可以二分」**。
  # 實測（2026-09-07）：`9a5daa89` 在 #603 之後照樣 cancelled，**且 jobs 長度 0**
  #（從頭到尾沒開始），`bf25e948` 出現的下一秒它就被丟掉。
  group: verify-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 完整歷史。原本的理由是 kb-gate 用 git log 推導 `updated` 欄位，
          # 那支腳本在移植 kb-wiki 時就退掉了 —— **理由過期但設定保留**：
          # 這個 workflow 目前用 run-many（見檔案開頭），不需要 base ref，
          # 所以嚴格說 fetch-depth 可以拿掉。留著是因為之後若改用 affected 會需要，
          # 而 shallow clone 造成的失敗很難查。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # apps/api 是獨立的 npm package（有自己的 package.json / package-lock.json，因為它用
      # wrangler 部署到 Cloudflare Workers），依賴不會被根目錄的 npm ci 裝起來。
      # 本機測試之所以會過，是因為 apps/api/node_modules 早就存在 —— CI 第一次跑才暴露。
      - run: npm ci
        working-directory: apps/api

      # ── 文件與現實是否同步（skill 清單、入口檔行數、憲法條款引用、route 角色宣告、
      #    RLS、deny 規則目標、createUser 不帶密碼、功能區現況表）
      #    **不含 kb/ 的內容健康度** —— 那由 kb-wiki skill 的 lint 負責，是人觸發的
      - name: harness
        run: npm run harness

      # ── harness 自己的單元測試：規則引擎壞掉時，上面那層會安靜地放行
      - name: harness self-test
        run: npm run harness:test

      - name: typecheck
        run: npx nx run-many -t typecheck

      # `--output-style=stream` 不是為了好看，是**為了讓 web 的測試結果存在**。
      #
      # nx 在多專案時會**捕捉**每個任務的輸出、最後分組重播。而重播出來的
      # `web:test` 群組只有 build 與 bundle 表格 —— **139 個測試檔、1096 條測試的
      # 結果一行都沒有**。api 的看得到只是因為它的輸出剛好是串流的。
      #
      # 決定性的對照是：**綠燈那次的同一個群組，輸出形狀一模一樣**
      # （`Building` → 表格 → `endgroup`，同樣沒有測試結果），差別只有 ✅ 與 ❌。
      #
      # 所以 web:test 紅的時候，CI log 裡沒有任何可讀的東西 ——
      # **真紅跟假紅長得一樣，是因為兩者都沒有內容**。每個人撞到都得
      # 「查 log → 發現沒有斷言失敗 → 猜是瞬斷 → rerun」，一輪來回。
      #
      # 代價：串流之後兩個專案的輸出會交錯。**那比乾淨但空白的輸出有用得多。**
      - name: test
        run: npx nx run-many -t test --output-style=stream

      # ── web 的 production build。
      #    **模板型別檢查已經不靠這一步了** —— 2026-09-03 給 web 加了 typecheck target
      #    （`ngc --noEmit`，含模板），上面那步的 run-many 已經涵蓋 web。
      #    留著這步是因為它還檢查別的東西：bundle budgets、fileReplacements、實際打包得起來。
      #    上面那些 gate 全部會綠燈放行。
      #    放在最後：它是整條序列裡最慢的一步，前面便宜的檢查先紅先省時間。
      - name: build web
        run: npx nx build web --configuration=production

  # ── seed 能不能真的跑起來 —— 「沒人跑得動的東西不會有人發現它壞了」（#841）──────
  #
  # #838：`seed.sql` 的一段依賴另一支要手動套的檔案，而 `db:reset` 被
  # `.claude/settings.json` 的 deny 擋著 —— **長期沒有人跑得動，所以沒有人發現它壞了**，
  # 直到第一次真的跑就整批 rollback、本機變成空庫。期間那支 seed 被改過好幾次，
  # 每一次都只在「作者自己那台已經手動套過補充資料的機器」上驗過。
  #
  # 這個 job 把那件事搬到 CI：**真的起一次 Postgres、真的跑一次 reset、真的查資料在不在。**
  #
  # **只在動到 `supabase/**` 的 push 上跑。** 它要拉 Docker image、起整組 stack，
  # 比 `verify` 慢一個量級，而 seed 與 migration 只會因為那個目錄的改動而壞。
  #
  # ⚠️ `on.push.paths` 會過濾**整個 workflow**（連 `verify` 一起關掉），所以過濾做在
  # job 內、用 `git diff` 自己判 —— 不引入第三方 action。
  seed-reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 要跟前一次 push 比 diff，所以需要歷史
          fetch-depth: 0

      # ⚠️ **`github.event.before` 對新分支的第一次 push 是全零**，而**那是這個 repo 的常態**
      # ——本檔開頭自己寫著「實際工作方式是在長期 feature branch 上直接推送，PR 開得晚」。
      # 第一版只靠 `before`，於是 fail-open 分支幾乎每支 PR 都會走到：
      # #845（只動 `herdr-team/` 兩個檔）照樣跑完整的 `db reset`，**filter 等於沒作用**。
      #
      # 所以 `before` 不可用時**退到 merge-base**（這支分支從 main 分出去的那一點）——
      # 那才是「這支分支改了什麼」的正確 base。只有連 merge-base 都算不出來才 fail-open。
      #
      # **每一條路徑都印出 base 與 diff。** 這一步的產出是「跑或不跑」，
      # 而判錯的方向是靜默的 —— 上一版就是靠 log 第一行印出的 `base='000…0'` 才查出來的。
      - name: 這次 push 有沒有動到 supabase/
        id: scope
        run: |
          before='${{ github.event.before }}'
          base=''

          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$before^{commit}" 2>/dev/null; then
            base="$before"
            echo "base 來源：github.event.before"
          else
            # 新分支的第一次 push、force-push、或 before 已經不在本地歷史裡
            git fetch --no-tags origin main 2>/dev/null || true
            base="$(git merge-base FETCH_HEAD HEAD 2>/dev/null \
                    || git merge-base origin/main HEAD 2>/dev/null || true)"
            echo "base 來源：merge-base 對 main（before 是 '$before'）"
          fi

          echo "base=$base"

          if [ -z "$base" ]; then
            echo '連 merge-base 都算不出來 —— 保守起見照跑（漏跑一次才是風險）'
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo '這個範圍動到的檔（前 20 筆）:'
          git diff --name-only "$base" HEAD | head -20

          if git diff --name-only "$base" HEAD | grep -q '^supabase/'; then
            echo 'supabase/ 有改動 —— 跑'
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'supabase/ 沒動 —— 跳過'
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.scope.outputs.run == 'true'
        with:
          version: latest

      # `db start` 而不是 `start`：只要 Postgres（＋ migration／seed 的執行環境），
      # 不需要 Studio / Kong / Realtime 那一整套 —— 少拉幾個 image。
      - name: supabase db start
        if: steps.scope.outputs.run == 'true'
        run: supabase db start

      # 這一步就是 #838 第一次跑就炸的那一步。
      # **它會真的執行全部 migration 與 `sql_paths` 裡的每一支 seed。**
      - name: supabase db reset
        if: steps.scope.outputs.run == 'true'
        run: supabase db reset

      # **「沒有報錯」證不出「資料在」** —— 哨兵查的是後者（理由寫在那支 SQL 的檔頭）。
      - name: seed 哨兵
        if: steps.scope.outputs.run == 'true'
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/seed-sentinels.sql

  # ── main 上自動重生現況表 ──────────────────────────────────────────────────────────────
  #
  # 為什麼要有這個 job：`kb/wiki/roadmap.md` 的功能區現況表是**從整個 repo 的磁碟狀態**
  # 推導的，所以任何兩支並行分支只要各自新增了頁面或 route，就會各自重生出不同的表，
  # 然後在 main 上撞成衝突 —— 2026-08-29 一天內 #66 / #68 / #71 三連撞。
  # 撞的不是任何人的實質改動，是一張**可以重新生成**的表，純粹的儀式成本。
  #
  # 所以強制點就是這個 job：**表過期在任何環境都只是警告**，重生由這裡做。
  #
  # 一度還在 main 上留了一道「表過期就紅」的雙保險，結果是死結 —— 讓 verify 紅的正是這個
  # job 要修的那件事，而它掛著 `needs: verify`，於是**能修表的 job 只在表沒壞時才跑**。
  # 2026-08-30 #82 接上餐費頁之後真的卡住，要人工代打 2 行才解堵（5be7927）。
  #
  # `needs: verify` 保留：現在讓 verify 紅的只剩真的壞掉的東西（typecheck / test / build /
  # 其他 gate），那種情況下確實不該疊自動 commit。這個 job 自己重生失敗會讓自己紅，
  # 所以覆蓋沒有變薄。
  #
  # **不涵蓋 kb/wiki/index.md 與各分類的 _moc.md**：那些由 kb-wiki skill 生成，而 skill 住在
  # 使用者的家目錄、不在版控裡（CI 上根本沒有），改由計畫席在部署窗口手動跑 `/kb-wiki map`。
  sync-feature-map:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A21（campus param guard）會經 collectApiParams 起一支 probe，那支在 apps/api 底下
      # `import('./src/index.ts')` —— 需要 apps/api 自己的依賴。verify job 早就裝了它
      # （見上方 45-51 行的註解），**而這個 job 沒有**，於是 A21 一落地 main 就紅在這裡。
      # 那段註解寫對了診斷，只是寫在另一個 job 旁邊 —— 規則離它守護的東西太遠。
      - run: npm ci
        working-directory: apps/api

      - name: 重生現況表
        run: npm run harness:write

      # 零 diff 就什麼都不做 —— 絕大多數的 main push 會走這條。
      # commit 訊息帶 [skip ci] 防循環（GITHUB_TOKEN 的 push 本來就不會再觸發 workflow，
      # 但這件事是 GitHub 的行為不是我們的保證，寫上去比較便宜）。
      - name: 有變化才 commit
        run: |
          git add kb/wiki/roadmap.md AGENTS.md tools/agent-harness/skills-lock.json
          if git diff --cached --quiet; then
            echo "現況表已同步，無需 commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(harness): 自動重生功能區現況表 [skip ci]'
          # main 在這幾秒內又前進的話 rebase 一次再推；再失敗就讓 job 紅，
          # 下一次 main push 也會把表補上，不會靜默漏掉
          git push || (git pull --rebase && git push)
