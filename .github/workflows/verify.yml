name: verify

# 這是專案唯一「不可繞過」的驗證層。
#
# 本機的 Stop hook 跑的是同一組 gate，但它繞得過（Bash heredoc 寫檔不觸發 PreToolUse、
# CLESSIA_STOP_GATE=0、git commit --no-verify、直接關掉 hook）。所以本機那層的定位是
# 「把回饋左移到編輯當下」，真正的把關在這裡。
#
# 刻意用 run-many 而不是 affected：整套跑完本機只要 8 秒，affected 需要正確的 base ref
# （nx.json 的 defaultBase 是不存在的 `dev`），為了省幾秒去換一個會安靜失準的東西不划算。

# 觸發條件刻意涵蓋所有分支的 push，而不是只有 main + PR：
# 這個專案的實際工作方式是在長期 feature branch 上直接推送，PR 開得晚。
# 只掛 main + pull_request 的話，功能開發全程都不會有任何 CI 回饋 —— 第一版就是這樣寫的，
# 推上去之後零個 run，連 workflow 語法都沒被 GitHub 驗證到。
#
# 不另外掛 pull_request：開 PR 時該 commit 早已被 push 驗證過，重複跑只是浪費。
on:
  push:
  workflow_dispatch:

# 同一個 PR 連續推送時取消前一次，只留最新結果
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 完整歷史。原本的理由是 kb-gate 用 git log 推導 `updated` 欄位，
          # 那支腳本在移植 kb-wiki 時就退掉了 —— **理由過期但設定保留**：
          # 這個 workflow 目前用 run-many（見檔案開頭），不需要 base ref，
          # 所以嚴格說 fetch-depth 可以拿掉。留著是因為之後若改用 affected 會需要，
          # 而 shallow clone 造成的失敗很難查。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # apps/api 是獨立的 npm package（有自己的 package.json / package-lock.json，因為它用
      # wrangler 部署到 Cloudflare Workers），依賴不會被根目錄的 npm ci 裝起來。
      # 本機測試之所以會過，是因為 apps/api/node_modules 早就存在 —— CI 第一次跑才暴露。
      - run: npm ci
        working-directory: apps/api

      # ── 文件與現實是否同步（skill 清單、入口檔行數、憲法條款引用、route 角色宣告、
      #    RLS、deny 規則目標、createUser 不帶密碼、功能區現況表）
      #    **不含 kb/ 的內容健康度** —— 那由 kb-wiki skill 的 lint 負責，是人觸發的
      - name: harness
        run: npm run harness

      # ── harness 自己的單元測試：規則引擎壞掉時，上面那層會安靜地放行
      - name: harness self-test
        run: npm run harness:test

      - name: typecheck
        run: npx nx run-many -t typecheck

      # `--output-style=stream` 不是為了好看，是**為了讓 web 的測試結果存在**。
      #
      # nx 在多專案時會**捕捉**每個任務的輸出、最後分組重播。而重播出來的
      # `web:test` 群組只有 build 與 bundle 表格 —— **139 個測試檔、1096 條測試的
      # 結果一行都沒有**。api 的看得到只是因為它的輸出剛好是串流的。
      #
      # 決定性的對照是：**綠燈那次的同一個群組，輸出形狀一模一樣**
      # （`Building` → 表格 → `endgroup`，同樣沒有測試結果），差別只有 ✅ 與 ❌。
      #
      # 所以 web:test 紅的時候，CI log 裡沒有任何可讀的東西 ——
      # **真紅跟假紅長得一樣，是因為兩者都沒有內容**。每個人撞到都得
      # 「查 log → 發現沒有斷言失敗 → 猜是瞬斷 → rerun」，一輪來回。
      #
      # 代價：串流之後兩個專案的輸出會交錯。**那比乾淨但空白的輸出有用得多。**
      - name: test
        run: npx nx run-many -t test --output-style=stream

      # ── web 的 production build。
      #    **模板型別檢查已經不靠這一步了** —— 2026-09-03 給 web 加了 typecheck target
      #    （`ngc --noEmit`，含模板），上面那步的 run-many 已經涵蓋 web。
      #    留著這步是因為它還檢查別的東西：bundle budgets、fileReplacements、實際打包得起來。
      #    上面那些 gate 全部會綠燈放行。
      #    放在最後：它是整條序列裡最慢的一步，前面便宜的檢查先紅先省時間。
      - name: build web
        run: npx nx build web --configuration=production

  # ── main 上自動重生現況表 ──────────────────────────────────────────────────────────────
  #
  # 為什麼要有這個 job：`kb/wiki/roadmap.md` 的功能區現況表是**從整個 repo 的磁碟狀態**
  # 推導的，所以任何兩支並行分支只要各自新增了頁面或 route，就會各自重生出不同的表，
  # 然後在 main 上撞成衝突 —— 2026-08-29 一天內 #66 / #68 / #71 三連撞。
  # 撞的不是任何人的實質改動，是一張**可以重新生成**的表，純粹的儀式成本。
  #
  # 所以強制點就是這個 job：**表過期在任何環境都只是警告**，重生由這裡做。
  #
  # 一度還在 main 上留了一道「表過期就紅」的雙保險，結果是死結 —— 讓 verify 紅的正是這個
  # job 要修的那件事，而它掛著 `needs: verify`，於是**能修表的 job 只在表沒壞時才跑**。
  # 2026-08-30 #82 接上餐費頁之後真的卡住，要人工代打 2 行才解堵（5be7927）。
  #
  # `needs: verify` 保留：現在讓 verify 紅的只剩真的壞掉的東西（typecheck / test / build /
  # 其他 gate），那種情況下確實不該疊自動 commit。這個 job 自己重生失敗會讓自己紅，
  # 所以覆蓋沒有變薄。
  #
  # **不涵蓋 kb/wiki/index.md 與各分類的 _moc.md**：那些由 kb-wiki skill 生成，而 skill 住在
  # 使用者的家目錄、不在版控裡（CI 上根本沒有），改由計畫席在部署窗口手動跑 `/kb-wiki map`。
  sync-feature-map:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A21（campus param guard）會經 collectApiParams 起一支 probe，那支在 apps/api 底下
      # `import('./src/index.ts')` —— 需要 apps/api 自己的依賴。verify job 早就裝了它
      # （見上方 45-51 行的註解），**而這個 job 沒有**，於是 A21 一落地 main 就紅在這裡。
      # 那段註解寫對了診斷，只是寫在另一個 job 旁邊 —— 規則離它守護的東西太遠。
      - run: npm ci
        working-directory: apps/api

      - name: 重生現況表
        run: npm run harness:write

      # 零 diff 就什麼都不做 —— 絕大多數的 main push 會走這條。
      # commit 訊息帶 [skip ci] 防循環（GITHUB_TOKEN 的 push 本來就不會再觸發 workflow，
      # 但這件事是 GitHub 的行為不是我們的保證，寫上去比較便宜）。
      - name: 有變化才 commit
        run: |
          git add kb/wiki/roadmap.md AGENTS.md tools/agent-harness/skills-lock.json
          if git diff --cached --quiet; then
            echo "現況表已同步，無需 commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(harness): 自動重生功能區現況表 [skip ci]'
          # main 在這幾秒內又前進的話 rebase 一次再推；再失敗就讓 job 紅，
          # 下一次 main push 也會把表補上，不會靜默漏掉
          git push || (git pull --rebase && git push)
